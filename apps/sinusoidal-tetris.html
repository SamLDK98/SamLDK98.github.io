<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sinusoidal Tetris: flatten a signal by dropping sine waves onto it. A walkthrough and a set of games." />
  <title>Sinusoidal Tetris | Apps | Sam Kirwan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08090b;
      --text: #f4f5f8;
      --soft: rgba(244, 245, 248, 0.6);
      --accent: #e8a33d;
    }
    html, body { min-height: 100%; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* a faint wave settling flat behind the page, again and again */
    .wave { position: fixed; inset: 0; z-index: 0; width: 100vw; height: 100svh; pointer-events: none; }
    main {
      position: relative; z-index: 1;
      width: min(46rem, calc(100% - 2rem));
      margin-left: clamp(2rem, 11vw, 10rem);
      padding: clamp(3rem, 9vh, 5.5rem) 0;
    }
    .crumb { display: inline-block; margin-bottom: 1.6rem; font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); text-decoration: none; }
    .crumb::before { content: "← "; }
    .crumb:hover { color: var(--text); }
    h1 {
      font-size: clamp(3rem, 7vw, 5.4rem);
      font-weight: 300;
      line-height: 0.96;
      letter-spacing: -0.045em;
    }
    nav { margin-top: clamp(2.4rem, 6vh, 4rem); }
    ul { list-style: none; counter-reset: page; }
    li { counter-increment: page; display: flex; align-items: baseline; gap: 1.1rem; }
    li::before {
      content: counter(page, decimal-leading-zero);
      min-width: 1.6rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent);
      opacity: 0.8;
    }
    li + li { margin-top: 0.7rem; }
    nav a {
      display: inline-block;
      color: var(--text);
      font-size: clamp(1rem, 1.65vw, 1.25rem);
      font-weight: 300;
      line-height: 1.35;
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }
    nav a:hover, nav a:focus-visible { color: var(--accent); outline: none; transform: translateX(3px); }
    @media (max-width: 560px) {
      main { width: min(27rem, calc(100% - 4rem)); margin-left: 2rem; }
      h1 { font-size: clamp(2.7rem, 13vw, 4rem); }
    }
    @media (prefers-reduced-motion: reduce) { nav a { transition: none; } }
  </style>
</head>
<body>
  <canvas class="wave" aria-hidden="true"></canvas>
  <main>
    <a class="crumb" href="../apps.html">Apps</a>
    <h1>Sinusoidal Tetris</h1>
    <nav aria-label="Sinusoidal Tetris pages">
      <ul>
        <li><a href="sinusoidal-tetris-sinusoidal-waves.html">Sinusoidal Waves</a></li>
        <li><a href="sinusoidal-tetris-adding-waves.html">Adding Waves</a></li>
        <li><a href="sinusoidal-tetris-decomposing.html">Decomposing a Composite Signal</a></li>
        <li><a href="sinusoidal-tetris-walkthrough.html">Flattening a Signal</a></li>
        <li><a href="sinusoidal-tetris-one-wave.html">Cancel One Wave</a></li>
        <li><a href="sinusoidal-tetris-two-waves.html">Cancel Two Waves</a></li>
      </ul>
    </nav>
  </main>
  <script>
    // Behind the page: a wave near the bottom is flattened by its mirror image sweeping across it,
    // then a new wave appears and the cycle repeats. Still for reduced motion.
    (function () {
      var c = document.querySelector(".wave"); if (!c || !c.getContext) return;
      var ctx = c.getContext("2d"), W, H, still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var w = { A: 1, f: 2, p: 0 }, t0 = 0;
      function size() { var k = window.devicePixelRatio || 1; W = window.innerWidth; H = window.innerHeight; c.width = W * k; c.height = H * k; ctx.setTransform(k, 0, 0, k, 0, 0); }
      function fresh() { w = { A: 0.6 + Math.random() * 0.6, f: 1 + Math.floor(Math.random() * 4), p: Math.random() * 6.283 }; }
      function draw(now) {
        if (!t0) t0 = now;
        var e = (now - t0) / 1000, sweep = Math.max(0, Math.min(1, (e - 3) / 2.5)), fade = e > 7 ? Math.max(0, 1 - (e - 7) / 1) : 1;
        if (e > 8.2) { fresh(); t0 = now; }
        ctx.clearRect(0, 0, W, H);
        var y0 = H * 0.84, amp = Math.min(34, H * 0.05), drift = now / 1000 * 0.4;
        ctx.strokeStyle = "rgba(232, 163, 61, 0.22)"; ctx.lineWidth = 1.3; ctx.beginPath();
        for (var x = 0; x <= W; x += 3) {
          var u = x / W, v = (u <= sweep ? 0 : 1) * w.A * Math.sin(2 * Math.PI * w.f * u + w.p + drift);
          var y = y0 - amp * v; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.globalAlpha = fade; ctx.stroke(); ctx.globalAlpha = 1;
        if (!still) requestAnimationFrame(draw);
      }
      size(); window.addEventListener("resize", function () { size(); if (still) draw(1); });
      still ? draw(1) : requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
