<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Segment length in Welch's method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { --pow: #ff5cb8; }
  svg text { font-size: 11px; }
  .axis { stroke: var(--faint); stroke-width: 1.3; }
  .grid { stroke: var(--hair); stroke-width: 1; }
  .truth { fill: none; stroke: var(--ink); stroke-opacity: 0.45; stroke-width: 1.2; stroke-dasharray: 4 4; }
  .psd { fill: none; stroke: var(--pow); stroke-width: 1.5; stroke-linejoin: round; }
  .band { fill: var(--alpha); fill-opacity: 0.07; }
  text.fl { fill: var(--freq); fill-opacity: 0.8; text-anchor: middle; }
  text.yl { fill: var(--pow); fill-opacity: 0.75; text-anchor: end; }
  text.cap { fill: var(--dim); }
  text.al { fill: var(--alpha); fill-opacity: 0.8; text-anchor: middle; }
  .lab { text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--dim); margin-top: 0.6rem; }
  .readouts { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.3rem 1.6rem; margin-top: 0.8rem;
    font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: var(--dim); }
  .readouts b { font-weight: 400; color: var(--ink); }
  .legend { text-align: center; font-family: system-ui, sans-serif; font-size: 0.8rem; color: var(--dim); margin-top: 0.5rem; }
  .legend .k-est { color: var(--pow); }
</style>
</head>
<body>
<div class="widget">
  <svg id="plot" viewBox="0 0 560 240" role="img" aria-label="Estimated power spectrum of a simulated 2.5-minute recording, for the chosen segment length"></svg>
  <p class="legend"><span class="k-est">solid: estimate</span> · dashed: the true spectrum the recording was simulated from</p>
  <div class="lab">segment length</div>
  <div class="choices" role="group" aria-label="Segment length">
    <button type="button" data-sec="0.5" aria-pressed="false">0.5 s</button>
    <button type="button" data-sec="1" aria-pressed="false">1 s</button>
    <button type="button" data-sec="2" aria-pressed="true">2 s</button>
    <button type="button" data-sec="4" aria-pressed="false">4 s</button>
    <button type="button" data-sec="8" aria-pressed="false">8 s</button>
    <button type="button" data-sec="150" aria-pressed="false">whole 150 s</button>
  </div>
  <div class="readouts">
    <span>segments averaged <b id="k"></b></span>
    <span>frequency resolution <b id="df"></b></span>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // 150 s of simulated EEG at 128 Hz, built to have a known spectrum: a 1/f-like background,
  // an alpha peak at 10 Hz and a small beta bump near 21 Hz. Each setting cuts it into segments of the
  // chosen length, overlapping by half, applies a Hann window, and averages the periodograms.
  // "whole 150 s" is a single Hann-windowed periodogram of the full recording.
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("plot");
  const FS = 128, DUR = 150, N = FS * DUR, LO = 1, HI = 40;
  const L = 52, R = 540, TOP = 12, B = 204, YMIN = 0.03, YMAX = 300;

  const truth = f => 60 / Math.pow(f + 1, 1.5) + 8 * Math.exp(-((f - 10) ** 2) / (2 * 0.7 ** 2)) + 0.6 * Math.exp(-((f - 21) ** 2) / (2 * 1.5 ** 2));

  // seeded randomness, so every visit shows the same recording
  let seed = 11;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };

  // a mixed-radix FFT, so any length works (19,200 = 2^8 · 3 · 5^2)
  function fft(re, im) {
    const n = re.length;
    if (n === 1) return [re.slice(), im.slice()];
    let p = 2; while (n % p) p++;
    const m = n / p, subs = [];
    for (let q = 0; q < p; q++) {
      const sr = new Float64Array(m), si = new Float64Array(m);
      for (let i = 0; i < m; i++) { sr[i] = re[i * p + q]; si[i] = im[i * p + q]; }
      subs.push(fft(sr, si));
    }
    const outR = new Float64Array(n), outI = new Float64Array(n);
    for (let k = 0; k < n; k++) {
      let ar = 0, ai = 0;
      for (let q = 0; q < p; q++) {
        const a = -2 * Math.PI * q * k / n, c = Math.cos(a), s = Math.sin(a);
        const [fr, fi] = subs[q], j = k % m;
        ar += fr[j] * c - fi[j] * s; ai += fr[j] * s + fi[j] * c;
      }
      outR[k] = ar; outI[k] = ai;
    }
    return [outR, outI];
  }

  // build the recording in the frequency domain: E|X_k|^2 = N·fs·S(f_k)/2, so a periodogram recovers S
  const Xr = new Float64Array(N), Xi = new Float64Array(N);
  for (let k = 1; k < N / 2; k++) {
    const sd = Math.sqrt(N * FS * truth(k * FS / N) / 2) / Math.SQRT2;
    Xr[k] = sd * gauss(); Xi[k] = sd * gauss();
    Xr[N - k] = Xr[k]; Xi[N - k] = -Xi[k];
  }
  const [xr] = fft(Xr, Xi.map(v => -v));     // inverse transform via conjugation
  const x = xr.map(v => v / N);

  function welch(segLen) {
    const hop = segLen === N ? N : segLen / 2;
    const w = Array.from({ length: segLen }, (_, n) => 0.5 * (1 - Math.cos(2 * Math.PI * n / segLen)));
    const u = w.reduce((s, v) => s + v * v, 0);
    const psd = new Float64Array(segLen / 2 + 1);
    let K = 0;
    for (let start = 0; start + segLen <= N; start += hop) {
      let mean = 0; for (let n = 0; n < segLen; n++) mean += x[start + n]; mean /= segLen;
      const re = new Float64Array(segLen), im = new Float64Array(segLen);
      for (let n = 0; n < segLen; n++) re[n] = (x[start + n] - mean) * w[n];
      const [fr, fi] = fft(re, im);
      for (let k = 0; k <= segLen / 2; k++) psd[k] += 2 * (fr[k] ** 2 + fi[k] ** 2) / (FS * u);
      K++;
    }
    return { psd: psd.map(v => v / K), K, df: FS / segLen };
  }

  const fx = f => L + (f - LO) / (HI - LO) * (R - L);
  const py = p => { const v = Math.min(YMAX, Math.max(YMIN, p)); return B - Math.log10(v / YMIN) / Math.log10(YMAX / YMIN) * (B - TOP); };
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (text != null) e.textContent = text; svg.appendChild(e); return e; };

  el("rect", { class: "band", x: fx(8), y: TOP, width: fx(13) - fx(8), height: B - TOP });
  el("text", { class: "al", x: (fx(8) + fx(13)) / 2, y: TOP + 12 }, "alpha");
  for (const p of [0.1, 1, 10, 100]) { el("line", { class: "grid", x1: L, x2: R, y1: py(p), y2: py(p) }); el("text", { class: "yl", x: L - 6, y: py(p) + 4 }, p); }
  for (const f of [1, 10, 20, 30, 40]) el("text", { class: "fl", x: fx(f), y: B + 16 }, f);
  el("line", { class: "axis", x1: L, x2: R, y1: B, y2: B });
  el("line", { class: "axis", x1: L, x2: L, y1: TOP, y2: B });
  el("text", { class: "cap", x: (L + R) / 2, y: B + 32, "text-anchor": "middle" }, "frequency (Hz)");
  el("text", { class: "cap", x: 12, y: (TOP + B) / 2, "text-anchor": "middle", transform: `rotate(-90 12 ${(TOP + B) / 2})` }, "power (µV²/Hz)");

  const tpts = []; for (let f = LO; f <= HI; f += 0.05) tpts.push(`${fx(f).toFixed(1)},${py(truth(f)).toFixed(1)}`);
  el("path", { class: "truth", d: "M" + tpts.join(" L") });
  const est = el("path", { class: "psd" });

  const cache = {};
  function show(sec) {
    const segLen = Math.round(sec * FS);
    const r = cache[sec] || (cache[sec] = welch(segLen));
    const pts = [];
    for (let k = 0; k < r.psd.length; k++) {
      const f = k * r.df;
      if (f < LO - r.df || f > HI + r.df) continue;
      pts.push(`${fx(Math.min(HI, Math.max(LO, f))).toFixed(1)},${py(r.psd[k]).toFixed(1)}`);
    }
    est.setAttribute("d", "M" + pts.join(" L"));
    document.getElementById("k").textContent = r.K;
    const df = r.df;
    document.getElementById("df").textContent = df >= 0.1 ? df.toFixed(df < 1 ? 3 : 0).replace(/0+$/, "").replace(/\.$/, "") + " Hz" : df.toFixed(4) + " Hz";
  }

  document.querySelectorAll(".choices button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".choices button").forEach(o => o.setAttribute("aria-pressed", o === b));
    show(+b.dataset.sec);
  }));
  show(2);
</script>
</body>
</html>
