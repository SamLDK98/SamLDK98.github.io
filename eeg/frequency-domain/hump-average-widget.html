<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Why the MAD is above half</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .box { fill: none; stroke: var(--dim); stroke-dasharray: 4 4; }
  .base { stroke: var(--dim); stroke-width: 1; }
  .fill-v { fill: var(--amp); fill-opacity: 0.22; }
  .fill-extra { fill: var(--amp); fill-opacity: 0.55; }
  .v-ghost { fill: none; stroke: var(--ink); stroke-opacity: 0.35; stroke-dasharray: 3 4; stroke-width: 1.2; }
  .hump { fill: none; stroke: var(--ink); stroke-width: 2; }
  .avg { stroke: var(--amp); stroke-width: 2; }
  .ruler { stroke: var(--ink); stroke-opacity: 0.6; stroke-width: 1.2; stroke-dasharray: 2 3; }
  svg text.half { fill: var(--ink); fill-opacity: 0.75; }
  .dot { fill: var(--ink); }
  svg text.amp { fill: var(--amp); }
  .ends { display: flex; justify-content: space-between; width: min(100%, 420px); margin: 0.2rem auto 0;
    font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: var(--ink); }
  .readout { text-align: center; font-family: system-ui, sans-serif; font-size: 0.9rem; color: var(--ink); margin-top: 0.8rem; }
  .readout b { font-weight: 500; color: var(--amp); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="widget">
  <svg viewBox="0 0 440 225" role="img" aria-label="One hump of the flipped wave inside a box from zero to the peak. The slider bends the hump from straight sides into a sine curve. The shaded area under it grows into the corners of the box, and the average height line rises from 50 to about 64 percent of the peak.">
    <rect class="box" x="90" y="40" width="300" height="160" />
    <path class="fill-v" id="fv" />
    <path class="fill-extra" id="fx" />
    <path class="v-ghost" id="vg" d="M90,200 L240,40 L390,200" />
    <path class="hump" id="hump" />
    <line class="base" x1="60" x2="420" y1="200" y2="200" />
    <line class="ruler" x1="240" x2="240" y1="200" y2="40" />
    <line class="ruler" x1="232" x2="248" y1="120" y2="120" />
    <text class="half" x="252" y="138">halfway</text>
    <g id="dots"></g>
    <line class="avg" id="avg" x1="86" x2="394" />
    <text x="82" y="44" text-anchor="end">peak</text>
    <text x="82" y="204" text-anchor="end">0</text>
    <text class="amp" id="pct" x="82" text-anchor="end"></text>
  </svg>
  <input type="range" id="t" min="0" max="2" step="0.01" value="1" aria-label="Change the shape: straight, sine, nearly square" />
  <div class="ends"><span>straight</span><span>sine</span><span>near-square</span></div>
  <p class="readout">The hump fills <b id="fill"></b> of its box, so its average height is <b id="avgpct"></b> of the peak.</p>
</div>
<script src="../widget-base.js"></script>
<script>
  const X0 = 90, W = 300, BASE = 200, H = 160, N = 300;
  const tri = u => 1 - Math.abs(2 * u - 1), arch = u => Math.sin(Math.PI * u);
  // 0 → 1: straight sides bend into a sine curve; 1 → 2: the sine curve squares off
  const shape = t => t <= 1 ? (u => (1 - t) * tri(u) + t * arch(u))
                            : (u => Math.pow(Math.max(arch(u), 0), Math.pow(0.08, t - 1)));
  const meanOf = h => { let m = 0; for (let i = 0; i < 2000; i++) m += h((i + 0.5) / 2000); return m / 2000; };
  const X = u => X0 + W * u, Y = h => BASE - H * h;
  const NS = "http://www.w3.org/2000/svg", DOTS = 17, dots = [];
  for (let k = 0; k < DOTS; k++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("class", "dot"); c.setAttribute("r", 2.6); document.getElementById("dots").appendChild(c); dots.push(c); }
  function draw() {
    const t = document.getElementById("t").valueAsNumber, h = shape(t);
    let top = "", vTop = "", back = "";
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      top += (i ? " L" : "M") + X(u).toFixed(1) + "," + Y(h(u)).toFixed(1);
    }
    for (let i = N; i >= 0; i--) { const u = i / N; back += " L" + X(u).toFixed(1) + "," + Y(tri(u)).toFixed(1); }
    document.getElementById("hump").setAttribute("d", top);
    dots.forEach((c, k) => { const u = (k + 0.5) / DOTS; c.setAttribute("cx", X(u).toFixed(1)); c.setAttribute("cy", Y(h(u)).toFixed(1)); });
    // under the straight V: half the box. Between the V and the curve: the extra the curve adds.
    document.getElementById("fv").setAttribute("d", `M${X0},${BASE} L${X0 + W / 2},${BASE - H} L${X0 + W},${BASE} Z`);
    document.getElementById("fx").setAttribute("d", top + back + " Z");
    document.getElementById("vg").style.opacity = t > 0.02 ? 1 : 0;
    const mean = meanOf(h), y = Y(mean);
    const a = document.getElementById("avg"); a.setAttribute("y1", y); a.setAttribute("y2", y);
    const pct = Math.round(mean * 100) + "%";
    const lab = document.getElementById("pct"); lab.setAttribute("y", y + 4); lab.textContent = pct;
    document.getElementById("fill").textContent = pct; document.getElementById("avgpct").textContent = pct;
  }
  document.getElementById("t").addEventListener("input", draw);
  draw();
</script>
</body>
</html>
