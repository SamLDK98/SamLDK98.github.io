<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Functions, their inputs and outputs, and how to read function notation — explanations by Sam Kirwan." />
  <title>Functions | Sam Kirwan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090b;
      --text: #f4f5f8;
    }

    html, body { min-height: 100%; }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 38%, rgba(226, 232, 255, 0.05), transparent 25rem),
        radial-gradient(circle at 24% 70%, rgba(96, 116, 190, 0.07), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(46rem, calc(100% - 2rem));
      margin-left: clamp(2rem, 11vw, 10rem);
      padding: clamp(3rem, 9vh, 5.5rem) 0;
      text-align: left;
    }

    h1 {
      font-size: clamp(3rem, 7vw, 5.4rem);
      font-weight: 300;
      line-height: 0.96;
      letter-spacing: -0.045em;
    }

    .back { margin-top: 2.6rem; font-size: 0.85rem; color: #a5adc1; }

    nav { margin-top: clamp(2.4rem, 6vh, 4rem); }

    ul { list-style: none; }

    li + li { margin-top: 0.7rem; }

    section + section { margin-top: 2.4rem; }

    h2 {
      margin-bottom: 0.95rem;
      color: #a5adc1;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .unavailable {
      display: inline-block;
      color: rgba(235, 238, 246, 0.42);
      font-size: clamp(1rem, 1.65vw, 1.25rem);
      font-weight: 300;
      line-height: 1.35;
      cursor: default;
    }

    a {
      display: inline-block;
      color: var(--text);
      font-size: clamp(1rem, 1.65vw, 1.25rem);
      font-weight: 300;
      line-height: 1.35;
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }

    a:hover,
    a:focus-visible {
      color: #cfd8ff;
      outline: none;
      transform: translateX(3px);
    }

    @media (max-height: 720px) and (min-width: 600px) {
      main { padding-block: 2rem; }
      nav { margin-top: 2rem; }
      li + li { margin-top: 0.45rem; }
    }

    @media (max-width: 560px) {
      main {
        width: min(27rem, calc(100% - 4rem));
        margin-left: 2rem;
      }

      h1 { font-size: clamp(2.7rem, 13vw, 4rem); }
      nav { margin-top: 2.6rem; }
      li + li { margin-top: 0.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Functions</h1>
    <nav aria-label="Functions pages">

        <ul>

        </ul>
      </section>
      <section aria-labelledby="functions-types">
        <h2 id="functions-types">Types of Function</h2>
        <ul>
          <li><a href="polynomials.html">Polynomials</a></li>
          <li><span class="unavailable" aria-disabled="true">Exponentials</span></li>
        </ul>
      </section>
    </nav>
    <a class="back" href="index.html#math">← Math</a>
  </main>
</body>
