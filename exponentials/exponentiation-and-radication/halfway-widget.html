<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halfway between 25 and 125</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="s" type="range" min="0" max="1000" step="1" value="150" aria-label="Where the middle point sits between 25 and 125" />
</div>

<script src="../widget-base.js"></script>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const INK = "#f4f6ff", BASE = "#e8a33d", EXP = "#7aa7ff";

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  // a text whose number carries a raised exponent: base, then exponent, then the rest
  function powerText(attrs, base, exponent, rest) {
    const t = el("text", attrs);
    t.appendChild(document.createTextNode(base));
    el("tspan", { dy: -5, "font-size": 9, fill: EXP }, exponent, t);
    el("tspan", { dy: 5 }, rest, t);
    return t;
  }
  // a hop from x1 to x2 on the line at y: a shallow arc above it
  function hop(x1, x2, y, attrs) {
    const h = Math.min(11, Math.abs(x2 - x1) * 0.45), mx = (x1 + x2) / 2;
    return el("path", Object.assign({ d: `M${x1.toFixed(1)} ${y} Q${mx.toFixed(1)} ${(y - 2 * h).toFixed(1)} ${x2.toFixed(1)} ${y}`, fill: "none" }, attrs));
  }
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });

  // A journey from 25 (5 squared) to 125 (5 cubed), with a middle point you move. Above it, the two
  // halves of the journey are read two ways: as amounts added and as factors multiplied. Halfway by
  // adding is where the two amounts match (75); halfway by multiplying is where the two factors match
  // (55.90, the square root of 25 × 125). Near either, the point snaps on. Under the point, its value
  // is written as a power of 5, so 55.90 reads as 5 to the 2.5.
  const slider = document.getElementById("s");
  slider.addEventListener("input", render);
  const A = 25, B = 125, GEO = Math.sqrt(A * B), H = 158, ADD = 30, MUL = 58, LINE = 96;
  const fix = (v, d) => (+v.toFixed(d)).toFixed(d);

  function render() {
    let m = A + (B - A) * slider.value / 1000;
    if (Math.abs(m - 75) < 0.8) m = 75;
    if (Math.abs(m - GEO) < 0.8) m = GEO;
    const W = svg.clientWidth || 320;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const L = 108, R = W - 36, px = v => L + (v - A) / (B - A) * (R - L);

    const addSame = m === 75, mulSame = m === GEO;
    el("text", { x: 10, y: ADD + 4 }, "adding");
    el("text", { x: 10, y: MUL + 4 }, "multiplying");
    const left = (px(A) + px(m)) / 2, right = (px(m) + px(B)) / 2;
    el("text", { x: left, y: ADD + 4, "text-anchor": "middle", class: addSame ? "ink" : "" }, "+" + fix(m - A, 1));
    el("text", { x: right, y: ADD + 4, "text-anchor": "middle", class: addSame ? "ink" : "" }, "+" + fix(B - m, 1));
    el("text", { x: left, y: MUL + 4, "text-anchor": "middle", class: mulSame ? "base" : "" }, "×" + fix(m / A, 2));
    el("text", { x: right, y: MUL + 4, "text-anchor": "middle", class: mulSame ? "base" : "" }, "×" + fix(B / m, 2));

    // the two halves, bracketed over the line
    const lit = addSame ? INK : mulSame ? BASE : INK, op = addSame || mulSame ? 0.9 : 0.35;
    for (const [x1, x2] of [[px(A), px(m)], [px(m), px(B)]]) {
      if (x2 - x1 < 1) continue;
      el("path", { d: `M${(x1 + 2).toFixed(1)} ${LINE - 8} V${LINE - 14} H${(x2 - 2).toFixed(1)} V${LINE - 8}`, fill: "none", stroke: lit, "stroke-opacity": op, "stroke-width": 1.2 });
    }
    el("line", { x1: px(A), x2: px(B), y1: LINE, y2: LINE, stroke: INK, "stroke-opacity": 0.22 });
    for (const v of [A, B]) el("circle", { cx: px(v), cy: LINE, r: 4, fill: BASE });
    el("text", { x: px(A) - 10, y: LINE + 4, "text-anchor": "end", class: "base" }, "25");
    el("text", { x: px(B) + 10, y: LINE + 4, class: "base" }, "125");
    el("circle", { cx: px(m), cy: LINE, r: 5.5, fill: INK });

    // the middle point's value, as a power of 5
    const e = Math.log(m) / Math.log(5), val = fix(m, 2), ex = fix(e, 2);
    const lw = (val.length + 4) * 6.6 + ex.length * 5.4;
    const lx = Math.min(Math.max(px(m), L + lw / 2 - 40), R - lw / 2 + 30);
    powerText({ x: lx, y: LINE + 26, "text-anchor": "middle", class: "ink" }, val + " = 5", ex, "");

    if (addSame || mulSame) el("text", { x: (L + R) / 2, y: LINE + 54, "text-anchor": "middle", class: addSame ? "ink" : "base" }, addSame ? "halfway by adding" : "halfway by multiplying");

    svg.setAttribute("aria-label", `The middle point is at ${val}, which is 5 to the ${ex}. From 25 it adds ${fix(m - A, 1)} and multiplies by ${fix(m / A, 2)}; on to 125 it adds ${fix(B - m, 1)} and multiplies by ${fix(B / m, 2)}.` + (addSame ? " The two additions match: halfway by adding." : mulSame ? " The two factors match: halfway by multiplying." : ""));
  }
  render();
</script>
</body>
</html>
