<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hunting for the exponent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .choices { margin-top: 0.5rem; }
  .choices button.ask { color: var(--exp); }
  .choices button.ask:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="m" type="range" min="0" max="2" step="0.001" value="0.5" aria-label="The exponent of 10" />
  <div class="choices">
    <button type="button" data-t="17" aria-pressed="true">target 17</button>
    <button type="button" data-t="43" aria-pressed="false">target 43</button>
    <button type="button" class="ask" id="ask">ask log₁₀</button>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // The product of powers rule says 17 × 43 = 10^(m+n), if 10^m = 17 and 10^n = 43. It does not say
  // what m and n are. Slide the exponent to hunt for them by trial and error; the logarithm finds each
  // one directly. Once both are found, their sum gives the product.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("m");
  const targets = [...document.querySelectorAll("button[data-t]")];
  const INK = "#f4f6ff", BASE = "#e8a33d", EXP = "#7aa7ff";
  let T = 17;
  const found = {};   // target → exponent, once the logarithm has been asked
  let snapped = false;   // true while the dot sits exactly where the logarithm put it

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }

  function render() {
    const exact = snapped;
    const m = exact ? found[T] : +slider.value, v = Math.pow(10, m);
    const W = svg.clientWidth || 560, H = 150, L = 16, R = W - 16, AX = 86;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const px = e => L + e / 2 * (R - L);

    // the readout: 10 to the m, against the target
    const t = el("text", { x: W / 2, y: 26, "text-anchor": "middle", "font-size": 20, class: "ink" });
    t.style.fontFamily = "Spectral, Georgia, serif";
    el("tspan", { fill: BASE }, "10", t);
    el("tspan", { fill: EXP, dy: -9, "font-size": 13 }, exact ? found[T].toFixed(5) : m.toFixed(3), t);
    el("tspan", { dy: 9, fill: INK }, "  =  " + (v < 10 ? v.toFixed(3) : v.toFixed(2)), t);
    const rel = (v - T) / T;
    const status = exact ? `log₁₀(${T}) gives the exponent directly`
      : Math.abs(rel) < 0.002 ? `close to ${T}, but not exactly`
      : rel < 0 ? `too small: we want ${T}` : `too big: we want ${T}`;
    el("text", { x: W / 2, y: 48, "text-anchor": "middle", "font-size": 12, class: exact ? "exp" : "" }, status);

    // a ruler from 1 to 100, where distance is the exponent
    el("line", { x1: L, x2: R, y1: AX, y2: AX, stroke: INK, "stroke-opacity": 0.25 });
    for (let d = 0; d <= 2; d++) {
      el("line", { x1: px(d), x2: px(d), y1: AX - 6, y2: AX + 6, stroke: INK, "stroke-opacity": 0.45 });
      el("text", { x: px(d), y: AX + 21, "text-anchor": "middle" }, String(Math.pow(10, d)));
      if (d < 2) for (let k = 2; k <= 9; k++) el("line", { x1: px(d + Math.log10(k)), x2: px(d + Math.log10(k)), y1: AX - 3, y2: AX + 3, stroke: INK, "stroke-opacity": 0.2 });
    }
    // the target, a ring; where we are, a dot
    const tx = px(Math.log10(T));
    el("circle", { cx: tx, cy: AX, r: 7.5, fill: "none", stroke: INK, "stroke-opacity": exact ? 0.9 : 0.5, "stroke-width": 1.3, "stroke-dasharray": exact ? null : "2 2.5" });
    el("text", { x: tx, y: AX - 14, "text-anchor": "middle", class: "ink" }, String(T));
    el("circle", { cx: px(m), cy: AX, r: 4.5, fill: exact ? EXP : INK });

    // once both exponents are known, the rule can finally be used
    const done = found[17] !== undefined && found[43] !== undefined;
    const s = el("text", { x: W / 2, y: H - 6, "text-anchor": "middle", "font-size": 12 });
    if (done) {
      const mn = found[17] + found[43];
      el("tspan", { fill: INK, "fill-opacity": 0.6 }, "17 × 43 = 10", s);
      el("tspan", { fill: EXP, dy: -5, "font-size": 10 }, `${found[17].toFixed(5)} + ${found[43].toFixed(5)}`, s);
      el("tspan", { fill: INK, "fill-opacity": 0.6, dy: 5 }, " = 10", s);
      el("tspan", { fill: EXP, dy: -5, "font-size": 10 }, mn.toFixed(5), s);
      el("tspan", { fill: INK, dy: 5 }, " ≈ " + Math.round(Math.pow(10, mn)), s);
    } else {
      el("tspan", { fill: INK, "fill-opacity": 0.45 }, "find the exponent for 17 and for 43", s);
    }

    svg.setAttribute("aria-label", `10 to the power ${m.toFixed(3)} is ${v.toFixed(2)}; the target is ${T}.` + (done ? " Both exponents found: their sum gives 17 times 43, about 731." : ""));
  }

  targets.forEach(b => b.addEventListener("click", () => {
    T = +b.dataset.t; snapped = false;
    targets.forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    render();
  }));
  document.getElementById("ask").addEventListener("click", () => {
    found[T] = Math.log10(T);
    slider.value = found[T];   // the slider rounds to its step; the readout keeps the exact value
    snapped = true;
    render();
  });
  slider.addEventListener("input", () => { snapped = false; render(); });
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
