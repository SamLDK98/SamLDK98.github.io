<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equal additive steps produce equal changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>#fig { -webkit-user-select: none; user-select: none; }</style>
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="k" type="range" min="0" step="1" value="0" />
</div>

<script src="../widget-base.js"></script>
<script>
  // 0 to 48 in 8 steps of +6. A run of RUN consecutive steps is highlighted (?run=1 or ?run=3);
  // the slider moves it along the journey. Wherever it sits, the change across it is the same:
  // 6 for one step, 6 + 6 + 6 = 18 for three. With ?drag=1 the run's end dots can be dragged to change its length.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("k");
  const INK = "#f4f6ff", BASE = "#e8a33d", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a";
  const STEPS = 8, STEP = 6, TARGET = STEPS * STEP;
  const Q = new URLSearchParams(location.search);
  // ?run=n starts with n steps; ?drag=1 lets the run's end dots be dragged to combine more or fewer steps
  let RUN = Math.max(1, Math.min(STEPS, +Q.get("run") || 1));
  const DRAG = Q.get("drag") === "1";
  let drag = null, geo = null;
  function syncSlider() {
    slider.max = STEPS - RUN;
    slider.setAttribute("aria-label", RUN === 1 ? "Which step to highlight" : `Where the run of ${RUN} steps starts`);
  }
  syncSlider();
  slider.setAttribute("autocomplete", "off");
  slider.value = 0;

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }

  function render() {
    const k = +slider.value, from = k * STEP, to = (k + RUN) * STEP;
    const W = svg.clientWidth || 560, L = 18, R = W - 18, AX = 74, H = 110;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const px = v => L + (v / TARGET) * (R - L);
    geo = { px };
    const hw = (R - L) / STEPS, rise = Math.min(34, hw * 0.5);

    // the hops: the run in blue, the rest faint
    for (let i = 0; i < STEPS; i++) {
      const a = px(i * STEP), b = px((i + 1) * STEP), lit = i >= k && i < k + RUN;
      el("path", { d: `M${a} ${AX} Q${(a + b) / 2} ${AX - rise} ${b} ${AX}`, fill: "none",
        stroke: lit ? EXP : INK, "stroke-opacity": lit ? 0.95 : 0.25, "stroke-width": lit ? 1.6 : 1.2 });
    }

    // the change across the run, bracketed above it in orange
    const bx1 = px(from), bx2 = px(to), by = AX - rise - 10;
    el("path", { d: `M${bx1} ${by + 5} V${by} H${bx2} V${by + 5}`, fill: "none", stroke: BASE, "stroke-opacity": 0.85, "stroke-width": 1.2 });
    const sum = RUN === 1 ? `+${STEP}` : `+${Array(RUN).fill(STEP).join(" + ")} = +${RUN * STEP}`;
    const lab = el("text", { x: (bx1 + bx2) / 2, y: by - 7, "text-anchor": "middle", "font-size": 13 }, sum);
    lab.style.fill = BASE;
    // keep a long sum on the page
    const lw = lab.getComputedTextLength();
    lab.setAttribute("x", Math.max(L + lw / 2, Math.min(R - lw / 2, (bx1 + bx2) / 2)));

    // the number line, every multiple of 6 marked; 0 green, 48 red
    el("line", { x1: L, x2: R, y1: AX, y2: AX, stroke: INK, "stroke-opacity": 0.16, "stroke-width": 1.2 });
    for (let i = 0; i <= STEPS; i++) {
      const v = i * STEP, end = i === 0 || i === STEPS, onRun = v === from || v === to;
      const t = el("text", { x: px(v), y: AX + 20, "text-anchor": "middle", "font-size": 12 }, v);
      t.style.fill = i === 0 ? VAL : i === STEPS ? RED : INK;
      t.style.fillOpacity = end || onRun ? 1 : 0.45;
    }
    [[0, VAL], [TARGET, RED]].forEach(([v, col]) => { const c = el("circle", { cx: px(v), cy: AX, r: 3.5 }); c.style.fill = col; });
    [from, to].forEach(v => {
      if (DRAG) {   // the run's ends are handles: a soft halo and a larger dot
        el("circle", { cx: px(v), cy: AX, r: 9, fill: INK, "fill-opacity": drag ? 0.12 : 0.07 });
        const c = el("circle", { cx: px(v), cy: AX, r: 5.5, stroke: "#0e0e11", "stroke-width": 1.5 });
        c.style.fill = v === 0 ? VAL : v === TARGET ? RED : INK; c.style.cursor = "grab";
      } else if (v !== 0 && v !== TARGET) { const c = el("circle", { cx: px(v), cy: AX, r: 3.5 }); c.style.fill = INK; }
    });

    svg.setAttribute("aria-label", `${RUN === 1 ? "One step" : RUN + " steps"} of plus 6, from ${from} to ${to}: a change of ${to - from}, wherever ${RUN === 1 ? "the step is" : "the run sits"}.`);
  }

  // dragging: pick up the nearer end, snap it to the nearest step, keep at least one step in the run
  if (DRAG) {
    svg.style.touchAction = "none";
    const xAt = ev => ev.clientX - svg.getBoundingClientRect().left;
    const stepAt = x => { let best = 0; for (let i = 1; i <= STEPS; i++) if (Math.abs(geo.px(i * STEP) - x) < Math.abs(geo.px(best * STEP) - x)) best = i; return best; };
    svg.addEventListener("pointerdown", ev => {
      const x = xAt(ev), k = +slider.value, ds = Math.abs(x - geo.px(k * STEP)), de = Math.abs(x - geo.px((k + RUN) * STEP));
      if (Math.min(ds, de) > 22) return;
      ev.preventDefault(); drag = ds < de ? "s" : "e"; svg.setPointerCapture(ev.pointerId); render();
    });
    svg.addEventListener("pointermove", ev => {
      const x = xAt(ev), k = +slider.value;
      if (!drag) { svg.style.cursor = Math.min(Math.abs(x - geo.px(k * STEP)), Math.abs(x - geo.px((k + RUN) * STEP))) <= 22 ? "grab" : "default"; return; }
      let a = k, b = k + RUN; const i = stepAt(x);
      if (drag === "s") a = Math.min(i, b - 1); else b = Math.max(i, a + 1);
      RUN = b - a; syncSlider(); slider.value = a; render();
    });
    const drop = () => { if (drag) { drag = null; render(); } };
    svg.addEventListener("pointerup", drop); svg.addEventListener("pointercancel", drop);
  }

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  slider.addEventListener("input", render);
  render();
</script>
</body>
</html>
