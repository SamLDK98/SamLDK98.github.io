<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steps taken and output reached: additive and multiplicative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .nav { display: flex; justify-content: center; gap: 2.4rem; margin-top: 0.4rem; }
  .nav button {
    font: inherit; font-size: 1.3rem; line-height: 1; width: 2.4rem; height: 2.4rem; border-radius: 50%;
    background: none; border: 1px solid var(--faint); color: var(--ink); cursor: pointer;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }
  .nav button:hover:not(:disabled) { border-color: var(--dim); }
  .nav button:disabled { opacity: 0.25; cursor: default; }
  .nav button:focus-visible { outline: 1px solid var(--dim); outline-offset: 3px; }
</style>
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <div class="nav">
    <button id="prev" type="button" aria-label="One step back">←</button>
    <button id="next" type="button" aria-label="One step forward">→</button>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // Two journeys to 256 in 8 steps: additive (0, +32 each step) and multiplicative (1, ×2 each step).
  // For each, two thin progress lines on the same scale: the share of the steps taken (blue) and the
  // share of the target output reached (green). Additive: the two always match. Multiplicative: the
  // output lags far behind, then catches up in the last few steps.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  const INK = "#f4f6ff", EXP = "#7aa7ff", VAL = "#7fcf9a", BASE = "#e8a33d";
  const STEPS = 8, TARGET = 256;
  const JOURNEYS = [
    { name: "Additive", op: "+32", out: k => 32 * k },
    { name: "Multiplicative", op: "×2", out: k => Math.pow(2, k) }
  ];
  let n = 0;

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const serif = e => { e.style.fontFamily = "Spectral, Georgia, serif"; return e; };
  const pct = x => (Math.round(x * 10000) / 100) + "%";

  function render() {
    prev.disabled = n === 0; next.disabled = n === STEPS;
    const W = svg.clientWidth || 560, L = 18, R = W - 18, H = 292;
    const big = W < 420 ? 14 : 16;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const px = f => L + f * (R - L);

    // the halfway guide, through every line
    el("line", { x1: px(0.5), x2: px(0.5), y1: 14, y2: H - 6, stroke: INK, "stroke-opacity": 0.25, "stroke-dasharray": "3 4" });
    const h = el("text", { x: px(0.5), y: 10, "text-anchor": "middle", "font-size": 11 }, "halfway"); h.style.fill = INK; h.style.fillOpacity = 0.5;

    const aria = [];
    JOURNEYS.forEach((j, gi) => {
      const top = 34 + gi * 140, outN = j.out(n), ps = n / STEPS, po = outN / TARGET;
      // the journey's name and its step
      const t = serif(el("text", { x: L, y: top, "font-size": big + 2 }));
      const t1 = el("tspan", {}, j.name + "  ", t); t1.style.fill = INK;
      const t2 = el("tspan", {}, j.op, t); t2.style.fill = BASE;
      [[top + 44, ps, EXP, "Steps taken", `${n} of ${STEPS}`], [top + 100, po, VAL, "Output reached", `${outN} of ${TARGET}`]].forEach(([y, f, col, lab, of]) => {
        const l = serif(el("text", { x: L, y: y - 13, "font-size": big }, lab)); l.style.fill = col;
        const r = serif(el("text", { x: R, y: y - 13, "text-anchor": "end", "font-size": big }));
        const r1 = el("tspan", {}, `${of}  ·  `, r); r1.style.fill = INK; r1.style.fillOpacity = 0.6;
        const r2 = el("tspan", {}, pct(f), r); r2.style.fill = col; r2.style.fontWeight = 500;
        el("line", { x1: L, x2: R, y1: y, y2: y, stroke: INK, "stroke-opacity": 0.14, "stroke-width": 2, "stroke-linecap": "round" });
        if (f > 0) el("line", { x1: L, x2: px(f), y1: y, y2: y, stroke: col, "stroke-width": 3, "stroke-linecap": "round" });
        const d = el("circle", { cx: px(f), cy: y, r: 4.5 }); d.style.fill = col;
      });
      aria.push(`${j.name}: output ${outN} of 256, ${pct(po)}`);
    });

    svg.setAttribute("aria-label", `${n} of ${STEPS} steps taken, ${pct(n / STEPS)}. ${aria.join(". ")}.`);
    if (window.postWidgetHeight) window.postWidgetHeight();
  }

  prev.addEventListener("click", () => { if (n > 0) { n--; render(); } });
  next.addEventListener("click", () => { if (n < STEPS) { n++; render(); } });
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
