<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portion of steps taken and portion of the total change completed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .nav { display: flex; justify-content: center; gap: 2.4rem; margin-top: 0.4rem; }
  .nav button {
    font: inherit; font-size: 1.3rem; line-height: 1; width: 2.4rem; height: 2.4rem; border-radius: 50%;
    background: none; border: 1px solid var(--faint); color: var(--ink); cursor: pointer;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }
  .nav button:hover:not(:disabled) { border-color: var(--dim); }
  .nav button:disabled { opacity: 0.25; cursor: default; }
  .nav button:focus-visible { outline: 1px solid var(--dim); outline-offset: 3px; }
  /* percentages, or the worked example of a journey from 25 to 75 */
  .mode { display: none; justify-content: center; gap: 0.3rem; margin-bottom: 0.9rem; }
  .mode.on { display: flex; }
  .mode button {
    font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.35rem 0.8rem; border-radius: 999px; border: 1px solid var(--faint); background: none; color: var(--dim); cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .mode button:hover { color: var(--ink); }
  .mode button[aria-pressed="true"] { color: var(--ink); border-color: var(--dim); }
</style>
</head>
<body>
<div class="widget">
  <div class="mode" role="group" aria-label="Show">
    <button type="button" data-mode="pct" aria-pressed="true">Percentages</button>
    <button type="button" data-mode="eg" aria-pressed="false">Example</button>
  </div>
  <svg id="fig" role="img"></svg>
  <div class="nav">
    <button id="prev" type="button" aria-label="One step back">←</button>
    <button id="next" type="button" aria-label="One step forward">→</button>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // One journey to 100 in 10 steps: additive (0, +10 each step) or, with ?journey=mul, multiplicative
  // (1, ×1.585 each step). Two thin lines: the portion of steps taken (blue) and the portion of the
  // total change completed (orange). Additive: the two always match. Multiplicative: halfway through the
  // steps, the output is 10, only 9 of the total change of 99 (about 9%).
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  const INK = "#f4f6ff", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a", BASE = "#f5d547", CORAL = "#e8a33d";
  const STEPS = 10, TARGET = 100;
  const addOut = k => 10 * k;                              // 0 → 100, +10 each step
  const mulOut = k => Math.pow(TARGET, k / STEPS);         // 1 → 100, ×100^(1/10) ≈ ×1.585 each step

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const serif = e => { e.style.fontFamily = "Spectral, Georgia, serif"; return e; };
  // whole numbers as they are; anything else to one decimal place, marked as approximate
  const fmt = v => Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : "≈ " + v.toFixed(1);
  const MUL = new URLSearchParams(location.search).get("journey") === "mul";
  const out = MUL ? mulOut : addOut;
  // ?toggle=1: switch between percentages and a worked example in 10 steps:
  // additive, 0 to 100 in steps of +10; multiplicative, 1 to 100 in steps of ×100^(1/10) ≈ ×1.585
  const TOGGLE = new URLSearchParams(location.search).get("toggle") === "1";
  const EG = MUL ? { from: 1, to: 100, at: mulOut } : { from: 0, to: 100, at: k => 10 * k };
  let n = 0, mode = "pct";
  if (TOGGLE) {
    document.querySelector(".mode").classList.add("on");
    document.querySelectorAll(".mode button").forEach(b => b.addEventListener("click", () => {
      mode = b.dataset.mode;
      document.querySelectorAll(".mode button").forEach(o => o.setAttribute("aria-pressed", o === b ? "true" : "false"));
      render();
    }));
  }

  function render() {
    prev.disabled = n === 0; next.disabled = n === STEPS;
    // the portion of the total change completed: (current output − start) ÷ (final output − start)
    const START = MUL ? 1 : 0, ps = n / STEPS, po = (out(n) - START) / (TARGET - START);
    const W = svg.clientWidth || 560, L = 18, R = W - 18, Y1 = 34, Y2 = 100, H = 116;
    const big = W < 420 ? 15 : 17;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const px = f => L + f * (R - L);

    const eg = TOGGLE && mode === "eg";
    const outLab = "Change completed";
    const rows = eg
      ? [[Y1, ps, EXP, "Steps taken", `${n} of ${STEPS}`],
         [Y2, (EG.at(n) - EG.from) / (EG.to - EG.from), CORAL, "Change completed", `${fmt(EG.at(n) - EG.from)} of ${EG.to - EG.from}`]]
      : [[Y1, ps, EXP, "Steps taken", fmt(100 * ps) + "%"], [Y2, po, CORAL, outLab, fmt(100 * po) + "%"]];
    rows.forEach(([y, f, col, lab, val]) => {
      const l = serif(el("text", { x: L, y: y - 13, "font-size": big }, lab)); l.style.fill = col;
      const r = serif(el("text", { x: R, y: y - 13, "text-anchor": "end", "font-size": big }, val)); r.style.fill = col; r.style.fontWeight = 500;
      el("line", { x1: L, x2: R, y1: y, y2: y, stroke: INK, "stroke-opacity": 0.14, "stroke-width": 2, "stroke-linecap": "round" });
      if (f > 0) el("line", { x1: L, x2: px(f), y1: y, y2: y, stroke: col, "stroke-width": 3, "stroke-linecap": "round" });
      const d = el("circle", { cx: px(f), cy: y, r: 4.5 }); d.style.fill = col;
    });

    svg.setAttribute("aria-label", eg
      ? `Journey from ${EG.from} to ${EG.to} in ${STEPS} steps: ${n} taken, output ${fmt(EG.at(n)).replace("≈ ", "about ")}, ${fmt(EG.at(n) - EG.from).replace("≈ ", "about ")} of the total change of ${EG.to - EG.from} completed.`
      : `${MUL ? "Multiplicative" : "Additive"} journey: ${fmt(100 * ps)}% of steps taken, ${fmt(100 * po).replace("≈ ", "about ")}% of the total change completed.`);
    if (window.postWidgetHeight) window.postWidgetHeight();
  }

  prev.addEventListener("click", () => { if (n > 0) { n--; render(); } });
  next.addEventListener("click", () => { if (n < STEPS) { n++; render(); } });
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
