<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress in an additive journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="n" type="range" min="0" max="64" step="1" value="0" aria-label="Steps taken, out of 64" />
</div>

<script src="../widget-base.js"></script>
<script>
  // From 0 to 256 in 64 steps of +4. Two bars on the same scale: the share of the steps taken, and
  // the share of the distance covered. With equal steps they are always the same length.
  // At exactly half the steps, the second half of the journey is drawn as a copy of the first:
  // the output there, added to itself, is the target.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("n");
  const INK = "#f4f6ff", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a";
  const STEPS = 64, STEP = 4, TARGET = 256;

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const pct = x => (Math.round(x * 1000) / 10) + "%";

  function render() {
    const n = +slider.value, out = n * STEP, p = n / STEPS;
    const W = svg.clientWidth || 560, L = 16, R = W - 16, H = 118;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const px = f => L + f * (R - L);
    const half = n === STEPS / 2;
    const BH = 18;

    // two bars on the same scale: steps taken, output reached
    el("rect", { x: L, y: 6, width: R - L, height: BH, fill: INK, "fill-opacity": 0.08 });
    el("rect", { x: L, y: 6, width: px(p) - L, height: BH, fill: EXP });
    el("rect", { x: L, y: 34, width: R - L, height: BH, fill: INK, "fill-opacity": 0.08 });
    el("rect", { x: L, y: 34, width: px(out / TARGET) - L, height: BH, fill: VAL });
    if (half) {
      // halfway: the same amount again fills the rest
      el("rect", { x: px(0.5) + 1, y: 35, width: R - px(0.5) - 2, height: BH - 2, fill: "none", stroke: VAL, "stroke-opacity": 0.6, "stroke-dasharray": "5 4" });
    }

    // the readings beneath: steps in blue, output in green, side by side
    const cols = [
      { x: W * 0.27, big: `${pct(p)} steps taken`, small: `${n} of ${STEPS}`, color: EXP },
      { x: W * 0.73, big: `${pct(out / TARGET)} output reached`, small: half ? "128 + 128 = 256" : `${out} of ${TARGET}`, color: VAL },
    ];
    cols.forEach(c => {
      const a = el("text", { x: c.x, y: 84, "text-anchor": "middle", "font-size": 17 }); a.textContent = c.big; a.style.fill = c.color;
      const b = el("text", { x: c.x, y: 106, "text-anchor": "middle", "font-size": 14 }); b.textContent = c.small; b.style.fill = c.color; b.style.fillOpacity = 0.75;
    });

    svg.setAttribute("aria-label", `${n} of ${STEPS} steps of plus 4 taken, ${pct(p)}; output ${out} of 256, also ${pct(out / TARGET)}.` + (half ? " Halfway: 128 plus 128 is 256." : ""));
  }

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  slider.addEventListener("input", render);
  render();
</script>
</body>
</html>
