<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Step size and the number of steps to 200</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .control { display: flex; justify-content: center; align-items: baseline; gap: 0.2rem 1.1rem; flex-wrap: wrap; margin-top: 0.7rem; }
  .control .label { font-size: 1.08rem; color: var(--dim); }
  .control .choices { margin-top: 0; }
</style>
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <div class="control">
    <span class="label" id="lab">Step size:</span>
    <div class="choices" role="group" aria-labelledby="lab"></div>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // The journey from 0 to 200, cut into equal steps of the chosen size. Dividing the target by the
  // step size gives the number of steps: 200 ÷ 2 = 100, 200 ÷ 5 = 40, 200 ÷ 50 = 4.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const box = document.querySelector(".choices");
  const INK = "#f4f6ff", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a";
  const TARGET = 200, OPTIONS = [2, 5, 50];
  let size = 50;

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }

  OPTIONS.forEach(k => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = k;
    b.addEventListener("click", () => { size = k; render(); });
    box.appendChild(b);
  });

  function render() {
    const n = TARGET / size;
    const W = svg.clientWidth || 560, L = 18, R = W - 18, AX = 86, H = 110;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const px = v => L + (v / TARGET) * (R - L);

    // the number of steps, above the hops
    const c = el("text", { x: W / 2, y: 14, "text-anchor": "middle", "font-size": 14 }, `${n} equally spaced steps`);
    c.style.fill = EXP;

    // the hops: all the same length; their height follows their width, capped
    const hw = (R - L) / n, rise = Math.min(48, hw * 0.55);
    for (let i = 0; i < n; i++) {
      const a = px(i * size), b = px((i + 1) * size);
      el("path", { d: `M${a} ${AX} Q${(a + b) / 2} ${AX - rise} ${b} ${AX}`, fill: "none", stroke: EXP, "stroke-opacity": 0.9, "stroke-width": n > 50 ? 1.1 : 1.4 });
    }
    if (hw > 34) {
      const t = el("text", { x: px(size / 2), y: AX - rise / 2 - 6, "text-anchor": "middle", "font-size": 12 }, `+${size}`);
      t.style.fill = INK;
    }

    // the number line, with the start in green and the target in red
    el("line", { x1: L, x2: R, y1: AX, y2: AX, stroke: INK, "stroke-opacity": 0.16, "stroke-width": 1.2 });
    [[0, VAL], [TARGET, RED]].forEach(([v, col]) => {
      const d = el("circle", { cx: px(v), cy: AX, r: 3.5 }); d.style.fill = col;
      const t = el("text", { x: px(v), y: AX + 20, "text-anchor": "middle", "font-size": 13 }, v); t.style.fill = col;
    });

    box.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", OPTIONS[i] === size));
    svg.setAttribute("aria-label", `The journey from 0 to 200 in steps of ${size}: ${n} equally spaced steps.`);
    if (window.postWidgetHeight) window.postWidgetHeight();
  }

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
