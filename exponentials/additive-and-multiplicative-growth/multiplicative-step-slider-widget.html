<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>More steps, smaller step ratios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="n" type="range" min="1" max="64" step="1" value="1" autocomplete="off" aria-label="Number of steps, from 1 to 64" />
</div>

<script src="../widget-base.js"></script>
<script>
  // The journey from 1 to 256, cut into however many equal multiplicative steps the slider asks for.
  // As the number of steps goes up, the step ratio needed to cover the same journey shrinks: 256^(1/steps).
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("n");
  const INK = "#f4f6ff", BASE = "#e8a33d", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a";
  // ?start=, ?target= and ?max= set the journey and the most steps; by default 1 to 256 in up to 64
  const QS = new URLSearchParams(location.search);
  const START = +QS.get("start") || 1, TARGET = +QS.get("target") || 256;
  if (QS.get("max")) { slider.max = +QS.get("max"); slider.setAttribute("aria-label", `Number of steps, from 1 to ${QS.get("max")}`); }

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  // ratios that are not whole numbers are shown to two decimal places
  function fmtRatio(r) {
    const w = Math.round(r);
    if (Math.abs(r - w) < 1e-9) return "×" + w;
    return "×≈ " + (Math.round(r * 100) / 100).toFixed(2);
  }

  function render() {
    const n = +slider.value, r = Math.pow(TARGET / START, 1 / n);
    const W = svg.clientWidth || 560, L = 34, R = W - 46, AX = 66, H = 116;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const px = v => L + ((v - START) / (TARGET - START)) * (R - L);

    // the hops: each one r times the last, so each covers more distance than the one before
    for (let i = 0; i < n; i++) {
      const a = px(START * Math.pow(r, i)), b = i === n - 1 ? px(TARGET) : px(START * Math.pow(r, i + 1));
      const rise = Math.min(46, (b - a) * 0.55);
      el("path", { d: `M${a} ${AX} Q${(a + b) / 2} ${AX - rise} ${b} ${AX}`, fill: "none", stroke: EXP, "stroke-opacity": 0.9, "stroke-width": n > 40 ? 1.1 : 1.4 });
    }

    // the line, with the start in green and the target in red at either end
    el("line", { x1: px(START), x2: px(TARGET), y1: AX, y2: AX, stroke: INK, "stroke-opacity": 0.16, "stroke-width": 1.2 });
    const a = el("text", { x: px(START) - 12, y: AX + 6, "text-anchor": "end", "font-size": 18 }, String(START));
    a.style.fill = VAL; a.style.fontFamily = "Spectral, Georgia, serif";
    const z = el("text", { x: px(TARGET) + 10, y: AX + 6, "text-anchor": "start", "font-size": 18 }, String(TARGET));
    z.style.fill = RED; z.style.fontFamily = "Spectral, Georgia, serif";

    // the two readings, side by side
    [[W * 0.3, "Step ratio: ", fmtRatio(r), BASE], [W * 0.7, "Number of steps: ", String(n), EXP]].forEach(([x, lab, val, col]) => {
      const t = el("text", { x, y: 106, "text-anchor": "middle", "font-size": 14 });
      const l = el("tspan", {}, lab, t); l.style.fill = INK; l.style.fillOpacity = 0.75;
      const v = el("tspan", {}, val, t); v.style.fill = col;
    });

    svg.setAttribute("aria-label", `The journey from ${START} to ${TARGET} in ${n} equal multiplicative ${n === 1 ? "step" : "steps"}. Step ratio: ${fmtRatio(r).replace("×≈ ", "times about ").replace("×", "times ")}.`);
    if (window.postWidgetHeight) window.postWidgetHeight();
  }

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  slider.addEventListener("input", render);
  // always start at one step, even if the browser restores the slider from an earlier visit
  slider.value = 1;
  render();
</script>
</body>
</html>
