<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Growing by a constant factor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .choices { margin-top: 0.3rem; }
  .choices .play { color: var(--ink); }
  .choices .sep { width: 0.6rem; }
</style>
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <div class="choices" role="group" aria-label="Playback">
    <button type="button" class="play" id="play">Play</button>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // A square of area 1. A grid of g × g cells appears with the square in one corner cell, copies of the
  // square fill the other cells, then the inner borders dissolve: the square has grown by a factor of g².
  // The grid appears again around the bigger square and the same thing happens. The scale is fixed to fit
  // the final square, so the square visibly grows: each one is drawn g times wider than the last. Each step multiplies the area by the same factor, while the amount added grows each time.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const playBtn = document.getElementById("play");
  const gBtns = [...document.querySelectorAll("button[data-g]")];
  const INK = "#f4f6ff", BASE = "#e8a33d", EXP = "#7aa7ff", VAL = "#7fcf9a";
  const STEPS = 3;
  let g = 2;

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const fmt = n => n.toLocaleString("en-GB");

  const PH = [["gridIn", 1000], ["copies", 1200], ["merge", 800], ["hold", 900]];
  const D = PH.reduce((s, p) => s + p[1], 0), IDLE = 900, TOTAL = IDLE + STEPS * D;
  function stateAt(t) {
    if (t < IDLE) return { c: 0, ph: "idle", f: 0 };
    let u = t - IDLE; const c = Math.floor(u / D);
    if (c >= STEPS) return { c: STEPS - 1, ph: "hold", f: 1, done: true };
    u -= c * D;
    for (const [name, len] of PH) { if (u < len) return { c, ph: name, f: u / len }; u -= len; }
    return { c, ph: "hold", f: 1 };
  }

  function draw(t) {
    const W = svg.clientWidth || 360;
    const BOX = Math.min(220, W - 40), top = 14, H = top + BOX + 16;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const st = stateAt(t), { c, ph, f } = st;
    const s = Math.pow(g, c);              // side of the square at the start of this step
    const E1 = s * g;                      // side of this step's grid
    // a fixed scale: the frame fits the final square, so each square is drawn bigger than the last
    const E = Math.pow(g, STEPS);
    const k = BOX / E;
    const bx = W / 2 - BOX / 2, by = top + BOX;   // screen position of the world origin (bottom-left)
    const X = x => bx + x * k, Y = y => by - y * k;

    // the dashed grid
    let gA = 0;
    if (ph === "gridIn") gA = ease(clamp((f - 0.3) / 0.7)); else if (ph === "copies") gA = 1; else if (ph === "merge") gA = 1 - ease(f);
    if (gA > 0) {
      const gg = el("g", { stroke: INK, "stroke-opacity": 0.32 * gA, "stroke-width": 1 });
      for (let i = 0; i <= g; i++) {
        el("line", { x1: X(i * s), x2: X(i * s), y1: Y(0), y2: Y(E1) }, null, gg);
        el("line", { y1: Y(i * s), y2: Y(i * s), x1: X(0), x2: X(E1) }, null, gg);
      }
    }

    const merging = ph === "merge", merged = ph === "hold" || st.done;
    const fillA = 0.15;
    if (!merging && !merged) {
      // the square in the corner cell, and its copies arriving in the other cells
      const n = g * g;
      for (let i = 0; i < n; i++) {
        const col = i % g, row = Math.floor(i / g);
        let a = 1, sc = 1;
        if (i > 0) {
          if (ph !== "copies") a = 0;
          else { const span = 0.75 / (n - 1); a = ease(clamp((f - (i - 1) * span) / 0.3)); sc = 0.84 + 0.16 * a; }
        }
        if (a <= 0) continue;
        const cx = X(col * s + s / 2), cy = Y(row * s + s / 2), w = s * k * sc;
        el("rect", { x: cx - w / 2, y: cy - w / 2, width: w, height: w, fill: BASE, "fill-opacity": fillA * a, stroke: BASE, "stroke-opacity": 0.9 * a, "stroke-width": 1.4 });
        label(cx, cy, w, s * s, a);
      }
    } else {
      el("rect", { x: X(0), y: Y(E1), width: E1 * k, height: E1 * k, fill: BASE, "fill-opacity": fillA, stroke: BASE, "stroke-opacity": 0.9, "stroke-width": 1.4 });
      const inner = merging ? 1 - ease(f) : 0;
      // while the inner borders dissolve, each copy's number fades with them
      if (merging) for (let i = 1; i < g * g; i++) {
        const col = i % g, row = Math.floor(i / g);
        label(X(col * s + s / 2), Y(row * s + s / 2), s * k, s * s, 1 - clamp(f * 2));
      }
      if (inner > 0) for (let i = 1; i < g; i++) {
        el("line", { x1: X(i * s), x2: X(i * s), y1: Y(0), y2: Y(E1), stroke: BASE, "stroke-opacity": 0.9 * inner, "stroke-width": 1.4 });
        el("line", { y1: Y(i * s), y2: Y(i * s), x1: X(0), x2: X(E1), stroke: BASE, "stroke-opacity": 0.9 * inner, "stroke-width": 1.4 });
      }
      if (merging) {
        label(X(s / 2), Y(s / 2), s * k, s * s, 1 - clamp(f * 2));
        label(X(E1 / 2), Y(E1 / 2), E1 * k, E1 * E1, clamp(f * 2 - 1));
      } else if (st.done) {
        // at the end every square, the final one included, is labelled the same way in its own corner (below)
      } else label(X(E1 / 2), Y(E1 / 2), E1 * k, E1 * E1, 1);
    }
    // once the view has zoomed well out, mark the original square of area 1 in its corner: its size shows how far we have grown
    if (st.done) {
      // at the end, outline every earlier square in the corner it grew from: 1, then g², then g⁴ …
      for (let i = 0; i <= STEPS; i++) {
        const side = Math.pow(g, i), u = side * k, area = side * side;
        if (i < STEPS) el("rect", { x: X(0), y: Y(side), width: u, height: u, fill: "none", stroke: INK, "stroke-opacity": 0.6, "stroke-width": 1 });
        const inside = u >= 28;
        const fs = inside ? Math.min(14, Math.max(10, u * 0.18)) : 11;
        const l = el("text", inside
          ? { x: X(side) - 5, y: Y(side) + fs + 3, "text-anchor": "end", "font-size": fs, "fill-opacity": 0.8 }
          : { x: X(side) + 4, y: Y(side) - 3, "text-anchor": "start", "font-size": fs, "fill-opacity": 0.8 });
        l.style.fontFamily = "Spectral, Georgia, serif"; l.style.fill = INK; l.textContent = fmt(area);
      }
    } else if (false) {
      const u = Math.max(2, k);
      el("rect", { x: X(0), y: Y(0) - u, width: u, height: u, fill: "none", stroke: INK, "stroke-opacity": 0.55, "stroke-width": 1 });
      const inside = u >= 12;
      const l = el("text", inside
        ? { x: X(0) + u / 2, y: Y(0) - u / 2 + u * 0.17, "text-anchor": "middle", "font-size": u * 0.5, "fill-opacity": 0.75 }
        : { x: X(0) + u + 4, y: Y(0) - u - 3, "text-anchor": "start", "font-size": 11, "fill-opacity": 0.75 });
      l.style.fontFamily = "Spectral, Georgia, serif"; l.style.fill = INK; l.textContent = "1";
    }

    // what has been reached so far, for the description read by screen readers
    const reached = c + ((merging && f >= 0.5) || merged ? 1 : 0);
    const areas = []; for (let i = 0; i <= STEPS; i++) areas.push(Math.pow(g * g, i));
    svg.setAttribute("aria-label", `A square grown by a factor of ${g * g} per step. Its area so far: ${areas.slice(0, reached + 1).map(fmt).join(", ")}. Each step adds more than the last, but always multiplies by ${g * g}.`);
  }

  function label(x, y, size, value, a) {
    if (a <= 0 || size < 14) return;
    const str = fmt(value);
    const fs = Math.min(size * (str.length >= 4 ? 0.26 : str.length >= 3 ? 0.32 : 0.42), 46);
    const tx = el("text", { x, y: y + fs * 0.34, "text-anchor": "middle", "font-size": fs, "fill-opacity": a });
    tx.style.fontFamily = "Spectral, Georgia, serif"; tx.style.fill = INK;
    tx.textContent = str;
  }

  // playback
  let t = 0, last = null, playing = false, started = false, raf = null;
  function frame(now) {
    if (last !== null) t += now - last;
    last = now;
    if (t >= TOTAL) { t = TOTAL; playing = false; setBtn(); draw(t); return; }
    draw(t); raf = requestAnimationFrame(frame);
  }
  function play() { playing = true; started = true; last = null; setBtn(); raf = requestAnimationFrame(frame); }
  function pause() { playing = false; cancelAnimationFrame(raf); setBtn(); }
  function setBtn() { playBtn.textContent = playing ? "Pause" : t >= TOTAL ? "Replay" : "Play"; }
  playBtn.addEventListener("click", () => { if (playing) pause(); else { if (t >= TOTAL) t = 0; play(); } });
  gBtns.forEach(b => b.addEventListener("click", () => {
    g = +b.dataset.g;
    gBtns.forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    cancelAnimationFrame(raf); t = 0; play();
  }));
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => draw(t), 60); });

  draw(0); setBtn();
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { t = TOTAL; draw(t); setBtn(); }
  else if ("IntersectionObserver" in window) {
    new IntersectionObserver((entries, obs) => {
      if (entries.some(e => e.isIntersecting) && !started) { obs.disconnect(); play(); }
    }, { threshold: 0.5 }).observe(svg);
  } else play();
</script>
</body>
</html>
