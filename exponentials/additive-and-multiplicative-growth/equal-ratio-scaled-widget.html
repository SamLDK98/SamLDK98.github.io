<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multiplicative steps: unequal differences, equal ratios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: none; }
  #fig { -webkit-user-select: none; user-select: none; }
  .nav[hidden] { display: none; }
  .nav { display: flex; justify-content: center; gap: 2.4rem; margin-top: 0.4rem; }
  .nav button {
    font: inherit; font-size: 1.3rem; line-height: 1; width: 2.4rem; height: 2.4rem; border-radius: 50%;
    background: none; border: 1px solid var(--faint); color: var(--ink); cursor: pointer;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }
  .nav button:hover:not(:disabled) { border-color: var(--dim); }
  .nav button:disabled { opacity: 0.25; cursor: default; }
  .nav button:focus-visible { outline: 1px solid var(--dim); outline-offset: 3px; }
</style>
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="pos" type="range" min="0" step="1" value="0" autocomplete="off" aria-label="Where the selected steps start" hidden />
  <div class="nav">
    <button id="prev" type="button" aria-label="Slide the selection back one step">←</button>
    <button id="next" type="button" aria-label="Slide the selection forward one step">→</button>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // 1 to 256 in 8 steps of ×2. A run of steps is highlighted: the arrows slide it along the journey and
  // its end dots can be dragged to stretch or shrink it. Above it, the ratio of its end outputs: 2 for
  // one step, 4 for two, 8 for three … the same for an equal number of steps wherever they sit.
  // The steps are drawn the same width: what they share is the ratio, not the distance.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  const INK = "#f4f6ff", BASE = new URLSearchParams(location.search).get("base") === "yellow" ? "#f5d547" : "#e8a33d", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a";
  const STEPS = 8, F = 2;
  const out = i => Math.pow(F, i);

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const serif = e => { e.style.fontFamily = "Spectral, Georgia, serif"; return e; };

  // a stacked fraction at (cx, cy): numerator, bar, denominator; returns its width
  function fracAt(cx, cy, num, den, size, col, g) {
    const n = serif(el("text", { x: cx, y: cy - size * 0.28, "text-anchor": "middle", "font-size": size }, num, g));
    const d = serif(el("text", { x: cx, y: cy + size * 0.92, "text-anchor": "middle", "font-size": size }, den, g));
    n.style.fill = col; d.style.fill = col;
    const w = Math.max(n.getComputedTextLength(), d.getComputedTextLength()) + size * 0.3;
    el("line", { x1: cx - w / 2, x2: cx + w / 2, y1: cy, y2: cy, stroke: col, "stroke-width": 1 }, null, g);
    return w;
  }
  // lay a row of pieces (text or fractions) out centred on the page at baseline y
  function row(y, size, pieces) {
    const g = el("g", {});
    let x = 0; const gap = size * 0.4;
    pieces.forEach(p => {
      if (p.frac) {
        const probe = el("g", {}, null, g);
        const w = fracAt(0, 0, p.frac[0], p.frac[1], size * 0.95, p.col || INK, probe);
        probe.remove();
        fracAt(x + w / 2, y - size * 0.32, p.frac[0], p.frac[1], size * 0.95, p.col || INK, g);
        x += w + gap;
      } else {
        const t = serif(el("text", { x, y, "font-size": size }, p.t, g));
        t.style.fill = p.col || INK; if (p.op) t.style.fillOpacity = p.op; if (p.bold) t.style.fontWeight = 500;
        x += t.getComputedTextLength() + gap;
      }
    });
    g.setAttribute("transform", `translate(${(svg.clientWidth || 560) / 2 - (x - gap) / 2} 0)`);
  }

  // the selection runs from step s to step e; drag either end to stretch it, arrows slide it
  // ?run=n starts with n steps selected; ?drag=0 fixes the selection's length (arrows only)
  const Q = new URLSearchParams(location.search);
  const RUN0 = Math.max(1, Math.min(STEPS, +Q.get("run") || 1)), DRAG = Q.get("drag") !== "0" && Q.get("show") !== "grow", SHOW = Q.get("show"), QUOT = SHOW === "quotient";
  // label modes, each naming the selection above the line instead of a ratio beneath it:
  //   power   2³               factors   ×2 ×2 ×2  →  ×8
  //   grow    2³ = 8 (fixed at 1; the slider adds steps)    coef   8 · 2² = 32 (the slider moves it)
  const LABEL = ["power", "factors", "grow", "coef", "back"].includes(SHOW), GROW = SHOW === "grow" || SHOW === "back";
  // back: like grow, but a step taken backwards is marked ÷2 on the hop just left behind
  let removed = null;
  const POWER = LABEL, PLAIN = LABEL || QUOT;
  // ?from=k starts the selection at step k; ?show=quotient adds the ratio written as a quotient of powers
  let s = Math.max(0, Math.min(STEPS - RUN0, +Q.get("from") || 0)), e = s + RUN0, drag = null, geo = null;
  // ?nav=slider: a slider moves the selection instead of the arrows
  const SLIDER = Q.get("nav") === "slider", pos = document.getElementById("pos");
  if (SLIDER) { pos.hidden = false; document.querySelector(".nav").hidden = true; }
  function syncPos() {
    if (GROW) { pos.min = 1; pos.max = STEPS; pos.value = e; return; }
    pos.max = STEPS - (e - s); pos.value = s;
  }
  pos.addEventListener("input", () => {
    if (GROW) { const prev = e; s = 0; e = +pos.value; removed = SHOW === "back" && e < prev ? e : null; render(); return; }
    const n = e - s; s = +pos.value; e = s + n; render();
  });

  function render() {
    const a = out(s), b = out(e), n = e - s, ratio = out(n);
    prev.disabled = s === 0; next.disabled = e === STEPS;
    if (SLIDER) syncPos();
    // ?show=power: the selection's power named above the line, and no ratio beneath it
    const W = svg.clientWidth || 560, L = 18, R = W - 18, AX = POWER ? 100 : 74;
    const H = POWER ? AX + 40 : QUOT ? AX + 150 : AX + 84;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    // partly to scale: positions follow output^0.3, so each step is about 1.23 times longer than the last.
    // Fully to scale, 1 to 2 would be a couple of pixels and 128 to 256 half the line.
    const P = 0.3, span = Math.pow(out(STEPS), P) - 1;
    const px = i => L + (Math.pow(out(i), P) - 1) / span * (R - L);
    geo = { px, L, R, W };

    // the hops: those selected blue, the rest faint
    for (let i = 0; i < STEPS; i++) {
      const lit = i >= s && i < e;
      const rise = Math.min(58, (px(i + 1) - px(i)) * 0.42);
      el("path", { d: `M${px(i)} ${AX} Q${(px(i) + px(i + 1)) / 2} ${AX - rise} ${px(i + 1)} ${AX}`, fill: "none",
        stroke: lit ? EXP : INK, "stroke-opacity": lit ? 0.95 : 0.25, "stroke-width": lit ? 1.6 : 1.2 });
    }
    // back mode: the step just undone, dashed, with ÷2 over it
    if (SHOW === "back" && removed !== null && removed < STEPS) {
      const a1 = px(removed), b1 = px(removed + 1), rise = Math.min(58, (b1 - a1) * 0.42);
      el("path", { d: `M${a1} ${AX} Q${(a1 + b1) / 2} ${AX - rise} ${b1} ${AX}`, fill: "none", stroke: BASE, "stroke-width": 1.6, "stroke-dasharray": "4 4" });
      const d = serif(el("text", { x: (a1 + b1) / 2, y: AX - rise / 2 - 8, "text-anchor": "middle", "font-size": 17 }, "÷2")); d.style.fill = BASE;
    }
    // above the selection: its power, 2 to the number of steps selected
    if (LABEL) {
      const fs = W < 420 ? 18 : 22;
      const t = serif(el("text", { x: 0, y: 30, "text-anchor": "middle", "font-size": fs }));
      const part = (str, col, extra) => { const p = el("tspan", extra || {}, str, t); p.style.fill = col; return p; };
      const pow = k => { part("2", BASE); part(String(k), EXP, { dy: -fs * 0.42, "font-size": fs * 0.62 }); return fs * 0.42; };
      if (SHOW === "power") pow(n);
      else if (SHOW === "factors") { part(Array(n).fill("×2").join(" "), BASE); part("  →  ", INK).style.fillOpacity = 0.5; part(`×${ratio}`, BASE); }
      else if (SHOW === "grow" || SHOW === "back") { const back = pow(n); part(" = ", INK, { dy: back }); part(String(b), VAL); }
      else if (SHOW === "coef") { part(`${a} · `, INK); const back = pow(n); part(" = ", INK, { dy: back }); part(String(b), VAL); }
      // centred over the selection, kept on the page
      const w = t.getComputedTextLength(), cx = Math.max(L + w / 2, Math.min(R - w / 2, (px(s) + px(e)) / 2));
      t.setAttribute("x", cx);
    }
    // below the selection: its two end outputs compared as a ratio
    if (!POWER) {
      const cx = (px(s) + px(e)) / 2, cy = AX + 58;
      const probe = el("g", { opacity: 0 });
      const w = fracAt(0, -999, String(b), String(a), 15, BASE, probe);
      probe.remove();
      const eqW = 16 + String(ratio).length * 9, left = Math.max(L, Math.min(R - (w + eqW), cx - (w + eqW) / 2));
      fracAt(left + w / 2, cy, String(b), String(a), 15, BASE);
      const t = serif(el("text", { x: left + w + 4, y: cy + 5, "font-size": 16 }, `= ${ratio}`));
      t.style.fill = BASE;
      if (QUOT) {   // the same ratio as a quotient of powers: the exponents subtract
        const fs = 18, cy2 = cy + 60, g = el("g", {});
        // a power: an orange 2 with a raised blue exponent, as tspans in text t
        const pow = (t, k) => {
          const a = el("tspan", {}, "2", t); a.style.fill = BASE;
          const b = el("tspan", { dy: -fs * 0.42, "font-size": fs * 0.62 }, String(k), t); b.style.fill = EXP;
          return fs * 0.42;
        };
        const num = serif(el("text", { x: 0, y: cy2 - fs * 0.32, "text-anchor": "middle", "font-size": fs }, null, g)); pow(num, e);
        const den = serif(el("text", { x: 0, y: cy2 + fs * 1.0, "text-anchor": "middle", "font-size": fs }, null, g)); pow(den, s);
        const fw = Math.max(num.getComputedTextLength(), den.getComputedTextLength()) + 10;
        el("line", { x1: -fw / 2, x2: fw / 2, y1: cy2 + 2, y2: cy2 + 2, stroke: BASE, "stroke-width": 1 }, null, g);
        const rest = serif(el("text", { x: fw / 2 + 6, y: cy2 + 8, "font-size": fs }, null, g));
        const eq1 = el("tspan", {}, "= ", rest); eq1.style.fill = BASE;
        let back = pow(rest, `${e}−${s}`);
        const eq2 = el("tspan", { dy: back }, " = ", rest); eq2.style.fill = BASE;
        back = pow(rest, n);
        const total = fw / 2 + 6 + rest.getComputedTextLength() + fw / 2;
        const left2 = Math.max(L, Math.min(R - total, cx - total / 2));
        g.setAttribute("transform", `translate(${left2 + fw / 2} 0)`);
      }
    }

    // the line, its ends, and the two draggable handles at the ends of the selection
    el("line", { x1: L, x2: R, y1: AX, y2: AX, stroke: INK, "stroke-opacity": 0.16, "stroke-width": 1.2 });
    // the output at each step; 1 green, 256 red, the selection's ends bright
    for (let i = 0; i <= STEPS; i++) {
      const on = i === s || i === e;
      const t = el("text", { x: px(i), y: AX + 24, "text-anchor": "middle", "font-size": 12 }, out(i));
      t.style.fill = PLAIN ? INK : i === 0 ? VAL : i === STEPS ? RED : INK;   // plain ends on the Laws page
      t.style.fillOpacity = (!PLAIN && (i === 0 || i === STEPS)) || on ? 1 : 0.45;
    }
    [[0, VAL], [STEPS, RED]].forEach(([i, col]) => { const c = el("circle", { cx: px(i), cy: AX, r: PLAIN ? 2.4 : 3.5 }); c.style.fill = PLAIN ? INK : col; if (PLAIN) c.style.fillOpacity = 0.5; });
    [s, e].forEach(i => {
      if (DRAG) el("circle", { cx: px(i), cy: AX, r: 9, fill: INK, "fill-opacity": drag !== null ? 0.12 : 0.07 });
      const c = el("circle", { cx: px(i), cy: AX, r: DRAG ? 5.5 : 3.5, stroke: DRAG ? "#0e0e11" : "none", "stroke-width": 1.5 });
      c.style.fill = PLAIN ? INK : i === 0 ? VAL : i === STEPS ? RED : INK;
      if (DRAG) c.style.cursor = "grab";
    });

    svg.setAttribute("aria-label", `Steps ${s} to ${e} of times 2, from ${a} to ${b}: ${n} ${n === 1 ? "step" : "steps"}, a ratio of ${b} over ${a}, which is ${ratio}.`);
  }

  // dragging: pick up the nearer handle, snap it to the nearest step, keep it on its own side
  function stepAt(clientX) {
    const r = svg.getBoundingClientRect(), x = clientX - r.left;
    let best = 0;
    for (let i = 1; i <= STEPS; i++) if (Math.abs(geo.px(i) - x) < Math.abs(geo.px(best) - x)) best = i;
    return best;
  }
  svg.style.touchAction = "none";
  if (DRAG) svg.addEventListener("pointerdown", ev => {
    const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
    const ds = Math.abs(x - geo.px(s)), de = Math.abs(x - geo.px(e));
    if (Math.min(ds, de) > 22) return;
    ev.preventDefault();
    drag = ds < de || (ds === de && x < geo.px(s)) ? "s" : "e";
    svg.setPointerCapture(ev.pointerId); render();
  });
  if (DRAG) svg.addEventListener("pointermove", ev => {
    if (!drag) {
      const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
      svg.style.cursor = Math.min(Math.abs(x - geo.px(s)), Math.abs(x - geo.px(e))) <= 22 ? "grab" : "default";
      return;
    }
    const i = stepAt(ev.clientX);
    if (drag === "s") s = Math.min(i, e - 1); else e = Math.max(i, s + 1);
    render();
  });
  const drop = () => { if (drag) { drag = null; render(); } };
  svg.addEventListener("pointerup", drop);
  svg.addEventListener("pointercancel", drop);

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  prev.addEventListener("click", () => { if (s > 0) { s--; e--; render(); } });
  next.addEventListener("click", () => { if (e < STEPS) { s++; e++; render(); } });
  render();
</script>
</body>
</html>
