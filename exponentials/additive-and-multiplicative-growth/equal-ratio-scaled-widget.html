<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multiplicative steps: unequal differences, equal ratios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: none; }
  #fig { -webkit-user-select: none; user-select: none; }
  .nav { display: flex; justify-content: center; gap: 2.4rem; margin-top: 0.4rem; }
  .nav button {
    font: inherit; font-size: 1.3rem; line-height: 1; width: 2.4rem; height: 2.4rem; border-radius: 50%;
    background: none; border: 1px solid var(--faint); color: var(--ink); cursor: pointer;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }
  .nav button:hover:not(:disabled) { border-color: var(--dim); }
  .nav button:disabled { opacity: 0.25; cursor: default; }
  .nav button:focus-visible { outline: 1px solid var(--dim); outline-offset: 3px; }
</style>
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <div class="nav">
    <button id="prev" type="button" aria-label="Slide the selection back one step">←</button>
    <button id="next" type="button" aria-label="Slide the selection forward one step">→</button>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // 1 to 256 in 8 steps of ×2. A run of steps is highlighted: the arrows slide it along the journey and
  // its end dots can be dragged to stretch or shrink it. Above it, the ratio of its end outputs: 2 for
  // one step, 4 for two, 8 for three … the same for an equal number of steps wherever they sit.
  // The steps are drawn the same width: what they share is the ratio, not the distance.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  const INK = "#f4f6ff", BASE = "#e8a33d", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a";
  const STEPS = 8, F = 2;
  const out = i => Math.pow(F, i);

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) {
      if (attrs[a] === null || attrs[a] === undefined) continue;
      if (a === "font-size") e.style.fontSize = attrs[a] + "px"; else e.setAttribute(a, attrs[a]);
    }
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const serif = e => { e.style.fontFamily = "Spectral, Georgia, serif"; return e; };

  // a stacked fraction at (cx, cy): numerator, bar, denominator; returns its width
  function fracAt(cx, cy, num, den, size, col, g) {
    const n = serif(el("text", { x: cx, y: cy - size * 0.28, "text-anchor": "middle", "font-size": size }, num, g));
    const d = serif(el("text", { x: cx, y: cy + size * 0.92, "text-anchor": "middle", "font-size": size }, den, g));
    n.style.fill = col; d.style.fill = col;
    const w = Math.max(n.getComputedTextLength(), d.getComputedTextLength()) + size * 0.3;
    el("line", { x1: cx - w / 2, x2: cx + w / 2, y1: cy, y2: cy, stroke: col, "stroke-width": 1 }, null, g);
    return w;
  }
  // lay a row of pieces (text or fractions) out centred on the page at baseline y
  function row(y, size, pieces) {
    const g = el("g", {});
    let x = 0; const gap = size * 0.4;
    pieces.forEach(p => {
      if (p.frac) {
        const probe = el("g", {}, null, g);
        const w = fracAt(0, 0, p.frac[0], p.frac[1], size * 0.95, p.col || INK, probe);
        probe.remove();
        fracAt(x + w / 2, y - size * 0.32, p.frac[0], p.frac[1], size * 0.95, p.col || INK, g);
        x += w + gap;
      } else {
        const t = serif(el("text", { x, y, "font-size": size }, p.t, g));
        t.style.fill = p.col || INK; if (p.op) t.style.fillOpacity = p.op; if (p.bold) t.style.fontWeight = 500;
        x += t.getComputedTextLength() + gap;
      }
    });
    g.setAttribute("transform", `translate(${(svg.clientWidth || 560) / 2 - (x - gap) / 2} 0)`);
  }

  // the selection runs from step s to step e; drag either end to stretch it, arrows slide it
  // ?run=n starts with n steps selected; ?drag=0 fixes the selection's length (arrows only)
  const Q = new URLSearchParams(location.search);
  const RUN0 = Math.max(1, Math.min(STEPS, +Q.get("run") || 1)), DRAG = Q.get("drag") !== "0";
  let s = 0, e = RUN0, drag = null, geo = null;

  function render() {
    const a = out(s), b = out(e), n = e - s, ratio = out(n);
    prev.disabled = s === 0; next.disabled = e === STEPS;
    const W = svg.clientWidth || 560, L = 18, R = W - 18, AX = 74;
    const H = AX + 84;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    // partly to scale: positions follow output^0.3, so each step is about 1.23 times longer than the last.
    // Fully to scale, 1 to 2 would be a couple of pixels and 128 to 256 half the line.
    const P = 0.3, span = Math.pow(out(STEPS), P) - 1;
    const px = i => L + (Math.pow(out(i), P) - 1) / span * (R - L);
    geo = { px, L, R, W };

    // the hops: those selected blue, the rest faint
    for (let i = 0; i < STEPS; i++) {
      const lit = i >= s && i < e;
      const rise = Math.min(58, (px(i + 1) - px(i)) * 0.42);
      el("path", { d: `M${px(i)} ${AX} Q${(px(i) + px(i + 1)) / 2} ${AX - rise} ${px(i + 1)} ${AX}`, fill: "none",
        stroke: lit ? EXP : INK, "stroke-opacity": lit ? 0.95 : 0.25, "stroke-width": lit ? 1.6 : 1.2 });
    }
    // above the selection: its two end outputs compared as a ratio
    {
      const cx = (px(s) + px(e)) / 2, cy = AX + 58;
      const probe = el("g", { opacity: 0 });
      const w = fracAt(0, -999, String(b), String(a), 15, BASE, probe);
      probe.remove();
      const eqW = 16 + String(ratio).length * 9, left = Math.max(L, Math.min(R - (w + eqW), cx - (w + eqW) / 2));
      fracAt(left + w / 2, cy, String(b), String(a), 15, BASE);
      const t = serif(el("text", { x: left + w + 4, y: cy + 5, "font-size": 16 }, `= ${ratio}`));
      t.style.fill = BASE;
    }

    // the line, its ends, and the two draggable handles at the ends of the selection
    el("line", { x1: L, x2: R, y1: AX, y2: AX, stroke: INK, "stroke-opacity": 0.16, "stroke-width": 1.2 });
    // the output at each step; 1 green, 256 red, the selection's ends bright
    for (let i = 0; i <= STEPS; i++) {
      const on = i === s || i === e;
      const t = el("text", { x: px(i), y: AX + 24, "text-anchor": "middle", "font-size": 12 }, out(i));
      t.style.fill = i === 0 ? VAL : i === STEPS ? RED : INK;
      t.style.fillOpacity = i === 0 || i === STEPS || on ? 1 : 0.45;
    }
    [[0, VAL], [STEPS, RED]].forEach(([i, col]) => { const c = el("circle", { cx: px(i), cy: AX, r: 3.5 }); c.style.fill = col; });
    [s, e].forEach(i => {
      if (DRAG) el("circle", { cx: px(i), cy: AX, r: 9, fill: INK, "fill-opacity": drag !== null ? 0.12 : 0.07 });
      const c = el("circle", { cx: px(i), cy: AX, r: DRAG ? 5.5 : 3.5, stroke: DRAG ? "#0e0e11" : "none", "stroke-width": 1.5 });
      c.style.fill = i === 0 ? VAL : i === STEPS ? RED : INK;
      if (DRAG) c.style.cursor = "grab";
    });

    svg.setAttribute("aria-label", `Steps ${s} to ${e} of times 2, from ${a} to ${b}: ${n} ${n === 1 ? "step" : "steps"}, a ratio of ${b} over ${a}, which is ${ratio}.`);
  }

  // dragging: pick up the nearer handle, snap it to the nearest step, keep it on its own side
  function stepAt(clientX) {
    const r = svg.getBoundingClientRect(), x = clientX - r.left;
    let best = 0;
    for (let i = 1; i <= STEPS; i++) if (Math.abs(geo.px(i) - x) < Math.abs(geo.px(best) - x)) best = i;
    return best;
  }
  svg.style.touchAction = "none";
  if (DRAG) svg.addEventListener("pointerdown", ev => {
    const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
    const ds = Math.abs(x - geo.px(s)), de = Math.abs(x - geo.px(e));
    if (Math.min(ds, de) > 22) return;
    ev.preventDefault();
    drag = ds < de || (ds === de && x < geo.px(s)) ? "s" : "e";
    svg.setPointerCapture(ev.pointerId); render();
  });
  if (DRAG) svg.addEventListener("pointermove", ev => {
    if (!drag) {
      const r = svg.getBoundingClientRect(), x = ev.clientX - r.left;
      svg.style.cursor = Math.min(Math.abs(x - geo.px(s)), Math.abs(x - geo.px(e))) <= 22 ? "grab" : "default";
      return;
    }
    const i = stepAt(ev.clientX);
    if (drag === "s") s = Math.min(i, e - 1); else e = Math.max(i, s + 1);
    render();
  });
  const drop = () => { if (drag) { drag = null; render(); } };
  svg.addEventListener("pointerup", drop);
  svg.addEventListener("pointercancel", drop);

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  prev.addEventListener("click", () => { if (s > 0) { s--; e--; render(); } });
  next.addEventListener("click", () => { if (e < STEPS) { s++; e++; render(); } });
  render();
</script>
</body>
</html>
