<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Output against steps, on a logarithmic scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  :root { --value: #7fcf9a; }
  .graphs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(0.6rem, 4vw, 2.2rem); }
  .panel { min-width: 0; text-align: center; }
  .panel h3 { font-weight: 400; font-size: clamp(1.05rem, 3.4vw, 1.25rem); color: var(--ink); margin-bottom: 0.2rem; }
  .control { margin-top: 1.4rem; text-align: center; }
  .metric-lab { margin-top: 1rem; text-align: center; font-size: 1.05rem; color: var(--dim); }
  .metric-v { margin-top: 0.3rem; text-align: center; font-size: clamp(1.5rem, 5vw, 1.9rem); line-height: 1.25; color: #f4879c; font-variant-numeric: tabular-nums; }
  .metric-v.steps { color: var(--exp); }
  .control input[type="range"] { margin-top: 0.4rem; }
</style>
</head>
<body>
<div class="widget">
  <div class="graphs">
    <div class="panel">
      <h3>Additive</h3>
      <svg id="g-add" role="img"></svg>
    </div>
    <div class="panel">
      <h3>Multiplicative</h3>
      <svg id="g-mul" role="img"></svg>
    </div>
  </div>
  <div class="metric-lab">Steps taken</div>
  <div class="metric-v steps" id="p">50%</div>
  <div class="metric-lab">Output</div>
  <div class="graphs readouts">
    <div class="panel"><div class="metric-v" id="v-add">50</div></div>
    <div class="panel"><div class="metric-v" id="v-mul">10</div></div>
  </div>
  <div class="control">
    <input id="s" type="range" min="0" max="100" step="1" value="50" aria-label="Percentage of steps taken, from 0 to 100" autocomplete="off" />
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // Output against percentage of steps taken, for two journeys to 100: additive (from 0, output = steps %)
  // and multiplicative (from 1, output = 100^(steps % / 100)). The output axis can be linear or
  // logarithmic. On the logarithmic axis the multiplicative journey becomes a straight line, and the
  // additive one bends over; zero cannot be shown, so the additive line starts at 1.
  const NS = "http://www.w3.org/2000/svg";
  const INK = "#f4f6ff", EXP = "#7aa7ff", VAL = "#7fcf9a", RED = "#e8706a", BASE = "#e8a33d", CORAL = "#f4879c";
  const slider = document.getElementById("s");
  const add = p => p, mul = p => Math.pow(100, p / 100);
  const fmt = v => Number(v.toFixed(1)).toString();
  let p = 50;
  const scale = "log";   // this widget always shows the logarithmic output scale

  // plot area inside a 300 × 230 view box
  const L = 34, R = 288, T = 14, B = 196;
  const sx = q => L + (q / 100) * (R - L);
  const sy = v => scale === "log" ? B - (Math.log10(v) / 2) * (B - T) : B - (v / 100) * (B - T);

  function el(svg, name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }
  const label = (svg, x, y, t, col, anchor, op) => {
    const e = el(svg, "text", { x, y, "text-anchor": anchor || "middle" }, t);
    e.style.fill = col; e.style.fillOpacity = op === undefined ? 1 : op; e.style.fontSize = "12px"; return e;
  };

  const graphs = [["g-add", add, "Additive"], ["g-mul", mul, "Multiplicative"]].map(([id, f, name]) => {
    const svg = document.getElementById(id); svg.setAttribute("viewBox", "0 0 300 230");
    return { svg, f, name };
  });

  function draw(g) {
    const { svg, f } = g;
    svg.textContent = "";
    // output labels: the start (0 additive, 1 multiplicative) and 100 on the linear scale; 1, 10 and 100 on the logarithmic scale
    const ticks = scale === "log" ? [1, 10, 100] : [f(0), 100];
    ticks.forEach(t => {
      const start = t === f(0), col = t === 100 ? RED : start ? VAL : INK;
      label(svg, L - 7, sy(t) + 4, String(t), col, "end", t === 100 || start ? 1 : 0.6);
    });
    if (scale === "log") {   // minor ticks on the output axis, bunching towards each power of 10
      for (const m of [1, 10]) for (let k = 2; k <= 9; k++) el(svg, "line", { x1: L - 3, x2: L, y1: sy(k * m), y2: sy(k * m), stroke: INK, "stroke-opacity": 0.3 });
    }
    el(svg, "path", { d: `M${L} ${T - 6} V${B} H${R + 6}`, fill: "none", stroke: INK, "stroke-opacity": 0.16, "stroke-width": 1.2 });
    label(svg, L, B + 18, "0", INK, "middle", 0.6);
    label(svg, R + 6, B + 18, "100%", INK, "end", 0.6);
    label(svg, (L + R) / 2, B + 32, "steps", INK);
    // halfway up the axis; on the logarithmic scale that is where the 10 sits, so the label moves up clear of it
    const ly = scale === "log" ? (sy(10) + sy(100)) / 2 : (T + B) / 2;
    const yl = label(svg, 8, ly, "output", INK); yl.setAttribute("transform", `rotate(-90 8 ${ly})`);

    // the curve; on the logarithmic scale, only outputs of 1 and above
    let d = "";
    for (let i = 0; i <= 200; i++) {
      const q = i / 2, v = f(q);
      if (scale === "log" && v < 1) continue;
      d += `${d ? "L" : "M"}${sx(q).toFixed(1)} ${sy(v).toFixed(1)} `;
    }
    el(svg, "path", { d, fill: "none", stroke: INK, "stroke-opacity": 0.55, "stroke-width": 1.6, "stroke-linecap": "round" });
    if (f(0) >= 1 || scale === "linear") { const s0 = el(svg, "circle", { cx: sx(0), cy: sy(f(0)), r: 3.2 }); s0.style.fill = VAL; }
    const s1 = el(svg, "circle", { cx: sx(100), cy: sy(100), r: 3.2 }); s1.style.fill = RED;

    // where we are: guides up from the steps and across to the output
    const v = f(p);
    if (!(scale === "log" && v < 1)) {
      const x = sx(p), y = sy(v);
      el(svg, "line", { x1: x, x2: x, y1: B, y2: y, stroke: EXP, "stroke-opacity": 0.6, "stroke-dasharray": "3 4" });
      el(svg, "line", { x1: L, x2: x, y1: y, y2: y, stroke: CORAL, "stroke-opacity": 0.75, "stroke-dasharray": "3 4" });
      const dot = el(svg, "circle", { cx: x, cy: y, r: 5 }); dot.style.fill = VAL;
    }
    svg.setAttribute("aria-label", `${g.name}, ${scale === "log" ? "logarithmic" : "linear"} output scale: ${p}% of steps taken, output ${fmt(v)}.`);
  }

  function update() {
    graphs.forEach(draw);
    document.getElementById("v-add").textContent = fmt(add(p));
    document.getElementById("v-mul").textContent = fmt(mul(p));
    document.getElementById("p").textContent = p + "%";
    if (window.postWidgetHeight) window.postWidgetHeight();
  }

  slider.addEventListener("input", () => { p = +slider.value; update(); });
  // start at 50% even if the browser restores the slider from an earlier visit
  slider.value = 50;
  update();
</script>
</body>
</html>
