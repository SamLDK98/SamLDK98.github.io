<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adding and multiplying steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="n" type="range" min="1" max="12" step="1" value="2" aria-label="How many equal steps from 1 to 100" />
</div>

<script src="../widget-base.js"></script>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("n");
  const INK = "#f4f6ff", BASE = "#e8a33d";

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined && text !== null) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  slider.addEventListener("input", render);

  // From 1 to 100 in n equal steps, two ways, on one ordinary number line. Adding: every step adds
  // 99/n, so the points are evenly spaced. Multiplying: every step multiplies by the nth root of 100,
  // so the points bunch up near 1 and spread out towards 100. With an even number of steps the middle
  // point is marked: 50.5 by adding, 10 by multiplying.
  const H = 116, ADD = 34, MUL = 80;
  const short = x => String(+x.toFixed(2));

  function render() {
    const n = +slider.value;
    const W = svg.clientWidth || 320;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const L = 58, R = W - 14;
    const px = v => L + (v - 1) / 99 * (R - L);

    const step = 99 / n, factor = Math.pow(100, 1 / n), even = n % 2 === 0;
    const rows = [
      { y: ADD, tag: "+" + short(step), at: k => 1 + step * k, mid: "50.5", up: true },
      { y: MUL, tag: "×" + short(factor), at: k => Math.pow(100, k / n), mid: "10", up: false },
    ];
    rows.forEach(row => {
      el("line", { x1: px(1), x2: px(100), y1: row.y, y2: row.y, stroke: INK, "stroke-opacity": 0.18 });
      el("text", { x: L - 12, y: row.y + 4, "text-anchor": "end", class: "ink" }, row.tag);
      for (let k = 0; k <= n; k++) {
        const middle = even && k === n / 2;
        el("circle", { cx: px(row.at(k)), cy: row.y, r: middle ? 4.4 : 3.2, fill: middle ? BASE : INK, "fill-opacity": middle ? 1 : 0.85 });
      }
      if (even) el("text", { x: px(row.at(n / 2)), y: row.up ? row.y - 11 : row.y + 21, "text-anchor": "middle", class: "base" }, row.mid);
    });
    // the two ends, once, under the lower line
    el("text", { x: px(1), y: MUL + 21, "text-anchor": "middle" }, "1");
    el("text", { x: px(100), y: MUL + 21, "text-anchor": "middle" }, "100");

    svg.setAttribute("aria-label", `From 1 to 100 in ${n} equal step${n > 1 ? "s" : ""}. Adding ${short(step)} each time, the points are evenly spaced. ` +
      `Multiplying by ${short(factor)} each time, they bunch up near 1 and spread out towards 100.` +
      (even ? " Halfway is 50.5 by adding, but 10 by multiplying." : ""));
  }
  render();
</script>
</body>
</html>
