<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>100 to the power x, as x goes from 0 to 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="s" type="range" min="0" max="100" step="1" value="50" aria-label="The exponent x, from 0 to 1" />
</div>

<script src="../widget-base.js"></script>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("s");
  const INK = "#f4f6ff", BASE = "#e8a33d", EXP = "#7aa7ff";

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  slider.addEventListener("input", render);

  // The exponent x moves evenly along the top line, from 0 to 1. Below, 100 to the power x moves along
  // an ordinary number line from 1 to 100. Faint threads join the quarters of the exponent line to
  // where they land: equal steps in the exponent, unequal steps in the value. Halfway, x = 1/2, lands
  // on 10, not on 50.5.
  const H = 158, TOP = 40, BOT = 108;
  const fmt = v => v >= 99.95 ? "100" : String(+v.toPrecision(3));

  function render() {
    const x = slider.value / 100;
    const W = svg.clientWidth || 320;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const L = 14, R = W - 14;
    const ex = t => L + t * (R - L), vx = v => L + (v - 1) / 99 * (R - L);

    for (const y of [TOP, BOT]) el("line", { x1: L, x2: R, y1: y, y2: y, stroke: INK, "stroke-opacity": 0.18 });
    const quarters = [0, 0.25, 0.5, 0.75, 1], names = ["0", "¼", "½", "¾", "1"];
    quarters.forEach((t, i) => {
      el("line", { x1: ex(t), x2: vx(Math.pow(100, t)), y1: TOP + 5, y2: BOT - 5, stroke: INK, "stroke-opacity": t === 0.5 ? 0.3 : 0.12, "stroke-dasharray": "2 3" });
      el("line", { x1: ex(t), x2: ex(t), y1: TOP - 4, y2: TOP + 4, stroke: EXP, "stroke-opacity": 0.6 });
      el("text", { x: ex(t), y: TOP - 10, "text-anchor": "middle", class: "exp" }, names[i]);
      el("line", { x1: vx(Math.pow(100, t)), x2: vx(Math.pow(100, t)), y1: BOT - 4, y2: BOT + 4, stroke: BASE, "stroke-opacity": 0.5 });
    });
    el("text", { x: L, y: 12 }, "exponent");
    el("text", { x: vx(1), y: BOT + 18, "text-anchor": "middle" }, "1");
    el("text", { x: vx(100), y: BOT + 18, "text-anchor": "middle" }, "100");

    const v = Math.pow(100, x);
    el("line", { x1: ex(x), x2: vx(v), y1: TOP, y2: BOT, stroke: INK, "stroke-opacity": 0.6, "stroke-width": 1.4 });
    el("circle", { cx: ex(x), cy: TOP, r: 5, fill: EXP });
    el("circle", { cx: vx(v), cy: BOT, r: 5, fill: BASE });
    // 100 with its exponent raised, then the value
    const e = String(+x.toFixed(2)), val = fmt(v);
    const lw = (3 + val.length + 3) * 6.6 + e.length * 5.4, lx = Math.min(Math.max(vx(v), L + lw / 2), R - lw / 2);
    const t = el("text", { x: lx, y: BOT + 42, "text-anchor": "middle", class: "base" });
    t.appendChild(document.createTextNode("100"));
    const sup = document.createElementNS(NS, "tspan"); sup.setAttribute("dy", "-5"); sup.setAttribute("font-size", "9"); sup.setAttribute("class", "exp"); sup.style.fill = EXP; sup.textContent = e; t.appendChild(sup);
    const rest = document.createElementNS(NS, "tspan"); rest.setAttribute("dy", "5"); rest.textContent = " = " + val; t.appendChild(rest);

    svg.setAttribute("aria-label", `The exponent is ${+x.toFixed(2)}, and 100 to that power is ${fmt(v)}. Equal steps in the exponent land on 1, 3.16, 10, 31.6 and 100.`);
  }
  render();
</script>
</body>
</html>
