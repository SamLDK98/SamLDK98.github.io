<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hills and valleys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e11; --panel-2: #17171d;
    --line: rgba(140,165,225,0.16);
    --txt: #f4f6ff; --txt-2: rgba(238,242,252,0.74); --txt-3: rgba(238,242,252,0.42);
    --land: #9d7bff;    /* the landscape — potential */
    --slope: #ffc247;   /* steepness — field strength */
    --src: #ff6a3d;     /* the object itself */
    --ball: #f4f6ff;
  }
  html, body { background: var(--bg); }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--txt); -webkit-font-smoothing: antialiased; }
  .bench { background: var(--bg); border: 1px solid var(--line); }

  .head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    padding: 11px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .head-title { font-family: "IBM Plex Mono", monospace; font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--txt-2); }
  .readout { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; display: flex; gap: 1.1rem; flex-wrap: wrap; color: var(--txt-3); }
  .readout b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .readout .d b { color: var(--land); }
  .readout .s b { color: var(--slope); }

  canvas { display: block; width: 100%; height: 340px; cursor: crosshair; }

  .bar { border-top: 1px solid var(--line); padding: 13px 16px 15px; display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .group { display: flex; flex-direction: column; gap: 5px; }
  .glabel { font-family: "IBM Plex Mono", monospace; font-size: 0.57rem; letter-spacing: 0.17em; text-transform: uppercase; color: var(--txt-3); }
  .seg { display: flex; }
  .seg button {
    font-family: "IBM Plex Sans", sans-serif; font-size: 0.75rem; font-weight: 500;
    color: var(--txt-2); background: var(--panel-2);
    border: 1px solid var(--line); border-right-width: 0;
    padding: 8px 14px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .seg button:last-child { border-right-width: 1px; }
  .seg button:hover { background: #1e1e27; color: var(--txt); }
  .seg button[aria-pressed="true"] { background: var(--src); border-color: var(--src); color: #14100c; font-weight: 600; }
  .seg button:focus-visible { outline: 2px solid var(--land); outline-offset: 2px; }

  .actions { margin-left: auto; display: flex; gap: 8px; align-items: flex-end; }
  .actions button {
    font-family: "IBM Plex Sans", sans-serif; font-size: 0.78rem; font-weight: 600;
    padding: 9px 16px; cursor: pointer; border: 1px solid var(--land);
    background: var(--land); color: #100a1c;
    transition: background 0.15s ease;
  }
  .actions button:hover { background: #b79bff; }
  .actions button:focus-visible { outline: 2px solid var(--slope); outline-offset: 2px; }

  .hint { font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; letter-spacing: 0.1em; color: var(--txt-3); width: 100%; margin-top: 2px; }

  @media (max-width: 640px) {
    .actions { margin-left: 0; width: 100%; }
    .actions button { flex: 1; }
  }
</style>
</head>
<body>
<div class="bench">
  <div class="head">
    <span class="head-title">The same field, drawn as a landscape</span>
    <span class="readout">
      <span class="d">depth here <b id="ro-depth">0.0</b></span>
      <span class="s">steepness here <b id="ro-slope">0.0</b></span>
    </span>
  </div>

  <canvas id="land" aria-label="A side-on landscape. Flat when the field is empty; an object digs a valley whose depth is the potential and whose steepness is the field strength."></canvas>

  <div class="bar">
    <div class="group">
      <span class="glabel">Mass of the object</span>
      <div class="seg" id="mass" role="group" aria-label="Mass of the object">
        <button type="button" data-m="0"  aria-pressed="true">None</button>
        <button type="button" data-m="6"  aria-pressed="false">Light</button>
        <button type="button" data-m="12" aria-pressed="false">Medium</button>
        <button type="button" data-m="18" aria-pressed="false">Heavy</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="drop">Drop a ball</button>
    </div>
    <p class="hint" id="hint">With no object the land is flat — every point sits at 0. Click anywhere on the landscape to drop a ball.</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // Same field as the other figures: a uniform sphere, G = 1, R fixed at 1.
  //   outside r>=R : Phi = -M/r        dPhi/dr = M/r^2
  //   inside  r<R  : Phi = -M(3R^2-r^2)/(2R^3)   dPhi/dr = M r/R^3
  const R = 1;
  const Phi = (M, r) => (r >= R ? -M / r : -M * (3 * R * R - r * r) / (2 * R * R * R));
  const gMag = (M, r) => (r >= R ? M / (r * r) : M * r / (R * R * R));
  // slope of the land along x; r = |x|
  const slope = (M, x) => (x === 0 ? 0 : Math.sign(x) * gMag(M, Math.abs(x)));

  const X = 6;              // the landscape spans -6..6
  const PHI_FLOOR = -30;    // vertical scale
  const state = { M: 0, ball: null };

  const cvs = $('land'), ctx = cvs.getContext('2d');
  let w = 0, h = 0;
  function fit() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const r = cvs.getBoundingClientRect();
    w = r.width; h = r.height;
    cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const css = getComputedStyle(document.documentElement);
  const c = (n) => css.getPropertyValue(n).trim();
  const C = { land: c('--land'), slope: c('--slope'), src: c('--src'), ball: c('--ball'),
              txt2: c('--txt-2'), txt3: c('--txt-3'), line: c('--line') };

  const PAD = { t: 26, b: 30, l: 14, r: 14 };
  const xAt = (u) => PAD.l + ((u + X) / (2 * X)) * (w - PAD.l - PAD.r);
  const xOf = (px) => ((px - PAD.l) / (w - PAD.l - PAD.r)) * 2 * X - X;
  const yAt = (v) => PAD.t + (v / PHI_FLOOR) * (h - PAD.t - PAD.b);

  function draw() {
    ctx.clearRect(0, 0, w, h);
    const M = state.M;

    // the undisturbed level — where the land sits when nothing is there
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, yAt(0)); ctx.lineTo(w - PAD.r, yAt(0)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '500 9px "IBM Plex Mono", monospace';
    ctx.fillStyle = C.txt3; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('0 — the undisturbed field', PAD.l + 2, yAt(0) - 4);

    // the land itself
    const pts = [];
    for (let px = 0; px <= w - PAD.l - PAD.r; px += 1) {
      const u = xOf(PAD.l + px);
      pts.push([PAD.l + px, yAt(M > 0 ? Phi(M, Math.abs(u)) : 0)]);
    }
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.lineTo(w - PAD.r, h - PAD.b + 12);
    ctx.lineTo(PAD.l, h - PAD.b + 12);
    ctx.closePath();
    ctx.fillStyle = 'rgba(157,123,255,0.13)'; ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.strokeStyle = C.land; ctx.lineWidth = 2.4;
    ctx.shadowColor = C.land; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;

    // where the object physically sits — its own coordinates, not the landscape
    if (M > 0) {
      ctx.fillStyle = 'rgba(255,106,61,0.13)';
      ctx.fillRect(xAt(-R), PAD.t - 14, xAt(R) - xAt(-R), h - PAD.b - PAD.t + 26);
      ctx.strokeStyle = 'rgba(255,106,61,0.5)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(xAt(s * R), PAD.t - 14); ctx.lineTo(xAt(s * R), h - PAD.b + 12); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.font = '600 9px "IBM Plex Mono", monospace';
      ctx.fillStyle = C.src; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('the object sits here', xAt(0), PAD.t - 12);
    }

    // the ball
    if (state.ball) {
      const bx = xAt(state.ball.x);
      const by = yAt(M > 0 ? Phi(M, Math.abs(state.ball.x)) : 0) - 8;
      ctx.fillStyle = C.ball;
      ctx.shadowColor = C.ball; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(bx, by, 7, 0, 6.2832); ctx.fill(); ctx.shadowBlur = 0;

      // the slope it feels, drawn as a short tangent
      const s = M > 0 ? slope(M, state.ball.x) : 0;
      if (Math.abs(s) > 0.01) {
        const dir = s > 0 ? -1 : 1;                 // downhill
        ctx.strokeStyle = C.slope; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + dir * 26, by); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(bx + dir * 34, by);
        ctx.lineTo(bx + dir * 24, by - 5); ctx.lineTo(bx + dir * 24, by + 5);
        ctx.closePath(); ctx.fillStyle = C.slope; ctx.fill();
      }
    }

    // depth axis
    ctx.font = '500 9px "IBM Plex Mono", monospace';
    ctx.fillStyle = C.txt3; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('−30', w - PAD.r - 2, yAt(-30));
  }

  function readout() {
    const b = state.ball;
    const d = (state.M > 0 && b) ? Phi(state.M, Math.abs(b.x)) : 0;
    const s = (state.M > 0 && b) ? Math.abs(slope(state.M, b.x)) : 0;
    $('ro-depth').textContent = (d === 0 ? '0.0' : '−' + Math.abs(d).toFixed(1));
    $('ro-slope').textContent = s.toFixed(1);
    $('hint').textContent = state.M === 0
      ? 'With no object the land is flat — every point sits at 0. Click anywhere on the landscape to drop a ball.'
      : (b ? 'The ball rolls downhill. How hard it is pulled is the steepness — the field strength at that point.'
           : 'The valley is the field. Click anywhere on the landscape to drop a ball into it.');
  }

  function render() { draw(); readout(); }

  // --- rolling: cosmetic only. The ball's resting place is set immediately, so
  //     a missing animation frame never leaves a wrong reading on screen. ---
  let raf = 0, stop = 0;
  function roll() {
    cancelAnimationFrame(raf); clearTimeout(stop);
    if (state.M === 0 || !state.ball) { render(); return; }
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      state.ball.x = 0; render(); return;
    }
    let last = performance.now();
    const step = (now) => {
      const dt = Math.min(48, now - last) / 1000; last = now;
      const b = state.ball;
      b.v += -slope(state.M, b.x) * 2.0 * dt;
      b.v *= Math.pow(0.35, dt);                  // damping, so it settles
      b.x += b.v * dt;
      if (b.x < -X) { b.x = -X; b.v = 0; }
      if (b.x > X) { b.x = X; b.v = 0; }
      render();
      if (Math.abs(b.v) > 0.03 || Math.abs(b.x) > 0.04) raf = requestAnimationFrame(step);
      else { b.x = 0; b.v = 0; render(); }
    };
    raf = requestAnimationFrame(step);
    // Settle at the true resting place rather than wherever the animation got to.
    // Frames are not guaranteed (a backgrounded tab stops rAF entirely), and a ball
    // stranded halfway down would be a wrong reading, not just a missing flourish.
    stop = setTimeout(() => {
      cancelAnimationFrame(raf);
      state.ball.x = 0; state.ball.v = 0; render();
    }, 4000);
  }

  cvs.addEventListener('pointerdown', (e) => {
    const r = cvs.getBoundingClientRect();
    const u = Math.max(-X, Math.min(X, xOf(e.clientX - r.left)));
    state.ball = { x: u, v: 0 };
    render(); roll();
  });

  $('drop').addEventListener('click', () => {
    state.ball = { x: 4.5, v: 0 };
    render(); roll();
  });

  $('mass').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-m]'); if (!b) return;
    state.M = +b.dataset.m;
    for (const x of $('mass').querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    cancelAnimationFrame(raf); clearTimeout(stop);
    if (state.ball) state.ball.v = 0;
    render(); roll();
  });

  function postHeight() {
    const hh = Math.ceil(document.querySelector('.bench').getBoundingClientRect().height);
    if (window.parent !== window && hh > 100) window.parent.postMessage({ type: 'land-height', height: hh }, '*');
  }
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fit(); render(); postHeight(); }, 140); });
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.querySelector('.bench'));
  window.addEventListener('load', () => { fit(); render(); postHeight(); setTimeout(postHeight, 250); });

  fit(); render(); postHeight();
})();
</script>
</body>
</html>
