<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Many sources — superposition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e11; --panel-2: #17171d;
    --line: rgba(140,165,225,0.16);
    --txt: #f4f6ff; --txt-2: rgba(238,242,252,0.74); --txt-3: rgba(238,242,252,0.42);
    --pot: #9d7bff; --str: #ffc247; --src: #ff6a3d; --sel: #54d6a0;
  }
  html, body { background: var(--bg); }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--txt); -webkit-font-smoothing: antialiased; }
  .bench { background: var(--bg); border: 1px solid var(--line); }

  .head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    padding: 11px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .head-title { font-family: "IBM Plex Mono", monospace; font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--txt-2); }
  .readout { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; display: flex; gap: 1.1rem; flex-wrap: wrap; color: var(--txt-3); }
  .readout b { font-weight: 600; color: var(--txt); font-variant-numeric: tabular-nums; }

  .main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
  .cell { min-width: 0; padding: 12px 14px 14px; }
  .cell + .cell { border-left: 1px solid var(--line); }
  .cap { font-family: "IBM Plex Mono", monospace; font-size: 0.58rem; letter-spacing: 0.17em; text-transform: uppercase; color: var(--txt-3); margin-bottom: 7px; }

  canvas { display: block; width: 100%; height: 400px; cursor: crosshair; touch-action: none; }

  /* the summation ledger */
  .sum { font-family: "IBM Plex Mono", monospace; font-size: 0.76rem; line-height: 1.95; }
  .sum .row { display: flex; justify-content: space-between; gap: 0.8rem; align-items: baseline; }
  .sum .row .who { display: flex; align-items: center; gap: 7px; color: var(--txt-2); }
  .sum .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .sum .row b { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--txt-2); }
  .sum .rule { border-top: 1px solid var(--line); margin: 0.5rem 0; }
  .sum .net { font-size: 0.95rem; }
  .sum .net b { color: var(--pot); font-size: 1.05rem; }
  .sum .grad { margin-top: 0.55rem; }
  .sum .grad b { color: var(--str); }
  .empty { color: var(--txt-3); font-size: 0.78rem; line-height: 1.5; font-family: "IBM Plex Sans", sans-serif; }

  .bar { border-top: 1px solid var(--line); padding: 12px 16px 15px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .group { display: flex; flex-direction: column; gap: 5px; }
  .glabel { font-family: "IBM Plex Mono", monospace; font-size: 0.56rem; letter-spacing: 0.17em; text-transform: uppercase; color: var(--txt-3); }
  .seg { display: flex; }
  .seg button, .btn {
    font-family: "IBM Plex Sans", sans-serif; font-size: 0.74rem; font-weight: 500;
    color: var(--txt-2); background: var(--panel-2);
    border: 1px solid var(--line); padding: 8px 12px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .seg button { border-right-width: 0; }
  .seg button:last-child { border-right-width: 1px; }
  .seg button:hover, .btn:hover { background: #1e1e27; color: var(--txt); }
  .seg button[aria-pressed="true"] { background: var(--pot); border-color: var(--pot); color: #100a1c; font-weight: 600; }
  .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--str); outline-offset: 2px; }
  .actions { margin-left: auto; display: flex; gap: 7px; align-items: flex-end; }
  .hint { font-family: "IBM Plex Mono", monospace; font-size: 0.59rem; letter-spacing: 0.09em; color: var(--txt-3); width: 100%; }

  @media (max-width: 900px) {
    .main { grid-template-columns: minmax(0,1fr); }
    .cell + .cell { border-left: 0; border-top: 1px solid var(--line); }
    canvas { height: 320px; }
    .actions { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="bench">
  <div class="head">
    <span class="head-title">Many sources, one landscape</span>
    <span class="readout">
      <span>sources <b id="ro-n">2</b></span>
      <span>Φ here <b id="ro-phi">0.00</b></span>
      <span>|g| here <b id="ro-g">0.00</b></span>
    </span>
  </div>

  <div class="main">
    <div class="cell">
      <div class="cap">Contours of the net field — drag a source, click anywhere to inspect</div>
      <canvas id="map" aria-label="A topographic map of the field produced by several sources. Contour bands show the net potential; numbers at grid intersections show its value."></canvas>
    </div>
    <div class="cell">
      <div class="cap">How that value is made</div>
      <div id="sum" class="sum"></div>
    </div>
  </div>

  <div class="bar">
    <div class="group">
      <span class="glabel">Arrangement</span>
      <div class="seg" id="preset" role="group" aria-label="Preset arrangement">
        <button type="button" data-p="two"    aria-pressed="true">Two equal</button>
        <button type="button" data-p="uneven" aria-pressed="false">One dominant</button>
        <button type="button" data-p="many"   aria-pressed="false">Scattered</button>
      </div>
    </div>
    <div class="group">
      <span class="glabel">Show</span>
      <div class="seg" id="show" role="group" aria-label="Overlays">
        <button type="button" data-s="nums"   aria-pressed="true">Values</button>
        <button type="button" data-s="arrows" aria-pressed="false">Slope arrows</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="add">Add a source</button>
      <button class="btn" type="button" id="clear">Clear</button>
    </div>
    <p class="hint" id="hint">Every intersection adds up the pull of every source. Drag a source and watch the whole map re-sum.</p>
  </div>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // ---- field maths: identical form to the other figures, summed over sources ----
  const R = 0.6;                                   // every source has real extent
  const phiOne = (M, r) => (r >= R ? -M / r : -M * (3 * R * R - r * r) / (2 * R * R * R));
  const gOne   = (M, r) => (r >= R ? M / (r * r) : M * r / (R * R * R));

  const EX = 8, EY = 5;                            // field spans -8..8, -5..5
  const PHI_REF = 26;                              // colour scale
  const BANDS = 11;                                // contour bands

  const PALETTE = ['#ff6a3d', '#ffc247', '#54d6a0', '#35d2ff', '#c98bff', '#ff8fa3'];

  let srcs = [];
  let sel = { x: 0, y: 0 };
  const show = { nums: true, arrows: false };

  const PRESETS = {
    two:    [{ M: 15, x: -3, y: 0 }, { M: 15, x: 3, y: 0 }],
    uneven: [{ M: 60, x: -4, y: 0 }, { M: 7, x: 2.5, y: 2 }, { M: 7, x: 3.5, y: -2 }],
    many:   [{ M: 26, x: -5, y: 1.5 }, { M: 10, x: -1, y: -2.5 }, { M: 16, x: 2, y: 2.2 },
             { M: 8, x: 5, y: -1 }, { M: 12, x: 6, y: 2.6 }]
  };
  const load = (k) => { srcs = PRESETS[k].map((s, i) => ({ ...s, c: PALETTE[i % PALETTE.length] })); };
  load('two');

  const phiAt = (x, y) => srcs.reduce((a, s) => a + phiOne(s.M, Math.hypot(x - s.x, y - s.y)), 0);
  function gAt(x, y) {
    let gx = 0, gy = 0;
    for (const s of srcs) {
      const dx = s.x - x, dy = s.y - y, r = Math.hypot(dx, dy);
      if (r < 1e-6) continue;
      const m = gOne(s.M, r);
      gx += m * dx / r; gy += m * dy / r;          // points toward the source
    }
    return { gx, gy, mag: Math.hypot(gx, gy) };
  }

  // ---- canvas ----
  const cvs = $('map'), ctx = cvs.getContext('2d');
  let w = 0, h = 0, dpr = 1;
  function fit() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const r = cvs.getBoundingClientRect();
    w = r.width; h = r.height;
    cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const xAt = (u) => ((u + EX) / (2 * EX)) * w;
  const yAt = (v) => ((v + EY) / (2 * EY)) * h;
  const uOf = (px) => (px / w) * 2 * EX - EX;
  const vOf = (py) => (py / h) * 2 * EY - EY;

  const minus = (n) => (n < 0 ? '−' : '') + Math.abs(n).toFixed(2);

  function draw() {
    // A zero-width canvas (collapsed container, or an iframe measured before
    // layout) makes createImageData throw, which would abort the whole render
    // and leave the panel blank. Bail out of the pixel work instead.
    const W = cvs.width, H = cvs.height;
    if (W < 1 || H < 1) return;

    ctx.clearRect(0, 0, w, h);

    // --- banded potential: quantising the value is what turns a smooth field
    //     into a contour map, and the band edges are the contour lines ---
    const img = ctx.createImageData(W, H);
    const d = img.data;
    const bandOf = new Int16Array(W * H);
    for (let py = 0; py < H; py += 1) {
      const v = vOf(py / dpr);
      for (let px = 0; px < W; px += 1) {
        const u = uOf(px / dpr);
        const t = Math.min(1, Math.abs(phiAt(u, v)) / PHI_REF);
        const b = Math.min(BANDS - 1, Math.floor(Math.pow(t, 0.72) * BANDS));
        bandOf[py * W + px] = b;
        const k = b / (BANDS - 1);
        const i = (py * W + px) * 4;
        d[i]     = 14 + (157 - 14) * k * 0.85;
        d[i + 1] = 14 + (123 - 14) * k * 0.72;
        d[i + 2] = 17 + (255 - 17) * k * 0.80;
        d[i + 3] = 255;
      }
    }
    // contour lines: wherever the band index changes
    for (let py = 1; py < H; py += 1) {
      for (let px = 1; px < W; px += 1) {
        const b = bandOf[py * W + px];
        if (b !== bandOf[py * W + px - 1] || b !== bandOf[(py - 1) * W + px]) {
          const i = (py * W + px) * 4;
          d[i] = Math.min(255, d[i] + 70);
          d[i + 1] = Math.min(255, d[i + 1] + 70);
          d[i + 2] = Math.min(255, d[i + 2] + 80);
        }
      }
    }
    ctx.putImageData(img, 0, 0);

    // --- slope arrows ---
    if (show.arrows) {
      for (let u = -7; u <= 7; u += 2) {
        for (let v = -4; v <= 4; v += 2) {
          const g = gAt(u, v);
          if (g.mag < 0.02) continue;
          const len = Math.min(26, 5 + g.mag * 7);
          const nx = g.gx / g.mag, ny = g.gy / g.mag;
          const x0 = xAt(u), y0 = yAt(v);
          const x1 = x0 + nx * len, y1 = y0 + ny * len;
          ctx.strokeStyle = 'rgba(255,194,71,0.85)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
          ctx.fillStyle = 'rgba(255,194,71,0.9)';
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x1 - nx * 6 - ny * 3.2, y1 - ny * 6 + nx * 3.2);
          ctx.lineTo(x1 - nx * 6 + ny * 3.2, y1 - ny * 6 - nx * 3.2);
          ctx.closePath(); ctx.fill();
        }
      }
    }

    // --- values at grid intersections ---
    if (show.nums) {
      ctx.font = '600 10px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let u = -8; u <= 8; u += 2) {
        for (let v = -4; v <= 4; v += 2) {
          const p = phiAt(u, v);
          const tx = xAt(u), ty = yAt(v);
          const label = (p < 0 ? '−' : '') + Math.abs(p).toFixed(1);
          const wd = ctx.measureText(label).width;
          ctx.fillStyle = 'rgba(10,10,14,0.72)';
          ctx.fillRect(tx - wd / 2 - 3, ty - 7, wd + 6, 14);
          ctx.fillStyle = 'rgba(243,246,255,0.92)';
          ctx.fillText(label, tx, ty);
        }
      }
    }

    // --- sources ---
    srcs.forEach((s, i) => {
      const x = xAt(s.x), y = yAt(s.y);
      const rad = 6 + Math.sqrt(s.M) * 1.5;
      ctx.fillStyle = s.c; ctx.shadowColor = s.c; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.2832); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(10,10,14,0.9)';
      ctx.font = '700 10px "IBM Plex Mono", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(s.M), x, y);
      void i;
    });

    // --- the inspected point ---
    const sx = xAt(sel.x), sy = yAt(sel.y);
    ctx.strokeStyle = '#54d6a0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, sy, 11, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 16, sy); ctx.lineTo(sx - 12, sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 12, sy); ctx.lineTo(sx + 16, sy); ctx.stroke();
  }

  function ledger() {
    const box = $('sum');
    if (!srcs.length) {
      box.innerHTML = '<p class="empty">No sources. The field is flat — every point reads 0.</p>';
      return;
    }
    const parts = srcs.map((s) => ({
      c: s.c, M: s.M,
      r: Math.hypot(sel.x - s.x, sel.y - s.y),
      v: phiOne(s.M, Math.hypot(sel.x - s.x, sel.y - s.y))
    }));
    const net = parts.reduce((a, p) => a + p.v, 0);
    const g = gAt(sel.x, sel.y);
    const dir = Math.round(((Math.atan2(-g.gy, g.gx) * 180 / Math.PI) + 360) % 360);

    let html = '';
    parts.forEach((p, i) => {
      html += '<div class="row"><span class="who"><i class="dot" style="background:' + p.c + '"></i>'
        + 'source ' + (i + 1) + ' &nbsp;<span style="color:var(--txt-3)">M ' + p.M + ', r ' + p.r.toFixed(1) + '</span></span>'
        + '<b>' + minus(p.v) + '</b></div>';
    });
    html += '<div class="rule"></div>';
    html += '<div class="row net"><span class="who">net Φ at this point</span><b>' + minus(net) + '</b></div>';
    html += '<div class="row grad"><span class="who">net slope |g|</span><b>' + g.mag.toFixed(2) + '</b></div>';
    html += '<div class="row grad"><span class="who" style="color:var(--txt-3)">pointing</span><b style="color:var(--txt-2)">'
      + (g.mag < 0.02 ? 'nowhere — forces cancel' : dir + '°') + '</b></div>';
    box.innerHTML = html;

    $('ro-n').textContent = srcs.length;
    $('ro-phi').textContent = minus(net);
    $('ro-g').textContent = g.mag.toFixed(2);
    $('hint').textContent = g.mag < 0.02 && srcs.length > 1
      ? 'Here the pulls cancel exactly — a saddle point. Downhill toward either mass, uphill at right angles.'
      : 'Every intersection adds up the pull of every source. Drag a source and watch the whole map re-sum.';
  }

  function render() { draw(); ledger(); }

  // ---- interaction: drag a source, click empty space to inspect ----
  let drag = -1;
  const localPt = (e) => {
    const r = cvs.getBoundingClientRect();
    return { u: uOf(e.clientX - r.left), v: vOf(e.clientY - r.top) };
  };
  cvs.addEventListener('pointerdown', (e) => {
    const { u, v } = localPt(e);
    drag = srcs.findIndex((s) => Math.hypot(s.x - u, s.y - v) < 0.9);
    if (drag >= 0) { cvs.setPointerCapture(e.pointerId); return; }
    sel = { x: Math.max(-8, Math.min(8, Math.round(u / 2) * 2)),
            y: Math.max(-4, Math.min(4, Math.round(v / 2) * 2)) };
    render();
  });
  cvs.addEventListener('pointermove', (e) => {
    if (drag < 0) return;
    const { u, v } = localPt(e);
    srcs[drag].x = Math.max(-EX + 0.5, Math.min(EX - 0.5, u));
    srcs[drag].y = Math.max(-EY + 0.5, Math.min(EY - 0.5, v));
    render();
  });
  const endDrag = () => { drag = -1; };
  cvs.addEventListener('pointerup', endDrag);
  cvs.addEventListener('pointercancel', endDrag);

  $('preset').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]'); if (!b) return;
    load(b.dataset.p);
    for (const x of $('preset').querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    sel = { x: 0, y: 0 };
    render();
  });

  $('show').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-s]'); if (!b) return;
    const k = b.dataset.s;
    show[k] = !show[k];
    b.setAttribute('aria-pressed', String(show[k]));
    render();
  });

  $('add').addEventListener('click', () => {
    const i = srcs.length;
    srcs.push({ M: 10 + ((i * 7) % 20), x: (i % 5) * 3 - 6 + 0.7, y: ((i * 3) % 7) - 3, c: PALETTE[i % PALETTE.length] });
    render();
  });
  $('clear').addEventListener('click', () => { srcs = []; render(); });

  function postHeight() {
    const hh = Math.ceil(document.querySelector('.bench').getBoundingClientRect().height);
    if (window.parent !== window && hh > 100) window.parent.postMessage({ type: 'super-height', height: hh }, '*');
  }
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fit(); render(); postHeight(); }, 140); });
  if (window.ResizeObserver) new ResizeObserver(postHeight).observe(document.querySelector('.bench'));
  window.addEventListener('load', () => { fit(); render(); postHeight(); setTimeout(postHeight, 250); });

  fit(); render(); postHeight();     // reactive only — no animation loop
})();
</script>
</body>
</html>
