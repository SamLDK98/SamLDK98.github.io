<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real Powers</title>
  <style>
    :root {
      --text: #f4f6ff;
      --muted: rgba(244, 246, 255, 0.7);
      --gold: #e0be68;
      --green: #b6ff5a;
      --axis: rgba(255, 255, 255, 0.9);
      --tick: rgba(255, 255, 255, 0.72);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--text);
      font-family: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
    }

    .widget {
      width: min(760px, 100vw);
      padding: 8px 4px 0;
      background: transparent;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .formula {
      color: var(--gold);
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      appearance: none;
      border: 1px solid rgba(182, 255, 90, 0.5);
      border-radius: 999px;
      background: rgba(182, 255, 90, 0.06);
      color: var(--text);
      padding: 0.58rem 0.9rem;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    button.active {
      border-color: var(--green);
      color: var(--green);
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .tick {
      stroke: var(--tick);
      stroke-width: 2;
    }

    .label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .bar {
      fill: none;
      stroke: var(--green);
      stroke-width: 9;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(182, 255, 90, 0.48));
      transition: x2 420ms ease;
    }

    .point {
      fill: var(--green);
      filter: drop-shadow(0 0 10px rgba(182, 255, 90, 0.74));
      transition: cx 420ms ease;
    }

    @media (max-width: 620px) {
      .top { align-items: flex-start; flex-direction: column; }
      .controls { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="widget">
    <div class="top">
      <div class="formula" id="formula">2<sup>1</sup> = 2</div>
      <div class="controls">
        <button id="baseTwo" class="active" type="button">2</button>
        <button id="baseHalf" type="button">1/2</button>
        <button id="next" type="button">Next power</button>
      </div>
    </div>
    <svg viewBox="0 0 720 170" role="img" aria-label="Successive powers on a number line">
      <line class="axis" x1="70" y1="88" x2="660" y2="88" />
      <g id="ticks"></g>
      <line id="bar" class="bar" x1="70" y1="88" x2="144" y2="88" />
      <circle id="point" class="point" cx="144" cy="88" r="8" />
    </svg>
  </main>
  <script>
    const formula = document.getElementById('formula');
    const next = document.getElementById('next');
    const baseTwo = document.getElementById('baseTwo');
    const baseHalf = document.getElementById('baseHalf');
    const ticks = document.getElementById('ticks');
    const bar = document.getElementById('bar');
    const point = document.getElementById('point');

    let base = 2;
    let n = 1;

    function valueFor() {
      return Math.pow(base, n);
    }

    function formatValue(value) {
      if (base === 2) return String(value);
      const denom = Math.pow(2, n);
      return `1/${denom}`;
    }

    function xFor(value) {
      const min = 0;
      const max = base === 2 ? 16 : 1;
      return 70 + ((value - min) / (max - min)) * 590;
    }

    function renderTicks() {
      ticks.innerHTML = '';
      const values = base === 2 ? [0, 2, 4, 8, 16] : [0, 0.25, 0.5, 0.75, 1];
      const labels = base === 2 ? ['0', '2', '4', '8', '16'] : ['0', '1/4', '1/2', '3/4', '1'];

      values.forEach((value, index) => {
        const x = xFor(value);
        ticks.insertAdjacentHTML('beforeend', `<line class="tick" x1="${x}" y1="74" x2="${x}" y2="102" />`);
        ticks.insertAdjacentHTML('beforeend', `<text class="label" x="${x}" y="132" text-anchor="middle">${labels[index]}</text>`);
      });
    }

    function render() {
      const value = valueFor();
      const x = xFor(value);
      bar.setAttribute('x2', x);
      point.setAttribute('cx', x);

      if (base === 2) {
        formula.innerHTML = `2<sup>${n}</sup> = ${value}`;
      } else {
        formula.innerHTML = `(1/2)<sup>${n}</sup> = ${formatValue(value)}`;
      }

      baseTwo.classList.toggle('active', base === 2);
      baseHalf.classList.toggle('active', base === 0.5);
      next.textContent = n >= 4 ? 'Reset' : 'Next power';
    }

    function setBase(nextBase) {
      base = nextBase;
      n = 1;
      renderTicks();
      render();
    }

    baseTwo.addEventListener('click', () => setBase(2));
    baseHalf.addEventListener('click', () => setBase(0.5));
    next.addEventListener('click', () => {
      n = n >= 4 ? 1 : n + 1;
      render();
    });

    renderTicks();
    render();
  </script>
</body>
</html>
