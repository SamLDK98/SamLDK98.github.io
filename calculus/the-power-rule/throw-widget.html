<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A stone thrown upward</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="t" type="range" min="0" max="400" step="1" value="80" aria-label="Seconds since the stone was thrown" />
</div>

<script src="../widget-base.js"></script>
<script>
  // A stone thrown straight up at 20 metres per second is 20t − 5t² metres up after t seconds.
  // The height axis doubles as the stone's path: the stone rides up and down it, with a coral
  // arrow for its upward speed, 20 − 10t, and that number beside it. To the right, the height
  // graph, with the same speed as the slope of its coral tangent. The slider is the time (lilac).
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("t");
  const H = 256, TMAX = 4, YMAX = 21, ARROW = 2.6;   // ARROW: pixels per metre per second
  const IN = "#a99cff", OUT = "#ff8c69", INK = "#ebe8e1", AX = "rgba(235,232,225,0.22)";
  const y = (t) => 20 * t - 5 * t * t, v = (t) => 20 - 10 * t;

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }
  const num = (n) => (Math.abs(n) < 5e-9 ? "0" : (+n.toFixed(2) + "").replace("-", "−"));

  function render() {
    const t = +slider.value / 100;
    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const L = 50, R = 14, T = 14, base = H - 60;   // room below for the arrow at full speed down
    const sx = (s) => L + (s / TMAX) * (W - L - R);
    const sy = (m) => base - (m / YMAX) * (base - T);

    const clip = el("clipPath", { id: "plot" }, undefined, el("defs", {}));
    el("rect", { x: L, y: T - 6, width: W - L - R, height: base - T + 6 }, undefined, clip);

    // time axis with a faint tick each second, and the height axis, which is the stone's path
    el("line", { x1: L, x2: W - R, y1: base, y2: base, stroke: AX, "stroke-width": 1.2 });
    for (let s = 1; s <= TMAX; s++) el("line", { x1: sx(s), x2: sx(s), y1: base - 3, y2: base + 3, stroke: AX, "stroke-width": 1.2 });
    el("line", { x1: L, x2: L, y1: T - 6, y2: base, stroke: AX, "stroke-width": 1.2 });

    // the height graph, quiet, with the tangent at t
    let d = "";
    for (let i = 0; i <= 200; i++) { const s = (TMAX * i) / 200; d += (i ? "L" : "M") + sx(s).toFixed(1) + " " + sy(y(s)).toFixed(1); }
    el("path", { d, fill: "none", stroke: INK, "stroke-opacity": 0.4, "stroke-width": 1.4 });
    const dt = 0.55, px = sx(t), py = sy(y(t));
    el("line", { x1: sx(t - dt), y1: sy(y(t) - v(t) * dt), x2: sx(t + dt), y2: sy(y(t) + v(t) * dt),
                 stroke: OUT, "stroke-opacity": 0.7, "stroke-width": 1.3, "clip-path": "url(#plot)" });
    el("line", { x1: L, x2: px, y1: py, y2: py, stroke: INK, "stroke-opacity": 0.28, "stroke-dasharray": "2 4" });
    el("circle", { cx: px, cy: py, r: 3, fill: INK, "fill-opacity": 0.8 });

    // lilac: the time
    el("line", { x1: px, x2: px, y1: base - 5, y2: base + 5, stroke: IN, "stroke-width": 2 });
    el("text", { x: px, y: base + 19, "text-anchor": "middle", class: "in" }, num(t));

    // the stone on its path, and its upward speed as an arrow along it
    const sp = v(t), len = sp * ARROW, tip = py - len;
    if (Math.abs(len) > 4) {
      const dir = Math.sign(len);
      el("line", { x1: L, x2: L, y1: py - dir * 8, y2: tip + dir * 6, stroke: OUT, "stroke-width": 3.2, "stroke-linecap": "round" });
      el("path", { d: `M${L - 5.5} ${tip + dir * 8} L${L} ${tip} L${L + 5.5} ${tip + dir * 8} Z`, fill: OUT });
    }
    el("circle", { cx: L, cy: py, r: 7, fill: INK });
    el("text", { x: L - 13, y: (Math.abs(len) > 4 ? (py + tip) / 2 : py) + 4, "text-anchor": "end", class: "out" }, num(sp));

    svg.setAttribute("aria-label", `After ${num(t)} seconds the stone is ${num(y(t))} metres up, with an upward speed of ${num(sp)} metres per second: the slope of the height graph there.`);
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
