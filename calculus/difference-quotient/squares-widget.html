<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two squares and what lies between them</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="h" type="range" min="0" max="100" step="1" value="50" aria-label="How much each side grows, h" />
</div>

<script src="../widget-base.js"></script>
<script>
  // The square of side x + h, with the square of side x in its corner. What is left between them
  // is (x + h)² − x²: two coral strips, each x by h, and a faint corner, h by h. Each piece is
  // labelled with its term, outside the piece so the labels read at any h. x is drawn as 2.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("h");
  const X = 2, HMIN = 0.2, HMAX = 1;
  const OUT = "#ff8c69", INK = "#ebe8e1";

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function render() {
    const h = HMIN + (HMAX - HMIN) * slider.value / 100;
    const W = svg.clientWidth || 560;
    const LAB = 28, u = Math.min(70, (W - 16 - LAB) / (X + HMAX));
    const L = Math.round((W - (X + HMAX) * u - LAB) / 2), base = 22 + (X + HMAX) * u, H = base + 26;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const s = X * u, t = h * u;

    el("rect", { x: L, y: base - s, width: s, height: s, fill: INK, "fill-opacity": 0.05, stroke: INK, "stroke-opacity": 0.7, "stroke-width": 1.4 });
    el("rect", { x: L + s, y: base - s, width: t, height: s, fill: OUT, "fill-opacity": 0.4, stroke: OUT, "stroke-width": 1 });
    el("rect", { x: L, y: base - s - t, width: s, height: t, fill: OUT, "fill-opacity": 0.4, stroke: OUT, "stroke-width": 1 });
    el("rect", { x: L + s, y: base - s - t, width: t, height: t, fill: INK, "fill-opacity": 0.2, stroke: INK, "stroke-opacity": 0.5, "stroke-width": 1 });

    el("text", { x: L + s / 2, y: base - s / 2 + 4, "text-anchor": "middle" }, "x²");
    el("text", { x: L + s + t + 7, y: base - s / 2 + 4, class: "out" }, "xh");
    el("text", { x: L + s / 2, y: base - s - t - 7, "text-anchor": "middle", class: "out" }, "xh");
    el("text", { x: L + s + t + 7, y: base - s - t / 2 + 4 }, "h²");
    el("text", { x: L + s / 2, y: base + 17, "text-anchor": "middle", class: "in" }, "x");
    el("text", { x: L + s + t / 2, y: base + 17, "text-anchor": "middle", class: "in" }, "h");

    svg.setAttribute("aria-label", `A square of side x + h, with h = ${h.toFixed(2)}, and inside its corner the square of side x. What lies between them is two strips, each x by h, and a corner, h by h: 2xh + h squared.`);
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
