<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The rise for a run of 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
</head>
<body>
<div class="widget">
  <svg id="fig" role="img"></svg>
  <input id="h" type="range" min="0" max="75" step="1" value="60" aria-label="The horizontal separation h between the two points" />
</div>

<script src="../widget-base.js"></script>
<script>
  // Points on y = x² at 2 and 2 + h, and the straight line through them carried on to a run of 1.
  // The small triangle and the run-1 triangle have the same shape, so dividing by h turns one into
  // the other. Each rise is split the same way: coral for the 4h that becomes 4, faint for the h²
  // that becomes h. At h = 0 there is one point, no line, and only 0 ÷ 0.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const slider = document.getElementById("h");
  const X = 2, XMAX = 3.6, YMAX = 10, H = 240;
  const IN = "#a99cff", OUT = "#ff8c69", INK = "#ebe8e1";

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function render() {
    const h = slider.value / 100;
    const W = svg.clientWidth || 560;
    const pw = Math.min(W - 66, 340), L = Math.round((W - pw) / 2) + 26, T = 12, base = H - 30;
    const px = x => L + x / XMAX * pw, py = y => base - y / YMAX * (base - T);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";

    el("line", { x1: L - 6, x2: L + pw, y1: base, y2: base, stroke: INK, "stroke-opacity": 0.16 });
    el("line", { x1: L, x2: L, y1: T, y2: base + 6, stroke: INK, "stroke-opacity": 0.16 });
    let d = "";
    for (let i = 0; i <= 80; i++) { const x = Math.sqrt(YMAX) * i / 80; d += (i ? "L" : "M") + px(x).toFixed(1) + " " + py(x * x).toFixed(1); }
    el("path", { d, fill: "none", stroke: INK, "stroke-opacity": 0.7, "stroke-width": 1.6 });
    for (const x of [X, X + 1]) {
      el("line", { x1: px(x), x2: px(x), y1: base - 4, y2: base + 4, stroke: INK, "stroke-opacity": 0.35 });
      el("text", { x: px(x), y: base + 18, "text-anchor": "middle" }, String(x));
    }

    const y0 = X * X;
    if (h === 0) {
      el("circle", { cx: px(X), cy: py(y0), r: 4.5, fill: INK });
      el("text", { x: px(X) + 12, y: py(y0) + 4, class: "out" }, "0 ÷ 0");
      svg.setAttribute("aria-label", "With h = 0 the two points on y = x squared are one point, at 2. There is no run, no line through two points, and the quotient is 0 divided by 0.");
      return;
    }
    const m = 2 * X + h, x2 = X + h;
    el("line", { x1: px(X - 0.3), x2: px(X + 1.08), y1: py(y0 - 0.3 * m), y2: py(y0 + 1.08 * m), stroke: INK, "stroke-opacity": 0.45, "stroke-width": 1.2 });

    // the run-1 triangle, then the small one on top of it
    el("line", { x1: px(X), x2: px(X + 1), y1: py(y0), y2: py(y0), stroke: IN, "stroke-opacity": 0.55, "stroke-width": 1.4 });
    el("line", { x1: px(X + 1), x2: px(X + 1), y1: py(y0), y2: py(y0 + 2 * X), stroke: OUT, "stroke-width": 3 });
    el("line", { x1: px(X + 1), x2: px(X + 1), y1: py(y0 + 2 * X), y2: py(y0 + m), stroke: INK, "stroke-opacity": 0.75, "stroke-width": 3 });
    el("line", { x1: px(X), x2: px(x2), y1: py(y0), y2: py(y0), stroke: IN, "stroke-width": 2.2 });
    el("line", { x1: px(x2), x2: px(x2), y1: py(y0), y2: py(y0 + 2 * X * h), stroke: OUT, "stroke-width": 2.2 });
    el("line", { x1: px(x2), x2: px(x2), y1: py(y0 + 2 * X * h), y2: py(x2 * x2), stroke: INK, "stroke-opacity": 0.75, "stroke-width": 2.2 });
    el("circle", { cx: px(X), cy: py(y0), r: 4.5, fill: INK });
    el("circle", { cx: px(x2), cy: py(x2 * x2), r: 4.5, fill: INK });

    el("text", { x: (px(X) + px(x2)) / 2, y: py(y0) + 16, "text-anchor": "middle", class: "in" }, "h");
    el("text", { x: px(X + 1) + 9, y: py(y0 + X) + 4, class: "out" }, "4");
    el("text", { x: px(X + 1) + 9, y: py(y0 + 2 * X + h / 2) + 4 }, "h");

    svg.setAttribute("aria-label", `Points on y = x squared at 2 and 2 + h, with h = ${h.toFixed(2)}. The line through them, carried on to a run of 1, rises ${m.toFixed(2)}: 4, plus h.`);
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
