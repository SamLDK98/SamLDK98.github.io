<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One-dimensional position</title>
  <style>
    :root {
      --bg: #17130f;
      --panel: #221d19;
      --rule: rgba(214, 190, 154, 0.22);
      --text: #efe7d8;
      --muted: #a89980;
      --accent: #e8a13b;
      --teal: #6dd3c4;
      --salmon: #ef7398;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Fraunces", Georgia, serif;
    }

    .dimension-widget {
      width: min(760px, calc(100vw - 24px));
      padding: 1.35rem clamp(1rem, 4vw, 2.2rem) 1.55rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: inset 0 1px 0 rgba(255, 244, 220, 0.05), 0 18px 54px rgba(0, 0, 0, 0.24);
    }

    .track-wrap {
      position: relative;
      height: 170px;
      display: grid;
      align-items: center;
      padding: 0 1.25rem;
    }

    .track {
      position: relative;
      height: 7px;
      border-radius: 999px;
      background: #f0ddba;
      box-shadow: 0 0 18px rgba(240, 221, 186, 0.18);
    }

    .track::before,
    .track::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1px solid rgba(239, 231, 216, 0.58);
      transform: translateY(-50%);
    }

    .track::before {
      left: -2px;
    }

    .track::after {
      right: -2px;
    }

    .center-notch {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 44px;
      border-radius: 999px;
      background: rgba(239, 231, 216, 0.68);
      transform: translate(-50%, -50%);
    }

    .center-label {
      position: absolute;
      left: 50%;
      top: calc(50% + 36px);
      color: var(--muted);
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    .hat {
      position: absolute;
      left: var(--hat-x, 50%);
      top: 50%;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 999px;
      background:
        radial-gradient(circle at 42% 36%, rgba(255, 226, 216, 0.62), transparent 0 12%, rgba(255, 226, 216, 0.18) 13%, transparent 28%),
        radial-gradient(circle, #f08ca8 0 39%, #d7567c 40% 54%, #7f273d 55% 60%, transparent 61%);
      box-shadow: 0 0 0 1px rgba(255, 213, 220, 0.5), 0 0 22px rgba(239, 115, 152, 0.2);
      cursor: grab;
      transform: translate(-50%, -50%);
      touch-action: none;
    }

    .hat::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px solid rgba(65, 24, 34, 0.34);
      border-radius: 999px;
      box-shadow: inset 0 0 10px rgba(255, 240, 232, 0.18);
    }

    .hat:active {
      cursor: grabbing;
    }

    .readout {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .readout strong {
      color: var(--text);
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.35rem, 4vw, 2.05rem);
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }

    @media (max-width: 560px) {
      .dimension-widget {
        padding: 1rem 0.8rem 1.2rem;
      }

      .track-wrap {
        height: 145px;
        padding: 0 0.75rem;
      }

      .hat {
        width: 50px;
        height: 50px;
      }

      .readout {
        flex-direction: column;
        gap: 0.35rem;
      }
    }
  </style>
</head>
<body>
  <main class="dimension-widget" aria-label="One-dimensional movement widget">
    <div class="track-wrap">
      <div class="track" id="track">
        <span class="center-notch" aria-hidden="true"></span>
        <span class="center-label">middle</span>
        <button class="hat" id="hat" type="button" aria-label="Move the cowboy hat left or right"></button>
      </div>
    </div>
    <div class="readout" aria-live="polite">
      <span>Position</span>
      <strong id="positionText">middle</strong>
    </div>
  </main>

  <script>
    const track = document.getElementById('track');
    const hat = document.getElementById('hat');
    const positionText = document.getElementById('positionText');

    let position = 0;
    let dragging = false;

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    function render() {
      const percent = ((position + 1) / 2) * 100;
      track.style.setProperty('--hat-x', `${percent}%`);

      const amount = Math.round(Math.abs(position) * 100);
      if (amount < 2) {
        positionText.textContent = 'middle';
      } else {
        positionText.textContent = `${amount}% ${position < 0 ? 'left' : 'right'}`;
      }
    }

    function setFromClientX(clientX) {
      const rect = track.getBoundingClientRect();
      const normalized = ((clientX - rect.left) / rect.width) * 2 - 1;
      position = clamp(normalized, -1, 1);
      render();
    }

    hat.addEventListener('pointerdown', (event) => {
      dragging = true;
      hat.setPointerCapture(event.pointerId);
      setFromClientX(event.clientX);
    });

    hat.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      setFromClientX(event.clientX);
    });

    hat.addEventListener('pointerup', () => {
      dragging = false;
    });

    track.addEventListener('pointerdown', (event) => {
      setFromClientX(event.clientX);
    });

    hat.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      position = clamp(position + (event.key === 'ArrowRight' ? 0.05 : -0.05), -1, 1);
      render();
    });

    render();
  </script>
</body>
</html>
