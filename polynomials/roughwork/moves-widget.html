<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>How −2x moves each output</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  svg { display: block; width: 100%; overflow: visible; margin-top: 0.6rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--dim); }
  svg text.amt { font-size: 14px; font-weight: 500; fill: var(--const); }
  .old, .move, .new { transition: opacity 0.4s; }
  .trace { fill: none; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s ease-in-out; }
  svg.old-mode .move, svg.old-mode .new { opacity: 0.22; }
  svg.old-mode .trace.old { stroke-dashoffset: 0; }
  svg.new-mode .old { opacity: 0.22; }
  svg.new-mode .trace.new { stroke-dashoffset: 0; }
</style>
</head>
<body>
<div class="widget">
  <div class="choices" role="group" aria-label="What to show">
    <button aria-pressed="true">the moves</button>
    <button aria-pressed="false">trace <span class="v">x</span>²</button>
    <button aria-pressed="false">trace <span class="v">x</span>² − 2<span class="v">x</span></button>
  </div>
  <svg id="fig" role="img"></svg>
</div>

<script src="../widget-base.js"></script>
<script>
  // The outputs of x² (grey) at the inputs −3 to 4, each moved by −2x to give x² − 2x (amber): up on
  // the left, down on the right, by 2 less each step. The buttons trace either parabola through its dots
  // and fade the other set, so the moved dots can be seen landing on a new parabola.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const IN = [-3, -2, -1, 0, 1, 2, 3, 4];
  const MODES = ["", "old-mode", "new-mode"];
  const GREY = "#8d909a", AMBER = "#e8a33d";
  const PAD = 12, H = 320, XR = [-3.6, 4.6], YR = [-2, 18.5];
  const fmt = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
  let mode = 0;

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function curve(b, sx, sy) {
    let d = "";
    for (let i = 0; i <= 160; i++) {
      const x = -3.25 + (7.5 * i) / 160;
      d += (i ? "L" : "M") + sx(x).toFixed(1) + " " + sy(x * x - b * x).toFixed(1);
    }
    return d;
  }

  function render() {
    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const sx = (x) => PAD + ((x - XR[0]) / (XR[1] - XR[0])) * (W - 2 * PAD);
    const sy = (y) => H - 26 - ((y - YR[0]) / (YR[1] - YR[0])) * (H - 34);
    const narrow = W < 420, r = narrow ? 6 : 7.5, gap = narrow ? 9 : 14;

    el("line", { x1: sx(0), x2: sx(0), y1: 4, y2: H - 24, stroke: "rgba(238,242,252,0.3)", "stroke-dasharray": "4 5" });
    el("path", { d: curve(0, sx, sy), class: "trace old", pathLength: 1, stroke: GREY, "stroke-width": 2 });
    el("path", { d: curve(2, sx, sy), class: "trace new", pathLength: 1, stroke: AMBER, "stroke-width": 2 });

    IN.forEach((x) => {
      const px = sx(x), y0 = sy(x * x), y1 = sy(x * x - 2 * x), up = y1 < y0;
      el("text", { x: px, y: H - 4, "text-anchor": "middle" }, String(x).replace("-", "−"));
      el("circle", { cx: px, cy: y0, r: r * 0.8, fill: GREY, class: "old" });
      if (x !== 0) {
        const s = up ? 1 : -1, tip = y1 + s * (r + 1), base = tip + s * 11;
        el("line", { x1: px, x2: px, y1: y0, y2: base, stroke: AMBER, "stroke-width": 3, class: "move" });
        el("path", { d: `M${px - 6} ${base} L${px + 6} ${base} L${px} ${tip} Z`, fill: AMBER, class: "move" });
      }
      // labels sit left of their arrow, where the new curve never runs; 0 and 1 go right, clear of the dot at 0
      const left = x !== 0 && x !== 1;
      el("text", { x: px + (left ? -gap : gap), y: (x === 0 || x === 1 ? y1 : (y0 + y1) / 2) + 5, "text-anchor": left ? "end" : "start", class: "amt move", style: narrow ? "font-size: 12px" : "" }, fmt(-2 * x));
      el("circle", { cx: px, cy: y1, r, fill: AMBER, class: "new" });
    });
    show();
  }

  // Switching mode only changes the svg's class, so the CSS transitions fade the dots and draw the trace.
  function show() {
    svg.setAttribute("class", MODES[mode]);
    svg.setAttribute("aria-label", [
      "Each output of x squared, at the inputs −3 to 4, moved by −2x: +6, +4, +2, 0, −2, −4, −6, −8.",
      "The original parabola, x squared, traced through the grey outputs.",
      "The moved outputs joined up: they trace a new parabola, x squared minus 2x, turning at x = 1."][mode]);
  }

  const buttons = document.querySelectorAll(".choices button");
  buttons.forEach((b, i) => b.addEventListener("click", () => {
    buttons.forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    mode = i;
    show();
  }));
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
