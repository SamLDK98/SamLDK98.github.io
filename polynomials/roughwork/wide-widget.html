<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Any linear term</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  .expr { text-align: center; white-space: nowrap; font-size: clamp(1.2rem, 5.2vw, 1.6rem); color: var(--txt); }
  svg { display: block; width: 100%; overflow: visible; margin: 0.4rem 0 0.5rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--dim); }
</style>
</head>
<body>
<div class="widget">
  <div class="expr" id="expr" aria-hidden="true"></div>
  <svg id="fig" role="img"></svg>
  <input id="b" type="range" min="-4" max="4" step="0.1" value="0" aria-label="The linear term's coefficient" />
</div>

<script src="../widget-base.js"></script>
<script>
  // The dense widget with wider axes and a free linear term: the slider sets b from −4 to 4 and the amber
  // lines run from each blue x² dot to x² + bx. The bigger b is either way, the further the lowest point
  // sinks (to −b²/4) and the further it moves from the y-axis (to x = −b/2). Lines that run past the top
  // of the plot are cut off there.
  const slider = document.getElementById("b");
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const IN = Array.from({ length: 33 }, (_, i) => -4 + i / 4);
  const BLUE = "#7aa7ff", AMBER = "#e8a33d", RED = "#ff5d5d";
  const PAD = 12, H = 340, XR = [-4.4, 4.4], YR = [-5.5, 17];
  const fmt = (n) => String(+Math.abs(n).toFixed(2));

  function el(name, attrs, parent = svg) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function render() {
    const b = Math.round(+slider.value * 10) / 10;
    document.getElementById("expr").innerHTML = b === 0 ? `<span class="v">x</span>²`
      : `<span class="v">x</span>² ${b < 0 ? "−" : "+"} <span class="k-const">${Math.abs(b) === 1 ? "" : fmt(b)}</span><span class="v k-const">x</span>`;
    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const sx = (x) => PAD + ((x - XR[0]) / (XR[1] - XR[0])) * (W - 2 * PAD);
    const sy = (y) => H - 20 - ((y - YR[0]) / (YR[1] - YR[0])) * (H - 26);
    const narrow = W < 420, r = narrow ? 2.4 : 3.2;

    const clip = el("clipPath", { id: "plot" }, el("defs", {}));
    el("rect", { x: 0, y: 0, width: W, height: H }, clip);
    el("line", { x1: PAD, x2: W - PAD, y1: sy(0), y2: sy(0), stroke: "rgba(238,242,252,0.5)", "stroke-width": 1.5 });
    el("line", { x1: sx(0), x2: sx(0), y1: 2, y2: H - 18, stroke: "rgba(238,242,252,0.5)", "stroke-width": 1.5 });
    for (let v = -4; v <= 16; v += 4) {
      if (!v) continue;
      el("line", { x1: sx(0) - 4, x2: sx(0) + 4, y1: sy(v), y2: sy(v), stroke: "rgba(238,242,252,0.5)" });
      const t = el("text", { x: sx(0) - 7, y: sy(v) + 3.5, "text-anchor": "end" });
      t.textContent = (v < 0 ? "−" : "") + Math.abs(v);
    }
    for (let v = -4; v <= 4; v += 2) {
      if (!v) continue;
      el("line", { x1: sx(v), x2: sx(v), y1: sy(0) - 4, y2: sy(0) + 4, stroke: "rgba(238,242,252,0.5)" });
      const t = el("text", { x: sx(v), y: H - 3, "text-anchor": "middle" });
      t.textContent = (v < 0 ? "−" : "") + Math.abs(v);
    }

    const g = el("g", { "clip-path": "url(#plot)" });
    IN.forEach((x) => {
      const px = sx(x);
      el("line", { x1: px, x2: px, y1: sy(0), y2: sy(x * x), stroke: BLUE, "stroke-width": narrow ? 1.5 : 2, opacity: b ? 0.45 : 0.8 }, g);
    });
    IN.forEach((x) => {
      const px = sx(x), y0 = sy(x * x), y1 = sy(x * x + b * x);
      el("circle", { cx: px, cy: y0, r: r * 0.85, fill: BLUE }, g);
      if (b && x) {
        el("line", { x1: px, x2: px, y1: y0, y2: y1, stroke: AMBER, "stroke-width": narrow ? 2 : 2.5 }, g);
        el("circle", { cx: px, cy: y1, r, fill: AMBER }, g);
      }
    });
    // the vertex, (−b/2, −b²/4), in red; it lies between the stems unless b/2 is a quarter
    el("circle", { cx: sx(-b / 2), cy: sy(-(b * b) / 4), r: r * 1.15, fill: RED }, g);
    const lo = -(b * b) / 4;
    svg.setAttribute("aria-label", b === 0
      ? "The outputs of x squared for inputs from −4 to 4, as blue stems rising from the x-axis; the lowest point is 0, at x = 0."
      : `Adding ${b < 0 ? "−" : ""}${fmt(b)}x: amber lines run from each blue output to x squared ${b < 0 ? "minus" : "plus"} ${fmt(b)}x, whose lowest point is ${fmt(lo) === "0" ? "0" : "−" + fmt(lo)} at x = ${fmt(-b / 2) === "0" ? "0" : (b > 0 ? "−" : "") + fmt(b / 2)}.`);
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
