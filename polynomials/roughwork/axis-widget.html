<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>x² and −2x from the x-axis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  svg { display: block; width: 100%; overflow: visible; margin-top: 0.6rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--dim); }
  svg text.amt { font-size: 14px; font-weight: 500; fill: var(--const); }
  svg text.amt.g { fill: #b9bcc6; }
  .sq, .sqlab, .old, .move, .new, .step { transition: opacity 0.4s; }
  /* x²: grey arrows from the axis.  add −2x: the moves on top.  step by step: each step's two changes. */
  svg.m0 .move, svg.m0 .new, svg.m0 .step { opacity: 0; }
  svg.m1 .sq { opacity: 0.3; }
  svg.m1 .sqlab, svg.m1 .step { opacity: 0; }
  svg.m2 .sq, svg.m2 .sqlab, svg.m2 .move { opacity: 0; }
  svg.m2 .old { opacity: 0.2; }
</style>
</head>
<body>
<div class="widget">
  <div class="choices" role="group" aria-label="What to show">
    <button aria-pressed="true"><span class="v">x</span>²</button>
    <button aria-pressed="false">add −2<span class="v">x</span></button>
    <button aria-pressed="false">step by step</button>
  </div>
  <svg id="fig" role="img"></svg>
</div>

<script src="../widget-base.js"></script>
<script>
  // The same inputs, dots and arrows as the moves widget, now measured from the x-axis. Grey arrows rise
  // from the axis to each output of x²; the amber −2x moves then go on from there, as before. Step by step
  // shows each step right as two changes: x² changes by 2x + 1 (−5, −3, −1, +1, +3, …) and −2x by −2 every
  // time. While x²'s change is below 2 the amber dots fall; from 1 to 2 it is +3, so they rise from there.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const IN = [-3, -2, -1, 0, 1, 2, 3, 4];
  const GREY = "#8d909a", AMBER = "#e8a33d";
  const PAD = 12, PB = 294, H = 362, XR = [-3.6, 4.6], YR = [-2, 18.5];
  const fmt = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
  const f = (x) => x * x - 2 * x;
  let mode = 0;

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  // a vertical arrow at x = px from y = ya with its tip at y = yb
  function arrow(px, ya, yb, col, w, head, cls) {
    const s = yb < ya ? 1 : -1, len = Math.abs(yb - ya), h = Math.min(head, len * 0.6), base = yb + s * h;
    el("line", { x1: px, x2: px, y1: ya, y2: base, stroke: col, "stroke-width": w, class: cls });
    el("path", { d: `M${px - h * 0.55} ${base} L${px + h * 0.55} ${base} L${px} ${yb} Z`, fill: col, class: cls });
  }

  function render() {
    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const sx = (x) => PAD + ((x - XR[0]) / (XR[1] - XR[0])) * (W - 2 * PAD);
    const sy = (y) => PB - ((y - YR[0]) / (YR[1] - YR[0])) * (PB - 8);
    const narrow = W < 420, r = narrow ? 6 : 7.5, gap = narrow ? 9 : 14, small = narrow ? "font-size: 12px" : "";

    el("line", { x1: sx(0), x2: sx(0), y1: 4, y2: PB + 2, stroke: "rgba(238,242,252,0.3)", "stroke-dasharray": "4 5" });
    el("line", { x1: PAD, x2: W - PAD, y1: sy(0), y2: sy(0), stroke: "rgba(238,242,252,0.5)", "stroke-width": 1.5 });

    IN.forEach((x) => {
      const px = sx(x), y0 = sy(x * x), y1 = sy(f(x)), up = y1 < y0;
      el("text", { x: px, y: PB + 20, "text-anchor": "middle" }, String(x).replace("-", "−"));
      if (x !== 0) arrow(px, sy(0), y0 + r * 0.8 + 1, GREY, 3, 11, "sq");
      el("text", { x: px, y: y0 - r - 7, "text-anchor": "middle", class: "amt g sqlab", style: small }, String(x * x));
      el("circle", { cx: px, cy: y0, r: r * 0.8, fill: GREY, class: "old" });
      if (x !== 0) arrow(px, y0, y1 + (up ? 1 : -1) * (r + 1), AMBER, 3, 11, "move");
      const left = x !== 0 && x !== 1;
      el("text", { x: px + (left ? -gap : gap), y: (x === 0 || x === 1 ? y1 : (y0 + y1) / 2) + 5, "text-anchor": left ? "end" : "start", class: "amt move", style: small }, fmt(-2 * x));
      el("circle", { cx: px, cy: y1, r, fill: AMBER, class: "new" });
    });

    // each step right, drawn halfway between the inputs: x²'s change (grey), then −2x's change (amber)
    for (let x = IN[0]; x < IN[IN.length - 1]; x++) {
      const m = sx(x + 0.5), d = narrow ? 3.5 : 5, a = sy(f(x)), b = sy(f(x) + 2 * x + 1), c = sy(f(x + 1));
      const link = { stroke: "rgba(238,242,252,0.28)", "stroke-dasharray": "2 3", class: "step" };
      el("line", { x1: sx(x) + r, x2: m - d, y1: a, y2: a, ...link });
      el("line", { x1: m - d, x2: m + d, y1: b, y2: b, ...link });
      el("line", { x1: m + d, x2: sx(x + 1) - r, y1: c, y2: c, ...link });
      arrow(m - d, a, b, GREY, 2.5, 8, "step");
      arrow(m + d, b, c, AMBER, 2.5, 8, "step");
      el("text", { x: m, y: PB + 44, "text-anchor": "middle", class: "amt g step", style: small }, fmt(2 * x + 1));
      el("text", { x: m, y: PB + 62, "text-anchor": "middle", class: "amt step", style: small }, "−2");
    }
    show();
  }

  // Switching mode only changes the svg's class, so the CSS transitions do the fading.
  function show() {
    svg.setAttribute("class", "m" + mode);
    svg.setAttribute("aria-label", [
      "The x-axis, with a grey arrow rising from it to each output of x squared at the inputs −3 to 4: 9, 4, 1, 0, 1, 4, 9, 16.",
      "Each output of x squared then moved by −2x: +6, +4, +2, 0, −2, −4, −6, −8, giving 15, 8, 3, 0, −1, 0, 3, 8. The output at 1 goes below the axis.",
      "Each step right, x squared changes by −5, −3, −1, +1, +3, +5, +7 and −2x by −2 every time. Until x squared's change is more than 2 the outputs fall; from 1 to 2 it is +3, so they rise from there."][mode]);
  }

  const buttons = document.querySelectorAll(".choices button");
  buttons.forEach((b, i) => b.addEventListener("click", () => {
    buttons.forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    mode = i;
    show();
  }));
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
