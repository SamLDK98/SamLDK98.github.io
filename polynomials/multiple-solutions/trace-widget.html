<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Testing one number at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  .expr {
    text-align: center; white-space: nowrap;
    font-size: clamp(1.25rem, 5.4vw, 1.8rem); color: var(--txt);
    margin-bottom: 0.5rem;
  }
  .expr .res { display: inline-block; min-width: 3.2ch; text-align: left; transition: color 0.25s ease, text-shadow 0.25s ease; }
  .expr .res.hit { color: var(--const); text-shadow: 0 0 14px var(--glow); }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--dim); }
  svg .tick.hit { fill: var(--const); }
  svg .target-label { fill: var(--const); }
</style>
</head>
<body>
<div class="widget">
  <div class="expr" id="expr" aria-live="polite"></div>
  <svg id="plot" aria-hidden="true"></svg>
  <input id="x" type="range" aria-label="Value of x" />
</div>

<script src="../widget-base.js"></script>
<script>
  // Two equations share this widget: ?eq=linear is x + x = 10, otherwise x² − 5x = −6.
  // Values are kept in exact integer units (tenths of x, hundredths of the output)
  // so that 2, 3 and 5 register as exact hits.
  const LINEAR = new URLSearchParams(location.search).get("eq") === "linear";
  const EQ = LINEAR
    ? { min: 0, max: 7, start: 1.5, roots: [5], ymin: 0, ymax: 14.5, target: 10,
        out: (t) => 20 * t,                // (x + x) in hundredths, from x in tenths
        expr: (x, r) => `<span class="k-lin">${x} + ${x}</span> = ${r}` }
    : { min: -1, max: 6, start: 0, roots: [2, 3], ymin: -7.2, ymax: 6.5, target: -6,
        out: (t) => t * t - 50 * t,        // (x² − 5x) in hundredths
        expr: (x, r) => `<span class="k-sq">${par(x)}²</span> − <span class="k-lin">5(${x})</span> = ${r}` };

  const fmt = (n) => (n < 0 ? "−" : "") + String(+Math.abs(n).toFixed(2));
  function par(s) { return s[0] === "−" ? "(" + s + ")" : s; }

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("plot");
  const slider = document.getElementById("x");
  const exprEl = document.getElementById("expr");
  slider.min = EQ.min; slider.max = EQ.max; slider.step = 0.1; slider.value = EQ.start;

  const H = 210, TOP = 8, BOT = H - 22, PAD = 7.5;      // PAD lines the plot up with the slider thumb
  const target100 = EQ.target * 100;
  let lo = +EQ.start, hi = +EQ.start;                   // the stretch of x explored so far

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  function render() {
    const t = Math.round(+slider.value * 10), x = t / 10;
    const v100 = EQ.out(t), hit = v100 === target100;
    lo = Math.min(lo, x); hi = Math.max(hi, x);
    const found = EQ.roots.filter((r) => r >= lo && r <= hi);   // crossings the trace has swept over

    exprEl.innerHTML = EQ.expr(fmt(x), `<span class="res${hit ? " hit" : ""}">${fmt(v100 / 100)}</span>`);

    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    svg.textContent = "";
    const sx = (u) => PAD + ((u - EQ.min) / (EQ.max - EQ.min)) * (W - 2 * PAD);
    const sy = (y) => TOP + ((EQ.ymax - y) / (EQ.ymax - EQ.ymin)) * (BOT - TOP);
    const curve = (a, b) => {
      let d = "";
      for (let i = 0; i <= 140; i++) {
        const u = a + ((b - a) * i) / 140;
        d += (i ? "L" : "M") + sx(u).toFixed(1) + " " + sy(EQ.out(u * 10) / 100).toFixed(1);
      }
      return d;
    };

    if (!LINEAR) el("line", { x1: PAD, x2: W - PAD, y1: sy(0), y2: sy(0), stroke: "rgba(238,242,252,0.12)" });
    el("line", { x1: PAD, x2: W - PAD, y1: sy(EQ.target), y2: sy(EQ.target),
                 stroke: "rgba(232,163,61,0.55)", "stroke-dasharray": "4 5" });
    el("text", { x: PAD, y: sy(EQ.target) - 6, class: "target-label" }).textContent = fmt(EQ.target);

    el("path", { d: curve(EQ.min, EQ.max), fill: "none", stroke: "rgba(238,242,252,0.13)", "stroke-width": 1.5 });
    el("path", { d: curve(lo, hi), fill: "none", stroke: "rgba(238,242,252,0.7)", "stroke-width": 1.8, "stroke-linecap": "round" });

    for (let u = Math.ceil(EQ.min); u <= EQ.max; u++) {
      const isHit = found.includes(u);
      el("text", { x: sx(u), y: H - 4, "text-anchor": "middle", class: "tick" + (isHit ? " hit" : "") }).textContent = fmt(u);
    }

    found.forEach((r) => el("circle", { cx: sx(r), cy: sy(EQ.target), r: 7, fill: "none", stroke: "#e8a33d", "stroke-width": 1.3 }));

    const px = sx(x), py = sy(v100 / 100);
    el("line", { x1: px, x2: px, y1: py, y2: BOT + 4, stroke: "rgba(238,242,252,0.16)" });
    el("circle", { cx: px, cy: py, r: 4.5, fill: hit ? "#e8a33d" : "#f4f6ff",
                   style: `filter: drop-shadow(0 0 5px ${hit ? "rgba(232,163,61,0.8)" : "rgba(244,246,255,0.45)"})` });
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
