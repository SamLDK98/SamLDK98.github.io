<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The leftover rectangle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 380px; margin: 0 auto; }
  .expr {
    text-align: center; white-space: nowrap;
    font-size: clamp(1.25rem, 5.4vw, 1.7rem); color: var(--txt);
    margin-bottom: 0.7rem;
  }
  .expr .res { display: inline-block; min-width: 3ch; text-align: left; transition: color 0.25s ease, text-shadow 0.25s ease; }
  .expr .res.hit { color: var(--const); text-shadow: 0 0 14px var(--glow); }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; }
  svg .area { font-family: "Spectral", Georgia, serif; font-size: 26px; fill: var(--const); }
  svg .area.hit { filter: drop-shadow(0 0 7px rgba(232,163,61,0.9)); }
  .slide { margin-right: 30px; }          /* the right margin holds the height label */
</style>
</head>
<body>
<div class="widget">
  <div class="expr" id="expr" aria-live="polite"></div>
  <svg id="fig" aria-hidden="true"></svg>
  <div class="slide"><input id="x" type="range" min="0" max="5" step="0.1" value="1" aria-label="Value of x" /></div>
</div>

<script src="../widget-base.js"></script>
<script>
  // 5x is a strip x tall and 5 wide; x² is an x-by-x square set inside it.
  // The leftover is x tall and (5 − x) wide, so its area is 5x − x².
  // The slider spans the strip's width, so its thumb sits on the square's edge.
  const NS = "http://www.w3.org/2000/svg";
  const fig = document.getElementById("fig"), slider = document.getElementById("x");
  const exprEl = document.getElementById("expr");
  const fmt = (n) => (n < 0 ? "−" : "") + String(+Math.abs(n).toFixed(2));
  const SQ = "#7aa7ff", LIN = "#64c8a0", AMB = "#e8a33d";
  const RM = 30, PAD = 7.5, TOP = 4;

  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || fig).appendChild(e);
    return e;
  }

  function render() {
    const t = Math.round(+slider.value * 10), x = t / 10;
    const area = 50 * t - t * t, hit = area === 600;   // hundredths

    exprEl.innerHTML = `<span class="k-lin">5(${fmt(x)})</span> − <span class="k-sq">${fmt(x)}²</span> = ` +
                       `<span class="res${hit ? " hit" : ""}">${fmt(area / 100)}</span>`;

    const W = fig.clientWidth || 340;
    const u = (W - RM - 2 * PAD) / 5, x0 = PAD, base = TOP + 5 * u, H = base + 22;
    fig.setAttribute("viewBox", `0 0 ${W} ${H}`); fig.setAttribute("height", H);
    fig.textContent = "";

    // the 5 × 5 room the strip can grow into, as a faint unit grid
    for (let k = 0; k <= 5; k++) {
      el("line", { x1: x0 + k * u, x2: x0 + k * u, y1: TOP, y2: base, stroke: "rgba(238,242,252,0.05)" });
      el("line", { x1: x0, x2: x0 + 5 * u, y1: base - k * u, y2: base - k * u, stroke: "rgba(238,242,252,0.05)" });
    }

    const h = x * u, top = base - h, split = x0 + x * u, right = x0 + 5 * u;
    if (h > 0) {
      // leftover: x tall, (5 − x) wide, with its unit cells drawn so the area can be counted
      el("rect", { x: split, y: top, width: right - split, height: h, fill: hit ? "rgba(232,163,61,0.26)" : "rgba(232,163,61,0.12)" });
      const cells = el("g", { stroke: "rgba(232,163,61,0.35)" });
      for (let k = Math.ceil(x); k < 5; k++) el("line", { x1: x0 + k * u, x2: x0 + k * u, y1: top, y2: base }, cells);
      for (let k = 1; k < x; k++) el("line", { x1: split, x2: right, y1: base - k * u, y2: base - k * u }, cells);

      el("rect", { x: x0, y: top, width: split - x0, height: h, fill: "rgba(122,167,255,0.2)", stroke: SQ, "stroke-width": 1.3 });
      el("rect", { x: x0, y: top, width: 5 * u, height: h, fill: "none", stroke: LIN, "stroke-width": 1.6 });

      if (right - split > 30 && h > 30)
        el("text", { x: (split + right) / 2, y: top + h / 2 + 9, "text-anchor": "middle", class: "area" + (hit ? " hit" : "") }).textContent = fmt(area / 100);

      // dimensions: the two widths under the base, the shared height in the right margin
      if (split - x0 > 14) el("text", { x: (x0 + split) / 2, y: base + 15, "text-anchor": "middle", fill: SQ }).textContent = fmt(x);
      if (right - split > 14) el("text", { x: (split + right) / 2, y: base + 15, "text-anchor": "middle", fill: AMB }).textContent = fmt(5 - x);
      el("line", { x1: right + 7, x2: right + 7, y1: top, y2: base, stroke: "rgba(238,242,252,0.3)" });
      el("text", { x: right + 12, y: top + h / 2 + 4, fill: "rgba(238,242,252,0.7)" }).textContent = fmt(x);
    }
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
