<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sliding, stretching and flipping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  .expr { text-align: center; white-space: nowrap; font-size: clamp(1.2rem, 5.2vw, 1.7rem); color: var(--txt); }
  .expr .k { color: var(--const); }
  .tag { display: block; text-align: center; margin: 0.2rem 0 0.4rem; min-height: 1.2em; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--dim); }
</style>
</head>
<body>
<div class="widget">
  <div class="expr" id="expr" aria-hidden="true"></div>
  <span class="tag" id="tag" aria-live="polite"></span>
  <svg id="line" role="img"></svg>
  <input id="k" type="range" />
</div>

<script src="../widget-base.js"></script>
<script>
  // Every number from −4 to 4 gets the same operation. ?op=add adds k; ?op=mul multiplies by k.
  // The dots are coloured in their starting order, so the colours show whether order is kept,
  // reversed, or (at ×0) lost. Faint ticks mark where each dot started. k is held in tenths.
  const MUL = new URLSearchParams(location.search).get("op") === "mul";
  const C = MUL ? { min: -3, max: 3, step: 0.1, start: 3, view: 12.6 } : { min: -4, max: 4, step: 0.5, start: 3, view: 8.6 };
  const slider = document.getElementById("k");
  Object.assign(slider, { min: C.min, max: C.max, step: C.step, value: C.start });
  slider.setAttribute("aria-label", MUL ? "The number every input is multiplied by" : "The number added to every input");

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("line");
  const IN = [-4, -3, -2, -1, 0, 1, 2, 3, 4];
  const H = 74, Y = 34, PAD = 10;
  const STOPS = [[122, 167, 255], [100, 200, 160], [232, 163, 61]];   // blue → green → amber, by starting order
  const colour = (i) => {
    const t = i / (IN.length - 1) * 2, j = Math.min(1, Math.floor(t)), f = t - j;
    const c = STOPS[j].map((v, n) => Math.round(v + (STOPS[j + 1][n] - v) * f));
    return `rgb(${c.join(",")})`;
  };
  const fmt = (n) => (n < 0 ? "−" : "") + String(+Math.abs(n).toFixed(2));

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function render() {
    const K = Math.round(+slider.value * 10), k = K / 10;
    const out = IN.map((x) => (MUL ? x * K / 10 : x + k));
    document.getElementById("expr").innerHTML = MUL
      ? `every <span class="v">x</span> → <span class="k">${K < 0 ? "(" + fmt(k) + ")" : fmt(k)}</span> · <span class="v">x</span>`
      : `every <span class="v">x</span> → <span class="v">x</span> ${k < 0 ? "−" : "+"} <span class="k">${fmt(Math.abs(k))}</span>`;
    document.getElementById("tag").textContent = MUL && K === 0 ? "everything lands on 0"
      : MUL && K < 0 ? "order reversed" : "same order";

    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const sx = (v) => PAD + ((v + C.view) / (2 * C.view)) * (W - 2 * PAD);
    el("line", { x1: PAD, x2: W - PAD, y1: Y, y2: Y, stroke: "rgba(238,242,252,0.22)" });
    const stepLab = MUL ? 3 : 2;
    for (let u = -Math.floor(C.view); u <= C.view; u++) {
      el("line", { x1: sx(u), x2: sx(u), y1: Y, y2: Y + (u % stepLab === 0 ? 5 : 3), stroke: "rgba(238,242,252,0.2)" });
      if (u % stepLab === 0) el("text", { x: sx(u), y: Y + 18, "text-anchor": "middle" }, fmt(u));
    }
    el("line", { x1: sx(0), x2: sx(0), y1: Y - 16, y2: Y + 5, stroke: "rgba(238,242,252,0.4)" });
    IN.forEach((x, i) => el("line", { x1: sx(x), x2: sx(x), y1: Y - 22, y2: Y - 15, stroke: colour(i), "stroke-width": 2, opacity: 0.55 }));
    // draw later dots on top; at ×0 they all sit on one point
    IN.forEach((x, i) => el("circle", { cx: sx(out[i]), cy: Y, r: 5.5, fill: colour(i), stroke: "#0e0e11", "stroke-width": 1 }));
    svg.setAttribute("aria-label", `Inputs −4 to 4 go to ${out.map(fmt).join(", ")}.`);
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
