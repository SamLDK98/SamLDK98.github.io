<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Following a calculation step by step</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  svg { display: block; width: 100%; overflow: visible; margin-top: 0.8rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--dim); }
  svg text.expr { font-family: "Spectral", Georgia, serif; font-style: italic; font-size: 15px; fill: rgba(238, 242, 252, 0.85); }
  svg text.step { font-size: 11px; fill: var(--const); }
  svg text.state { font-size: 10px; fill: rgba(238, 242, 252, 0.6); }
  svg text.state.meet { fill: var(--const); }
  .tag { display: block; text-align: center; margin-top: 0.3rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="widget">
  <div class="choices" role="group" aria-label="Calculation">
    <button aria-pressed="true">4<span class="v">x</span> + 3</button>
    <button aria-pressed="false">−2<span class="v">x</span> + 5</button>
    <button aria-pressed="false"><span class="v">x</span> · <span class="v">x</span></button>
    <button aria-pressed="false"><span class="v">x</span>² + 2<span class="v">x</span></button>
    <button aria-pressed="false"><span class="v">x</span> · <span class="v">x</span> · <span class="v">x</span></button>
  </div>
  <svg id="chain" role="img"></svg>
  <span class="tag" id="tag" aria-live="polite"></span>
</div>

<script src="../widget-base.js"></script>
<script>
  // A handful of numbers followed through every step of a calculation, one number line per step.
  // Each dot keeps the colour of the number it started as, and a thread joins it from line to line,
  // so threads that cross show the order reversing and threads that meet show two inputs landing
  // together. All the lines of one calculation share a scale, so stretches look like stretches.
  // "× itself" squares the current value; "× x" multiplies by the original input.
  const CHAINS = [
    { inputs: [-3, -2, -1, 0, 1, 2, 3], steps: [
      { op: "× 4", f: (v) => 4 * v, expr: "4x" },
      { op: "+ 3", f: (v) => v + 3, expr: "4x + 3" } ] },
    { inputs: [-3, -2, -1, 0, 1, 2, 3], steps: [
      { op: "× (−2)", f: (v) => -2 * v, expr: "−2x" },
      { op: "+ 5", f: (v) => v + 5, expr: "−2x + 5" } ] },
    { inputs: [-3, -2, -1, 0, 1, 2, 3], steps: [
      { op: "× itself", f: (v) => v * v, expr: "x · x" } ] },
    { inputs: [-4, -3, -2, -1, 0, 1, 2], steps: [
      { op: "+ 1", f: (v) => v + 1, expr: "x + 1" },
      { op: "× itself", f: (v) => v * v, expr: "(x + 1)²" },
      { op: "− 1", f: (v) => v - 1, expr: "(x + 1)² − 1" } ] },
    { inputs: [-2, -1, 0, 1, 2], steps: [
      { op: "× itself", f: (v) => v * v, expr: "x · x" },
      { op: "× x", f: (v, x) => v * x, expr: "x · x · x" } ] },
  ];
  const STOPS = [[122, 167, 255], [100, 200, 160], [232, 163, 61]];   // blue → green → amber, by starting order
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("chain");
  const PAD = 12, TOP = 26, GAP = 64, SIDE = 100;   // SIDE: a column on the right for the step labels
  const fmt = (n) => (n < 0 ? "−" : "") + Math.abs(n);
  let pick = 0;

  const colour = (i, n) => {
    const t = (i / (n - 1)) * 2, j = Math.min(1, Math.floor(t)), f = t - j;
    return `rgb(${STOPS[j].map((v, k) => Math.round(v + (STOPS[j + 1][k] - v) * f)).join(",")})`;
  };

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  // how the numbers sit on a line compared with how they started
  function state(vals) {
    const distinct = new Set(vals).size;
    if (distinct < vals.length) return { text: `${vals.length - distinct} pair${vals.length - distinct > 1 ? "s" : ""} meet${vals.length - distinct > 1 ? "" : "s"}`, meet: true };
    const up = vals.every((v, i) => i === 0 || v > vals[i - 1]);
    const down = vals.every((v, i) => i === 0 || v < vals[i - 1]);
    return { text: up ? "same order" : down ? "order reversed" : "order mixed", meet: false };
  }

  function render() {
    const C = CHAINS[pick], n = C.inputs.length;
    const stages = [C.inputs.slice()];
    C.steps.forEach((s) => stages.push(stages[stages.length - 1].map((v, i) => s.f(v, C.inputs[i]))));
    const all = stages.flat(), lo = Math.min(...all, 0) - 0.6, hi = Math.max(...all, 0) + 0.6;
    const H = TOP + GAP * (stages.length - 1) + 30;
    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const R = W - SIDE, sx = (v) => PAD + ((v - lo) / (hi - lo)) * (R - PAD);
    const Y = (k) => TOP + k * GAP;

    // threads first, so the dots sit on top of them
    for (let k = 1; k < stages.length; k++)
      stages[k].forEach((v, i) => el("line", { x1: sx(stages[k - 1][i]), y1: Y(k - 1), x2: sx(v), y2: Y(k),
        stroke: colour(i, n), "stroke-width": 1.2, opacity: 0.45 }));

    stages.forEach((vals, k) => {
      const y = Y(k);
      el("line", { x1: PAD, x2: R, y1: y, y2: y, stroke: "rgba(238,242,252,0.2)" });
      el("line", { x1: sx(0), x2: sx(0), y1: y - 5, y2: y + 5, stroke: "rgba(238,242,252,0.45)" });
      el("text", { x: PAD, y: y - 13, class: "expr" }, k === 0 ? "x" : C.steps[k - 1].expr);
      if (k > 0) {
        el("text", { x: R + 8, y: y - 4, class: "step" }, C.steps[k - 1].op);
        const st = state(vals);
        el("text", { x: R + 8, y: y + 10, class: "state" + (st.meet ? " meet" : "") }, st.text);
      }
      const seen = new Map();
      vals.forEach((v, i) => {
        const again = seen.has(v);
        seen.set(v, true);
        if (again) el("circle", { cx: sx(v), cy: y, r: 8.5, fill: "none", stroke: colour(i, n), "stroke-width": 2 });
        else el("circle", { cx: sx(v), cy: y, r: 5, fill: colour(i, n), stroke: "#0e0e11", "stroke-width": 1 });
      });
    });

    // number labels under the last line only, skipping any that would collide
    const last = stages[stages.length - 1], yl = Y(stages.length - 1) + 18;
    let lastX = -Infinity;
    [...new Set(last)].sort((a, b) => a - b).forEach((v) => {
      if (sx(v) - lastX < 18) return;
      el("text", { x: sx(v), y: yl, "text-anchor": "middle" }, fmt(v));
      lastX = sx(v);
    });

    const outs = new Set(last).size;
    document.getElementById("tag").textContent = `${n} inputs, ${outs} different outputs`;
    svg.setAttribute("aria-label", stages.map((vals, k) => (k === 0 ? "x" : C.steps[k - 1].expr) + ": " + vals.map(fmt).join(", ")).join("; "));
  }

  document.querySelectorAll(".choices button").forEach((b, i) => b.addEventListener("click", () => {
    document.querySelectorAll(".choices button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    pick = i;
    render();
    if (window.postWidgetHeight) window.postWidgetHeight();
  }));

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
