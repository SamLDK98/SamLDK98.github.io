<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lowering the target to 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  .expr { text-align: center; white-space: nowrap; font-size: clamp(1.2rem, 5.2vw, 1.6rem); color: var(--txt); }
  svg { display: block; width: 100%; overflow: visible; margin: 0.4rem 0 0.5rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--dim); }
  svg text.target { fill: var(--const); }
  svg text.root { fill: #ff5d5d; }
</style>
</head>
<body>
<div class="widget">
  <div class="expr" id="expr" aria-hidden="true"></div>
  <svg id="fig" role="img"></svg>
  <input id="c" type="range" min="0" max="9" step="1" value="0" aria-label="How much is subtracted from both sides" />
</div>

<script src="../widget-base.js"></script>
<script>
  // x² = 9, with c subtracted from both sides: the curve x² − c and the target line 9 − c (amber, dashed)
  // drop together, so they always meet at x = −3 and x = 3 (red). At c = 9 the target is 0, the x-axis,
  // and the solutions are where the graph meets it.
  const slider = document.getElementById("c");
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const PAD = 12, H = 250, XR = [-4.6, 4.6], YR = [-10, 17];
  const fmt = (n) => (n < 0 ? "−" : "") + Math.abs(n);

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function render() {
    const c = +slider.value, t = 9 - c;
    document.getElementById("expr").innerHTML = (c ? `<span class="v">x</span>² − <span class="k-const">${c}</span>` : `<span class="v">x</span>²`)
      + ` = <span class="k-const">${t}</span>`;
    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const sx = (x) => PAD + ((x - XR[0]) / (XR[1] - XR[0])) * (W - 2 * PAD);
    const sy = (y) => H - 6 - ((y - YR[0]) / (YR[1] - YR[0])) * (H - 12);

    el("line", { x1: PAD, x2: W - PAD, y1: sy(0), y2: sy(0), stroke: "rgba(238,242,252,0.45)", "stroke-width": 1.2 });
    el("line", { x1: sx(0), x2: sx(0), y1: 4, y2: H - 4, stroke: "rgba(238,242,252,0.2)" });
    let d = "";
    for (let i = 0; i <= 120; i++) {
      const x = -4.4 + (8.8 * i) / 120;
      d += (i ? "L" : "M") + sx(x).toFixed(1) + " " + sy(x * x - c).toFixed(1);
    }
    el("path", { d, fill: "none", stroke: "rgba(244,246,255,0.85)", "stroke-width": 1.8 });
    if (t) {
      el("line", { x1: PAD, x2: W - PAD, y1: sy(t), y2: sy(t), stroke: "#e8a33d", "stroke-width": 1.4, "stroke-dasharray": "5 5" });
      el("text", { x: W - PAD, y: sy(t) - 6, "text-anchor": "end", class: "target" }, String(t));
    }
    for (const x of [-3, 3]) {
      el("line", { x1: sx(x), x2: sx(x), y1: sy(t), y2: sy(0), stroke: "rgba(255,93,93,0.35)", "stroke-dasharray": "2 3" });
      el("circle", { cx: sx(x), cy: sy(t), r: 5, fill: "#ff5d5d" });
      // labelled below the axis on the outer side, clear of the curve as it dips between the roots
      el("text", { x: sx(x) + (x < 0 ? -8 : 8), y: sy(0) + 16, "text-anchor": x < 0 ? "end" : "start", class: "root" }, fmt(x));
    }
    svg.setAttribute("aria-label", c
      ? `x squared minus ${c} equals ${t}: the curve and the target line have both dropped by ${c}, and still meet at x = −3 and x = 3.` + (t ? "" : " The target is now 0, the x-axis.")
      : "x squared equals 9: the curve meets the target line, 9, at x = −3 and x = 3.");
  }

  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
