<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>When a product is zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 560px; margin: 0 auto; }
  .expr {
    display: flex; justify-content: center; align-items: flex-start; gap: 0.12em;
    font-size: clamp(1.4rem, 6vw, 2rem); color: var(--txt);
  }
  .factor { display: flex; flex-direction: column; align-items: center; transition: color 0.25s ease, text-shadow 0.25s ease; }
  .factor .val, .total .val {
    font-family: "IBM Plex Mono", monospace; font-size: 0.42em; color: var(--dim);
    margin-top: 0.35rem; transition: color 0.25s ease;
  }
  .factor.zero { color: var(--const); text-shadow: 0 0 14px var(--glow); }
  .factor.zero .val { color: var(--const); }
  .total { display: flex; align-items: baseline; gap: 0.3em; margin-left: 0.4em; color: var(--dim); transition: color 0.25s ease; }
  .total.zero { color: var(--const); }

  .line { position: relative; margin: 1.6rem 0.4rem 0; }
  .ticks { position: relative; height: 1.7rem; margin: 0 7.5px; }
  .ticks span {
    position: absolute; top: 0; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; color: var(--dim);
    transition: color 0.25s ease;
  }
  .ticks span::before { content: ""; width: 1px; height: 6px; background: var(--faint); margin-bottom: 3px; }
  .ticks span.hit { color: var(--const); }
  .ticks span.hit::before { background: var(--const); }
  .ticks span.minor { color: transparent; }
  .ticks span.minor.hit { color: var(--const); }
</style>
</head>
<body>
<div class="widget">
  <div class="expr" aria-live="polite">
    <span class="factor" id="f1"><span>(<span class="v">x</span> − 1)</span><span class="val"></span></span>
    <span class="factor" id="f2"><span>(<span class="v">x</span> + 7)</span><span class="val"></span></span>
    <span class="total" id="tot"><span>=</span><span id="prod"></span></span>
  </div>
  <div class="line">
    <input id="x" type="range" min="-10" max="4" step="1" value="-3" aria-label="Value of x" />
    <div class="ticks" id="ticks" aria-hidden="true"></div>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  const x = document.getElementById("x");
  const MIN = -10, MAX = 4;
  const ticks = document.getElementById("ticks");
  const fmt = (n) => (n < 0 ? "−" + Math.abs(n) : String(n));
  for (let v = MIN; v <= MAX; v += 1) {
    const s = document.createElement("span");
    s.style.left = ((v - MIN) / (MAX - MIN)) * 100 + "%";
    s.textContent = fmt(v);
    if (v % 2 !== 0 && v !== -7 && v !== 1) s.className = "minor";   // keep the labels sparse
    s.dataset.v = v;
    ticks.appendChild(s);
  }
  const f1 = document.getElementById("f1"), f2 = document.getElementById("f2");
  const tot = document.getElementById("tot"), prod = document.getElementById("prod");

  function render() {
    const v = +x.value, a = v - 1, b = v + 7;
    f1.querySelector(".val").textContent = fmt(a);
    f2.querySelector(".val").textContent = fmt(b);
    f1.classList.toggle("zero", a === 0);
    f2.classList.toggle("zero", b === 0);
    prod.textContent = fmt(a * b);
    tot.classList.toggle("zero", a * b === 0);
    ticks.querySelectorAll("span").forEach((s) => s.classList.toggle("hit", +s.dataset.v === v));
  }
  x.addEventListener("input", render);
  render();
</script>
</body>
</html>
