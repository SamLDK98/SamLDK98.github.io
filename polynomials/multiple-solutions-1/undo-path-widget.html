<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Undoing the steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  .expr { text-align: center; white-space: nowrap; font-size: clamp(1.15rem, 5vw, 1.6rem); color: var(--txt); margin: 0.9rem 0 0.3rem; }
  svg { display: block; width: 100%; overflow: visible; }
  svg .node { font-family: "Spectral", Georgia, serif; font-size: 20px; fill: var(--txt); }
  svg .node.end { fill: var(--const); filter: drop-shadow(0 0 6px rgba(232,163,61,0.75)); }
  svg .op { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; fill: var(--dim); }
  svg .op.fork { fill: var(--const); }
</style>
</head>
<body>
<div class="widget">
  <div class="choices" role="group" aria-label="Equation">
    <button data-eq="lin" aria-pressed="true">2<span class="v">x</span> + 4 = 7</button>
    <button data-eq="quad" aria-pressed="false"><span class="v">x</span>² − 5<span class="v">x</span> = −6</button>
  </div>
  <div class="expr" id="expr"></div>
  <svg id="path" role="img"></svg>
</div>

<script src="../widget-base.js"></script>
<script>
  // Each equation is written so that x appears once, then its steps are undone from the right-hand side.
  // Every undo has one result, except undoing a square, which forks.
  const EQS = {
    lin: {
      expr: `<span class="k-lin">2<span class="v">x</span></span> + <span class="k-const">4</span> = <span class="k-const">7</span>`,
      cols: [["7"], ["3"], ["x = 1.5"]],
      ops: ["− 4", "÷ 2"],
      label: "7, take away 4 gives 3, divide by 2 gives x = 1.5",
    },
    quad: {
      expr: `<span class="k-sq">(<span class="v">x</span> − 2.5)²</span> − <span class="k-const">6.25</span> = <span class="k-const">−6</span>`,
      cols: [["−6"], ["0.25"], ["0.5", "−0.5"], ["x = 3", "x = 2"]],
      ops: ["+ 6.25", "±√", "+ 2.5"],
      label: "−6, add 6.25 gives 0.25, undoing the square gives 0.5 or −0.5, add 2.5 gives x = 3 or x = 2",
    },
  };
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("path"), exprEl = document.getElementById("expr");
  const H = 118, MID = 58, SPREAD = 34;
  let eq = "lin";

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function render() {
    const E = EQS[eq], W = svg.clientWidth || 560, n = E.cols.length;
    const narrow = W < 420, M = narrow ? 18 : 34;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.setAttribute("aria-label", E.label);
    svg.textContent = "";
    exprEl.innerHTML = E.expr;
    const ys = (col) => (col.length === 1 ? [MID] : [MID - SPREAD, MID + SPREAD]);

    // nodes first, so each edge can start and stop at the real edge of its text
    const half = E.cols.map(() => 0);
    const cx = (i) => M + half[0] + (i * (W - 2 * M - half[0] - half[n - 1])) / (n - 1);
    const nodes = E.cols.map((col, i) => ys(col).map((y, j) =>
      el("text", { y: y + 7, "text-anchor": "middle", class: "node" + (i === n - 1 ? " end" : ""),
                   style: narrow ? "font-size: 17px" : "" }, col[j])));
    nodes.forEach((col, i) => col.forEach((t) => { half[i] = Math.max(half[i], t.getBBox().width / 2); }));
    nodes.forEach((col, i) => col.forEach((t) => t.setAttribute("x", cx(i))));

    const line = "rgba(238,242,252,0.32)", amber = "rgba(232,163,61,0.6)";
    for (let i = 0; i < n - 1; i++) {
      const a = ys(E.cols[i]), b = ys(E.cols[i + 1]);
      const x1 = cx(i) + half[i] + 6, x2 = cx(i + 1) - half[i + 1] - 6, fork = a.length === 1 && b.length === 2;
      const mx = (x1 + x2) / 2;
      b.forEach((yb, j) => {
        const ya = a.length === 1 ? a[0] : a[j], col = fork ? amber : line;
        el("path", { d: `M${x1} ${ya} C${mx} ${ya} ${mx} ${yb} ${x2} ${yb}`, fill: "none", stroke: col, "stroke-width": 1.3 });
        el("path", { d: `M${x2 - 5} ${yb - 3.5} L${x2} ${yb} L${x2 - 5} ${yb + 3.5}`, fill: "none", stroke: col, "stroke-width": 1.3 });
        if (b.length === 2 && !fork)   // after the fork, label each branch's step
          el("text", { x: mx, y: yb - 7, "text-anchor": "middle", class: "op" }, E.ops[i]);
      });
      // a fork's label sits in the gap between its two branches
      if (b.length === 1 || fork)
        el("text", { x: mx, y: fork ? MID + 4 : b[0] - 7, "text-anchor": "middle", class: "op" + (fork ? " fork" : "") }, E.ops[i]);
    }
  }

  document.querySelectorAll(".choices button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".choices button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    eq = b.dataset.eq;
    render();
    if (window.postWidgetHeight) window.postWidgetHeight();
  }));

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
  if (document.fonts) document.fonts.ready.then(render);   // node widths are measured, so redo once the fonts arrive
</script>
</body>
</html>
