<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Solutions as mirror images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  .expr { text-align: center; white-space: nowrap; font-size: clamp(1.25rem, 5.4vw, 1.8rem); color: var(--txt); }
  .expr .k { color: var(--const); }
  .sol {
    text-align: center; min-height: 1.4em; margin: 0.2rem 0 0.4rem;
    font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; color: var(--dim);
  }
  .stage { position: relative; }
  svg { display: block; width: 100%; overflow: visible; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--dim); }
  svg text.amber { fill: var(--const); }
  /* the one control: a vertical rail on the right that holds the level */
  .rail { position: absolute; top: 0; right: 0; width: 40px; cursor: ns-resize; touch-action: none; }
  .rail:focus-visible { outline: 1px solid var(--dim); outline-offset: 2px; }
  svg.dragging, .stage.mouse svg { cursor: ns-resize; }
</style>
</head>
<body>
<div class="widget">
  <div class="expr" id="expr" aria-hidden="true"></div>
  <div class="sol" id="sol" aria-live="polite"></div>
  <div class="stage">
    <svg id="plot" aria-hidden="true"></svg>
    <div class="rail" id="rail" role="slider" tabindex="0" aria-label="Right-hand side"></div>
  </div>
</div>

<script src="../widget-base.js"></script>
<script>
  // ?f=sq shows x² = k (mirror at 0); otherwise x² − 5x = k, which is (x − 2.5)² − 6.25 = k (mirror at 2.5).
  // The level k is held in hundredths so that −6, −6.25 and 4 are exact.
  const SQ = new URLSearchParams(location.search).get("f") === "sq";
  const C = SQ
    ? { c: 0, m100: 0, f: (x) => x * x, xmin: -3.5, xmax: 3.5, ymin: -1.6, ymax: 10.2, kmin: -150, kmax: 900, k: 225,
        lhs: `<span class="k-sq">x²</span>` }
    : { c: 2.5, m100: -625, f: (x) => x * x - 5 * x, xmin: -1, xmax: 6, ymin: -7.6, ymax: 6.6, kmin: -725, kmax: 600, k: 200,
        lhs: `<span class="k-sq">x²</span> − <span class="k-lin">5x</span>` };
  const SNAP = 25;
  const fmt = (n) => (n < 0 ? "−" : "") + String(+Math.abs(n).toFixed(2));

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("plot"), rail = document.getElementById("rail");
  const exprEl = document.getElementById("expr"), solEl = document.getElementById("sol");
  const H = 236, TOP = 8, BOT = H - 22, PAD = 8, RAIL = 40;
  let k100 = C.k, W = 560;

  const sx = (x) => PAD + ((x - C.xmin) / (C.xmax - C.xmin)) * (W - RAIL - PAD);
  const sy = (y) => TOP + ((C.ymax - y) / (C.ymax - C.ymin)) * (BOT - TOP);
  const ky = (py) => C.ymax - ((py - TOP) / (BOT - TOP)) * (C.ymax - C.ymin);

  function el(name, attrs) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    svg.appendChild(e);
    return e;
  }

  function render() {
    W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    rail.style.height = BOT + "px";
    svg.textContent = "";
    const k = k100 / 100, gap = k100 - C.m100;
    const d = gap >= 0 ? Math.sqrt(gap / 100) : null;
    const exact = d !== null && Math.abs(d * 100 - Math.round(d * 100)) < 1e-9;
    const sols = d === null ? [] : d === 0 ? [C.c] : [C.c - d, C.c + d];

    exprEl.innerHTML = `${C.lhs} = <span class="k">${fmt(k)}</span>`;
    const dist = exact ? fmt(d) : "√" + fmt(gap / 100);
    solEl.textContent = d === null ? "no x"
      : d === 0 ? `x = ${fmt(C.c)}`
      : C.c === 0 ? `x = ±${dist}`
      : `x = ${fmt(C.c)} ± ${dist}`;
    rail.setAttribute("aria-valuenow", k); rail.setAttribute("aria-valuetext", `${fmt(k)}: ${solEl.textContent}`);
    rail.setAttribute("aria-valuemin", C.kmin / 100); rail.setAttribute("aria-valuemax", C.kmax / 100);

    const right = W - RAIL;
    el("line", { x1: PAD, x2: right, y1: sy(0), y2: sy(0), stroke: "rgba(238,242,252,0.12)" });
    el("line", { x1: sx(C.c), x2: sx(C.c), y1: TOP, y2: BOT, stroke: "rgba(238,242,252,0.32)", "stroke-dasharray": "2 4" });

    let p = "";
    for (let i = 0; i <= 160; i++) {
      const x = C.xmin + ((C.xmax - C.xmin) * i) / 160;
      p += (i ? "L" : "M") + sx(x).toFixed(1) + " " + sy(C.f(x)).toFixed(1);
    }
    el("path", { d: p, fill: "none", stroke: "rgba(238,242,252,0.55)", "stroke-width": 1.6 });

    // the level, with the two equal arms reaching out from the mirror
    el("line", { x1: PAD, x2: right, y1: sy(k), y2: sy(k), stroke: "rgba(232,163,61,0.4)", "stroke-dasharray": "4 5" });
    if (sols.length === 2)
      el("line", { x1: sx(sols[0]), x2: sx(sols[1]), y1: sy(k), y2: sy(k), stroke: "#e8a33d", "stroke-width": 1.8 });
    sols.forEach((s) => {
      el("line", { x1: sx(s), x2: sx(s), y1: sy(k), y2: BOT + 3, stroke: "rgba(232,163,61,0.3)" });
      el("circle", { cx: sx(s), cy: sy(k), r: 4.5, fill: "#e8a33d", style: "filter: drop-shadow(0 0 5px rgba(232,163,61,0.8))" });
    });

    // x labels: the integers, with the solutions themselves picked out in amber
    const solLabels = sols.map((s) => +s.toFixed(2));
    for (let u = Math.ceil(C.xmin); u <= C.xmax; u++)
      if (!solLabels.some((s) => Math.abs(s - u) < 0.3))
        el("text", { x: sx(u), y: H - 4, "text-anchor": "middle" }).textContent = fmt(u);
    solLabels.forEach((s) => el("text", { x: sx(s), y: H - 4, "text-anchor": "middle", class: "amber" }).textContent = (exact || d === 0 ? "" : "≈") + fmt(s));

    // the rail
    const rx = right + RAIL / 2 + 2;
    el("line", { x1: rx, x2: rx, y1: TOP, y2: BOT, stroke: "rgba(238,242,252,0.16)", "stroke-width": 2, "stroke-linecap": "round" });
    el("circle", { cx: rx, cy: sy(k), r: 7.5, fill: "#e8a33d", style: "filter: drop-shadow(0 0 5px rgba(232,163,61,0.45))" });
  }

  function setFromY(clientY) {
    const r = svg.getBoundingClientRect();
    const v = Math.round((ky(clientY - r.top) * 100) / SNAP) * SNAP;
    const nk = Math.max(C.kmin, Math.min(C.kmax, v));
    if (nk !== k100) { k100 = nk; render(); }
  }

  // drag on the rail with anything; drag in the plot itself with a mouse (touch there keeps scrolling the page)
  let dragging = false;
  function start(e) { dragging = true; e.target.setPointerCapture(e.pointerId); setFromY(e.clientY); e.preventDefault(); }
  rail.addEventListener("pointerdown", start);
  svg.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") start(e); });
  [rail, svg].forEach((t) => {
    t.addEventListener("pointermove", (e) => { if (dragging) setFromY(e.clientY); });
    t.addEventListener("pointerup", () => { dragging = false; });
    t.addEventListener("pointercancel", () => { dragging = false; });
  });
  if (matchMedia("(pointer: fine)").matches) document.querySelector(".stage").classList.add("mouse");

  rail.addEventListener("keydown", (e) => {
    const step = { ArrowUp: SNAP, ArrowRight: SNAP, ArrowDown: -SNAP, ArrowLeft: -SNAP, PageUp: 100, PageDown: -100 }[e.key];
    if (!step) return;
    e.preventDefault();
    k100 = Math.max(C.kmin, Math.min(C.kmax, k100 + step));
    render();
  });

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
