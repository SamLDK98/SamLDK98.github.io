<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One-to-one and two-to-one</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  svg { display: block; width: 100%; overflow: visible; margin-top: 0.9rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--dim); }
  svg text.hit { fill: var(--const); }
</style>
</head>
<body>
<div class="widget">
  <div class="choices" role="group" aria-label="Operation">
    <button data-op="add" aria-pressed="true"><span class="v">x</span> + 4</button>
    <button data-op="mul" aria-pressed="false">2<span class="v">x</span></button>
    <button data-op="sq" aria-pressed="false"><span class="v">x</span>²</button>
  </div>
  <svg id="map" aria-hidden="true"></svg>
</div>

<script src="../widget-base.js"></script>
<script>
  // Inputs on the top line, outputs on the bottom line, one stroke per input.
  // The output line is the same for all three operations, so they can be compared honestly.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("map");
  const OPS = { add: (a) => a + 4, mul: (a) => 2 * a, sq: (a) => a * a };
  const IN = [], IN_MIN = -3, IN_MAX = 3, OUT_MIN = -6, OUT_MAX = 10;
  for (let a = IN_MIN; a <= IN_MAX + 1e-9; a += 0.5) IN.push(a);
  const H = 132, YT = 14, YB = 104, PAD = 10;
  const fmt = (n) => (n < 0 ? "−" : "") + Math.abs(n);

  let op = "add", from = IN.map(OPS.add), to = from.slice(), t0 = 0;

  function el(name, attrs) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    svg.appendChild(e);
    return e;
  }

  function draw(k) {                       // k: 0 → 1 through the change of operation
    const W = svg.clientWidth || 560;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    // the input line is centred and stretched a little, so its points are easy to tell apart
    const unit = (W - 2 * PAD) / (OUT_MAX - OUT_MIN);
    const ox = (v) => PAD + (v - OUT_MIN) * unit;
    const ix = (v) => W / 2 + v * unit * 1.9;

    el("line", { x1: ix(IN_MIN) - 6, x2: ix(IN_MAX) + 6, y1: YT, y2: YT, stroke: "rgba(238,242,252,0.22)" });
    el("line", { x1: PAD, x2: W - PAD, y1: YB, y2: YB, stroke: "rgba(238,242,252,0.22)" });

    // the highlighted inputs: 2, and in the squaring case its partner −2
    const lit = (a) => a === 2 || (op === "sq" && a === -2);
    const target = OPS[op](2);
    IN.forEach((a, i) => {
      const v = from[i] + (to[i] - from[i]) * k;
      el("line", { x1: ix(a), y1: YT, x2: ox(v), y2: YB,
                   stroke: lit(a) ? "#e8a33d" : "rgba(238,242,252,0.28)", "stroke-width": lit(a) ? 1.8 : 1 });
      el("circle", { cx: ix(a), cy: YT, r: lit(a) ? 3.2 : 2.2, fill: lit(a) ? "#e8a33d" : "rgba(238,242,252,0.6)" });
      el("circle", { cx: ox(v), cy: YB, r: lit(a) ? 3.2 : 2.2, fill: lit(a) ? "#e8a33d" : "rgba(238,242,252,0.6)" });
    });

    for (let v = IN_MIN; v <= IN_MAX; v++)
      el("text", { x: ix(v), y: YT - 5, "text-anchor": "middle", class: lit(v) && k === 1 ? "hit" : "" }).textContent = fmt(v);
    for (let v = OUT_MIN; v <= OUT_MAX; v += 2)
      el("text", { x: ox(v), y: YB + 17, "text-anchor": "middle", class: v === target && k === 1 ? "hit" : "" }).textContent = fmt(v);
  }

  function animate(now) {
    const k = Math.min(1, (now - t0) / 550), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    draw(k === 1 ? 1 : e);
    if (k < 1) requestAnimationFrame(animate);
  }

  document.querySelectorAll(".choices button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.op === op) return;
    document.querySelectorAll(".choices button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    from = to.slice(); op = b.dataset.op; to = IN.map(OPS[op]);
    t0 = performance.now(); requestAnimationFrame(animate);
    setTimeout(() => draw(1), 700);          // settle even if animation frames are paused
  }));

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => draw(1), 60); });
  draw(1);
</script>
</body>
</html>
