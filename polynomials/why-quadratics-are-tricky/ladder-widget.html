<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Changes, and changes of changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 600px; margin: 0 auto; }
  .expr { text-align: center; white-space: nowrap; font-size: clamp(1.2rem, 5.2vw, 1.7rem); color: var(--txt); }
  .expr .k { color: var(--const); }
  .sub { text-align: center; white-space: nowrap; min-height: 1.3em; margin: 0.15rem 0 0.3rem;
         font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: rgba(238, 242, 252, 0.66); }
  .sub b { font-weight: 400; color: var(--const); }
  [hidden] { display: none !important; }
  svg { display: block; width: 100%; overflow: visible; margin-top: 0.5rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; fill: rgba(238, 242, 252, 0.6); }
  svg text.row { font-size: 10px; fill: rgba(238, 242, 252, 0.5); letter-spacing: 0.04em; }
  svg text.row.const { fill: var(--const); }
  svg text.amber { fill: var(--const); }
</style>
</head>
<body>
<div class="widget">
  <div class="choices" role="group" aria-label="Expression" id="choices">
    <button aria-pressed="false">2<span class="v">x</span> + 3</button>
    <button aria-pressed="true"><span class="v">x</span>²</button>
    <button aria-pressed="false"><span class="v">x</span>³</button>
    <button aria-pressed="false"><span class="v">x</span>² − 5<span class="v">x</span> − 6</button>
  </div>
  <div class="expr" id="expr" hidden></div>
  <div class="sub" id="sub" hidden></div>
  <svg id="ladder" role="img"></svg>
  <input id="b" type="range" min="-5" max="5" step="1" value="-5" aria-label="Coefficient b" hidden />
</div>

<script src="../widget-base.js"></script>
<script>
  // Outputs at whole-number x, then the change from each output to the next, then the change of
  // that change, and so on until a row is constant. Each row's items sit between the two items above
  // them, as in a difference table. Rising changes are green, falling ones blue.
  // ?mode=slide shows x² + bx − 6 with a slider for b: the change row shifts as a block, while the
  // change of change stays +2, so the turning point and the solutions move but the shape doesn't.
  const SLIDE = new URLSearchParams(location.search).get("mode") === "slide";
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const PICKS = [
    { f: (x) => 2 * x + 3, xs: range(-3, 4), depth: 1 },
    { f: (x) => x * x, xs: range(-4, 4), depth: 2 },
    { f: (x) => x ** 3, xs: range(-3, 3), depth: 3 },
    { f: (x) => x * x - 5 * x - 6, xs: range(-2, 7), depth: 2 },
  ];
  const NAMES = ["change", "change of change", "third change"];
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("ladder"), slider = document.getElementById("b");
  const PAD = 6, OUT = 124, BAND = 62, POS = "#64c8a0", NEG = "#7aa7ff", AMB = "#e8a33d";
  const fmt = (n) => (n < 0 ? "−" : "") + String(+Math.abs(n).toFixed(2));
  const sgn = (n) => (n > 0 ? "+" : "") + fmt(n);
  let pick = 1;

  if (SLIDE) {
    document.getElementById("choices").hidden = true;
    ["expr", "sub", "b"].forEach((id) => { document.getElementById(id).hidden = false; });
  }

  function el(name, attrs, text, parent) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  }

  function render() {
    const b = +slider.value;
    const P = SLIDE ? { f: (x) => x * x + b * x - 6, xs: range(-6, 6), depth: 2 } : PICKS[pick];
    const ys = P.xs.map(P.f), rows = [ys];
    for (let d = 1; d <= P.depth; d++) { const r = rows[d - 1]; rows.push(r.slice(1).map((v, i) => v - r[i])); }
    const quad = SLIDE || pick === 1 || pick === 3;
    const turn = SLIDE ? -b / 2 : pick === 1 ? 0 : pick === 3 ? 2.5 : null;

    if (SLIDE) {
      const lin = b === 0 ? "" : ` ${b < 0 ? "−" : "+"} <span class="k">${Math.abs(b) === 1 ? "" : Math.abs(b)}</span><span class="v">x</span>`;
      document.getElementById("expr").innerHTML = `<span class="v">x</span>²${lin} − 6`;
      const disc = b * b + 24, r = Math.sqrt(disc), exact = Number.isInteger(r);
      const roots = [(-b - r) / 2, (-b + r) / 2].map((v) => (exact ? "" : "≈ ") + fmt(v));
      document.getElementById("sub").innerHTML = `= 0 at <b>${roots[0]}</b> and <b>${roots[1]}</b> · turns at <b>${fmt(turn)}</b>`;
    }

    const W = svg.clientWidth || 560, n = P.xs.length, colW = (W - 2 * PAD) / n;
    const H = OUT + 22 + BAND * P.depth;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    const cx = (i) => PAD + (i + 0.5) * colW;                 // item i of row d sits at column i + d/2
    const xAt = (x) => cx(x - P.xs[0]);

    // outputs
    const lo = SLIDE ? -14 : Math.min(0, ...ys), hi = SLIDE ? 30 : Math.max(0, ...ys);
    const T0 = 26, T1 = OUT - 18;                             // the chart area for outputs
    const oy = (v) => T0 + ((hi - v) / (hi - lo || 1)) * (T1 - T0);
    const defs = el("defs", {});
    el("rect", { x: 0, y: T0 - 6, width: W, height: T1 - T0 + 12 }, undefined, el("clipPath", { id: "chart" }, undefined, defs));
    el("text", { x: PAD, y: 9, class: "row" }, "output");
    el("line", { x1: PAD, x2: W - PAD, y1: oy(0), y2: oy(0), stroke: "rgba(238,242,252,0.16)" });
    if (quad) el("line", { x1: xAt(turn), x2: xAt(turn), y1: T0 - 8, y2: OUT + 8 + BAND, stroke: AMB, "stroke-width": 1.1, "stroke-dasharray": "3 4", opacity: 0.8 });
    el("path", { d: ys.map((v, i) => (i ? "L" : "M") + cx(i).toFixed(1) + " " + oy(v).toFixed(1)).join(""), fill: "none", stroke: "rgba(238,242,252,0.28)", "clip-path": "url(#chart)" });
    ys.forEach((v, i) => {
      const zero = v === 0, off = v > hi || v < lo;
      if (off) el("text", { x: cx(i), y: T0 - 2, "text-anchor": "middle" }, "↑");
      else {
        el("circle", { cx: cx(i), cy: oy(v), r: zero ? 4.5 : 3, fill: zero ? AMB : "rgba(244,246,255,0.85)" });
        el("text", { x: cx(i), y: oy(v) - 7, "text-anchor": "middle", class: zero ? "amber" : "" }, fmt(v));
      }
      el("text", { x: cx(i), y: T1 + 16, "text-anchor": "middle", style: "font-style: italic; fill: rgba(238,242,252,0.42)" }, fmt(P.xs[i]));
    });
    if (SLIDE) {                                               // the exact solutions, where they fall between whole numbers
      const r = Math.sqrt(b * b + 24);
      [(-b - r) / 2, (-b + r) / 2].forEach((s) => {
        if (!Number.isInteger(s)) el("circle", { cx: xAt(s), cy: oy(0), r: 4.5, fill: "none", stroke: AMB, "stroke-width": 1.6 });
      });
    }

    // changes, one band per row
    for (let d = 1; d <= P.depth; d++) {
      const vals = rows[d], top = OUT + 22 + (d - 1) * BAND, mid = top + BAND / 2 + 4;
      const constant = vals.every((v) => v === vals[0]);
      const max = SLIDE && d === 1 ? 18 : Math.max(1, ...vals.map(Math.abs));
      const bh = (v) => (Math.abs(v) / max) * (BAND / 2 - 12);
      el("text", { x: PAD, y: top + 6, class: "row" + (constant ? " const" : "") }, NAMES[d - 1] + (constant ? " · constant" : ""));
      el("line", { x1: PAD, x2: W - PAD, y1: mid, y2: mid, stroke: "rgba(238,242,252,0.14)" });
      const bw = Math.min(colW * 0.5, 16);
      vals.forEach((v, i) => {
        const x = cx(i + d / 2), h = bh(v);
        if (v !== 0) el("rect", { x: x - bw / 2, y: v > 0 ? mid - h : mid, width: bw, height: Math.max(h, 1), rx: 1.5, fill: v > 0 ? POS : NEG, opacity: 0.85 });
        else el("line", { x1: x - bw / 2, x2: x + bw / 2, y1: mid, y2: mid, stroke: AMB, "stroke-width": 2 });
        el("text", { x, y: v >= 0 ? mid + 11 : mid - h - 3, "text-anchor": "middle", class: v === 0 ? "amber" : "" }, sgn(v));
      });
    }
    svg.setAttribute("aria-label", rows.map((r, d) => (d === 0 ? "outputs" : NAMES[d - 1]) + ": " + r.map(fmt).join(", ")).join("; "));
  }

  document.querySelectorAll("#choices button").forEach((btn, i) => btn.addEventListener("click", () => {
    document.querySelectorAll("#choices button").forEach((o) => o.setAttribute("aria-pressed", String(o === btn)));
    pick = i;
    render();
    if (window.postWidgetHeight) window.postWidgetHeight();
  }));
  slider.addEventListener("input", render);
  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
