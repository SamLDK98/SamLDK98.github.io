<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Addition and times tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../widget-base.css" />
<style>
  .widget { max-width: 440px; margin: 0 auto; }
  .choices button { font-size: 1rem; }
  svg { display: block; width: 100%; overflow: visible; margin-top: 0.8rem; }
  svg text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: rgba(238, 242, 252, 0.55); }
  svg text.head { fill: rgba(238, 242, 252, 0.8); }
  svg text.corner { font-size: 13px; fill: rgba(238, 242, 252, 0.8); }
  svg text.on { fill: var(--txt); }
  svg text.win { fill: #0e0e11; font-weight: 500; }
  .tag { display: block; text-align: center; margin-top: 0.5rem; min-height: 1.2em; }
</style>
</head>
<body>
<div class="widget">
  <div class="choices" role="group" aria-label="Equation">
    <button aria-pressed="false"><span class="v">x</span> + <span class="v">x</span> = 8</button>
    <button aria-pressed="false">−2 · <span class="v">x</span> = 8</button>
    <button aria-pressed="true"><span class="v">x</span> · <span class="v">x</span> = 9</button>
    <button aria-pressed="false"><span class="v">x</span> · <span class="v">x</span> = −4</button>
  </div>
  <svg id="grid" role="img"></svg>
  <span class="tag" id="tag" aria-live="polite"></span>
</div>

<script src="../widget-base.js"></script>
<script>
  // Every pair of numbers from −4 to 4, added or multiplied. Cells are tinted by the sign of the result.
  // The cells the equation allows are outlined: the diagonal, where both numbers are the same x, or the
  // row whose first number is the known constant −2. Cells that make the output are filled; where both
  // happen, those are the solutions.
  const EQS = [
    { op: "+", target: 8, allow: (a, b) => a === b, name: "x + x = 8" },
    { op: "×", target: 8, allow: (a) => a === -2, name: "−2 · x = 8" },
    { op: "×", target: 9, allow: (a, b) => a === b, name: "x · x = 9" },
    { op: "×", target: -4, allow: (a, b) => a === b, name: "x · x = −4" },
  ];
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("grid");
  const N = [-4, -3, -2, -1, 0, 1, 2, 3, 4];
  const fmt = (n) => (n < 0 ? "−" : "") + Math.abs(n);
  let pick = 2;

  function el(name, attrs, text) {
    const e = document.createElementNS(NS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function render() {
    const E = EQS[pick], W = svg.clientWidth || 420, c = W / 10, H = c * 10;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
    svg.textContent = "";
    el("text", { x: c / 2, y: c * 0.62, "text-anchor": "middle", class: "corner" }, E.op === "+" ? "+" : "×");
    N.forEach((v, i) => {
      el("text", { x: c * (i + 1.5), y: c * 0.62, "text-anchor": "middle", class: "head" }, fmt(v));
      el("text", { x: c / 2, y: c * (i + 1.62), "text-anchor": "middle", class: "head" }, fmt(v));
    });

    const solutions = [];
    N.forEach((a, i) => N.forEach((b, j) => {
      const v = E.op === "+" ? a + b : a * b, x = c * (j + 1), y = c * (i + 1);
      const ok = E.allow(a, b), makes = v === E.target, win = ok && makes;
      if (win) solutions.push(b);
      const tint = v > 0 ? "rgba(232,163,61,0.09)" : v < 0 ? "rgba(122,167,255,0.11)" : "rgba(0,0,0,0)";
      el("rect", { x: x + 1, y: y + 1, width: c - 2, height: c - 2, rx: 3,
                   fill: win ? "#e8a33d" : makes ? "rgba(232,163,61,0.32)" : tint,
                   stroke: ok ? "rgba(244,246,255,0.65)" : "none", "stroke-width": 1.3,
                   style: win ? "filter: drop-shadow(0 0 6px rgba(232,163,61,0.8))" : "" });
      el("text", { x: x + c / 2, y: y + c * 0.62, "text-anchor": "middle", class: win ? "win" : ok || makes ? "on" : "" }, fmt(v));
    }));

    const xs = [...new Set(solutions)];
    document.getElementById("tag").textContent = xs.length === 0
      ? "no outlined cell makes " + fmt(E.target) + ": no solution"
      : xs.length === 1 ? `one outlined cell makes ${fmt(E.target)}: x = ${fmt(xs[0])}`
      : `${xs.length} outlined cells make ${fmt(E.target)}: x = ${xs.map(fmt).join(" or x = ")}`;
    svg.setAttribute("aria-label", `${E.op === "+" ? "Addition" : "Times"} table for −4 to 4. ${document.getElementById("tag").textContent}`);
  }

  document.querySelectorAll(".choices button").forEach((b, i) => b.addEventListener("click", () => {
    document.querySelectorAll(".choices button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    pick = i;
    render();
  }));

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 60); });
  render();
</script>
</body>
</html>
