<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Two test waves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../eeg/widget-base.css" />
<style>
  .widget { --wave: #7aa7ff; --test: #7fcf9a; --prod: #f2d45c; --neg: #ff5a5f; }
  .baseline { stroke: var(--dim); stroke-width: 1; }
  path.line { fill: none; }
  .wave { stroke: var(--wave); stroke-width: 1.6; }
  .ghost { stroke: var(--test); stroke-width: 1.2; stroke-opacity: 0.55; }
  .prod { stroke: var(--prod); stroke-width: 1.4; }
  .fpos { fill: var(--test); fill-opacity: 0.18; } .fneg { fill: var(--neg); fill-opacity: 0.18; }
  .avg { stroke: var(--prod); stroke-width: 1.3; stroke-dasharray: 4 4; }
  svg text { font-size: 12px; font-family: "IBM Plex Mono", monospace; }
  text.w { fill: var(--wave); } text.t { fill: var(--test); } text.num { text-anchor: end; fill: var(--prod); }
  .readout { text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: var(--ink); margin-top: 0.5rem; line-height: 1.7; }
  .readout b { font-weight: 400; color: var(--prod); }
</style>
</head>
<body>
<div class="widget">
  <svg viewBox="0 0 440 262" role="img" aria-label="A 2 hertz wave of 3 microvolts whose phase can be changed, multiplied by a sine test wave and by a cosine test wave, both at 2 hertz. Each product's average changes with the phase, but together they always recover the amplitude, 3 microvolts, and the phase.">
    <text class="w" x="0" y="12" id="wlab"></text>
    <line class="baseline" x1="0" x2="440" y1="49" y2="49" /><path class="line wave" id="wave" />
    <text class="t" x="0" y="98">× sine test wave</text><text class="num" id="as" x="440" y="98"></text>
    <path class="fpos" id="p1" /><path class="fneg" id="n1" />
    <line class="baseline" x1="0" x2="440" y1="135" y2="135" /><path class="line ghost" id="g1" /><path class="line prod" id="q1" /><line class="avg" id="v1" x1="0" x2="440" />
    <text class="t" x="0" y="186">× cosine test wave</text><text class="num" id="ac" x="440" y="186"></text>
    <path class="fpos" id="p2" /><path class="fneg" id="n2" />
    <line class="baseline" x1="0" x2="440" y1="223" y2="223" /><path class="line ghost" id="g2" /><path class="line prod" id="q2" /><line class="avg" id="v2" x1="0" x2="440" />
  </svg>
  <input type="range" id="ph" min="0" max="360" step="5" value="0" aria-label="Phase of the wave" />
  <p class="readout">amplitude 2 × √(sine² + cosine²) = <b id="amp"></b><br>phase <b id="phs"></b></p>
</div>
<script src="../eeg/widget-base.js"></script>
<script>
  // The wave is 3 sin(2π·2t + φ). Test waves have amplitude 1 at 2 Hz. One second, drawn at one scale.
  const $ = id => document.getElementById(id), N = 1200, W = 440, F = 2, A = 3, S = 9;
  const line = (fn, mid) => { let d = ""; for (let i = 0; i <= W; i++) d += (i ? " L" : "M") + i + "," + (mid - S * fn(i / W)).toFixed(1); return d; };
  function shade(fn, mid, pid, nid) {
    let dp = `M0,${mid}`, dn = `M0,${mid}`;
    for (let i = 0; i <= W; i++) { const v = fn(i / W); dp += ` L${i},${(mid - S * Math.max(0, v)).toFixed(1)}`; dn += ` L${i},${(mid - S * Math.min(0, v)).toFixed(1)}`; }
    $(pid).setAttribute("d", dp + ` L${W},${mid} Z`); $(nid).setAttribute("d", dn + ` L${W},${mid} Z`);
  }
  const sn = t => Math.sin(2 * Math.PI * F * t), cs = t => Math.cos(2 * Math.PI * F * t);
  $("g1").setAttribute("d", line(sn, 135)); $("g2").setAttribute("d", line(cs, 223));
  function draw() {
    const deg = $("ph").valueAsNumber, phi = deg * Math.PI / 180;
    const wave = t => A * Math.sin(2 * Math.PI * F * t + phi);
    const ps = t => wave(t) * sn(t), pc = t => wave(t) * cs(t);
    $("wlab").textContent = `2 Hz · 3 µV · phase ${deg}°`;
    $("wave").setAttribute("d", line(wave, 49));
    $("q1").setAttribute("d", line(ps, 135)); $("q2").setAttribute("d", line(pc, 223));
    shade(ps, 135, "p1", "n1"); shade(pc, 223, "p2", "n2");
    let s = 0, c = 0; for (let n = 0; n < N; n++) { s += ps(n / N); c += pc(n / N); } s /= N; c /= N;
    $("v1").setAttribute("y1", 135 - S * s); $("v1").setAttribute("y2", 135 - S * s);
    $("v2").setAttribute("y1", 223 - S * c); $("v2").setAttribute("y2", 223 - S * c);
    const fm = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2);
    $("as").textContent = "average " + fm(s); $("ac").textContent = "average " + fm(c);
    $("amp").textContent = (2 * Math.hypot(s, c)).toFixed(2) + " µV";
    let a = Math.atan2(c, s) * 180 / Math.PI; if (a < 0) a += 360; if (Math.abs(a - 360) < 0.5) a = 0;
    $("phs").textContent = Math.round(a) + "°";
  }
  $("ph").addEventListener("input", draw);
  draw();
</script>
</body>
</html>
