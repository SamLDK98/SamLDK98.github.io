<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Splitting the product wave into parts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../eeg/widget-base.css" />
<style>
  .widget { --cx: #7aa7ff; --tst: #7fcf9a; --prod: #f2d45c; }
  .baseline { stroke: var(--dim); stroke-width: 1; }
  path.line { fill: none; }
  .cx { stroke: var(--cx); stroke-width: 1.6; } .tst { stroke: var(--tst); stroke-width: 1.6; }
  .pp { stroke: var(--prod); stroke-width: 1.3; stroke-opacity: 0.75; } .pr { stroke: var(--prod); stroke-width: 1.8; }
  .cursor { stroke: var(--ink); stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 3 3; }
  svg text { font-size: 12px; font-family: "IBM Plex Mono", monospace; }
  text.c { fill: var(--cx); } text.t { fill: var(--tst); } text.p { fill: var(--prod); }
  text.v { text-anchor: end; }
  .readout { text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: var(--ink); margin-top: 0.5rem; }
  .readout b { font-weight: 400; color: var(--prod); }
  .ends { display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--dim); }
</style>
</head>
<body>
<div class="widget">
  <svg viewBox="0 0 440 458" role="img" aria-label="The complex wave's two parts, a 3 microvolt wave at 2 hertz and a 2 microvolt wave at 5 hertz, the 3 hertz test wave, each part multiplied by the test wave, and those two products added together, which gives the product wave. A movable line marks one moment and shows the values there: the two products always add up to the product wave." id="svg"></svg>
  <input type="range" id="t" min="0" max="1" step="0.002" value="0.07" aria-label="Moment along the wave" />
  <div class="ends"><span>0 s</span><span>1 s</span></div>
  <p class="readout">averages <b id="avg"></b></p>
</div>
<script src="../eeg/widget-base.js"></script>
<script>
  // Complex wave = 3 sin(2π·2t) + 2 sin(2π·5t). Test wave = sin(2π·3t). One second, all drawn at the same scale.
  const $ = id => document.getElementById(id), W = 440, S = 9, NS = "http://www.w3.org/2000/svg";
  const p1 = t => 3 * Math.sin(2 * Math.PI * 2 * t), p2 = t => 2 * Math.sin(2 * Math.PI * 5 * t);
  const tst = t => Math.sin(2 * Math.PI * 3 * t);
  const q1 = t => p1(t) * tst(t), q2 = t => p2(t) * tst(t), pr = t => q1(t) + q2(t);
  const rows = [
    { fn: p1, label: "2 Hz part", cls: "cx", tc: "c", y: 12, mid: 49 },
    { fn: p2, label: "5 Hz part", cls: "cx", tc: "c", y: 98, mid: 126 },
    { fn: tst, label: "test wave · 3 Hz", cls: "tst", tc: "t", y: 166, mid: 185 },
    { fn: q1, label: "2 Hz part × test", cls: "pp", tc: "p", y: 216, mid: 253 },
    { fn: q2, label: "5 Hz part × test", cls: "pp", tc: "p", y: 302, mid: 330 },
    { fn: pr, label: "added = product wave", cls: "pr", tc: "p", y: 370, mid: 415 },
  ];
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; $("svg").appendChild(e); return e; };
  const line = (fn, mid) => { let d = ""; for (let i = 0; i <= W; i++) d += (i ? " L" : "M") + i + "," + (mid - S * fn(i / W)).toFixed(1); return d; };
  rows.forEach(r => {
    el("text", { x: 0, y: r.y, class: r.tc }, r.label);
    r.val = el("text", { x: W, y: r.y, class: r.tc + " v" });
    el("line", { class: "baseline", x1: 0, x2: W, y1: r.mid, y2: r.mid });
    el("path", { class: "line " + r.cls, d: line(r.fn, r.mid) });
  });
  const cur = el("line", { class: "cursor", y1: 0, y2: 458 });
  rows.forEach(r => { r.dot = el("circle", { r: 3.5, class: r.tc }); r.dot.style.fill = getComputedStyle(document.querySelector(".widget")).getPropertyValue(r.tc === "c" ? "--cx" : r.tc === "t" ? "--tst" : "--prod"); });
  const fmt = v => (Math.abs(v) < 0.005 ? "0.00" : (v > 0 ? "+" : "−") + Math.abs(v).toFixed(2));
  function draw() {
    const t = $("t").valueAsNumber, x = t * W;
    cur.setAttribute("x1", x); cur.setAttribute("x2", x);
    rows.forEach(r => { const v = r.fn(t); r.dot.setAttribute("cx", x); r.dot.setAttribute("cy", r.mid - S * v); r.val.textContent = fmt(v); });
    rows[5].val.textContent = `${fmt(q1(t))} ${q2(t) < 0 ? "−" : "+"} ${Math.abs(q2(t)).toFixed(2)} = ${fmt(pr(t))}`;
  }
  let a1 = 0, a2 = 0; const N = 2000; for (let n = 0; n < N; n++) { a1 += q1(n / N); a2 += q2(n / N); } a1 /= N; a2 /= N;
  const z = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2);
  $("avg").textContent = `${z(a1)} + ${z(a2)} = ${z(a1 + a2)}`;
  $("t").addEventListener("input", draw);
  draw();
</script>
</body>
</html>
