<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive apps by Sam Kirwan." />
  <title>Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090b;
      --text: #f4f5f8;
      --muted: rgba(235, 238, 246, 0.5);
    }

    html, body { min-height: 100%; }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 46%, rgba(145, 111, 255, 0.07), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(40rem, calc(100% - 2rem));
      margin-left: clamp(2rem, 11vw, 10rem);
      padding: clamp(3rem, 10vh, 6rem) 0;
      text-align: left;
    }

    h1 {
      font-size: clamp(3rem, 7vw, 5.4rem);
      font-weight: 300;
      line-height: 0.96;
      letter-spacing: -0.045em;
    }

    a {
      display: inline-block;
      margin-top: clamp(2.4rem, 7vh, 4.5rem);
      color: var(--text);
      font-size: clamp(1rem, 1.65vw, 1.25rem);
      font-weight: 300;
      line-height: 1.35;
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }

    a:hover,
    a:focus-visible {
      color: #dbff4a;
      outline: none;
      transform: translateX(3px);
    }

    @media (max-width: 560px) {
      main {
        width: min(25rem, calc(100% - 4rem));
        margin-left: 2rem;
      }
      h1 { font-size: clamp(3.1rem, 15vw, 4.2rem); }
      a { margin-top: 2.6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Apps</h1>
    <a href="apps/literature-review-keep-or-reject.html">Literature Review - Keep or Reject Abstracts</a>
  </main>
</body>
</html>
