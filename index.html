<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore apps, mathematics, neurophysiology, physics, and more by Sam Kirwan." />
  <title>Sam Kirwan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg: #120e0b;
      --panel: #793a24;
      --text: #ffd0a0;
      --accent: #ffd0a0;
      --muted: #fff1df;
      --border: #ad6440;
    }

    html, body { min-height: 100%; }

    body {
      min-height: 100svh;
      padding: clamp(1rem, 4vh, 3rem) 1rem;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(36rem, 100%);
      min-height: 38rem;
      padding: 3rem clamp(1.5rem, 5vw, 4rem);
      display: grid;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: linear-gradient(145deg, #944c2e 0%, var(--panel) 55%, #62301f 100%);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 222, 180, 0.09);
      text-align: center;
    }

    nav { min-width: 0; }
    ul { list-style: none; }
    .nav-level { display: grid; gap: 0.35rem; }
    .nav-level[hidden] { display: none; }

    .nav-item {
      display: inline-flex;
      min-height: 3.25rem;
      max-width: 100%;
      align-items: center;
      justify-content: center;
      padding: 0.35rem 0.5rem;
      border: 0;
      border-radius: 2px;
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: clamp(1.65rem, 3.2vw, 2.15rem);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: -0.035em;
      text-decoration: none;
      transition: color 180ms ease;
    }

    a.nav-item:hover,
    button.nav-item:hover { color: var(--text); }

    a.nav-item:focus-visible,
    button.nav-item:focus-visible {
      color: var(--text);
      outline: 1px solid var(--accent);
      outline-offset: 4px;
    }

    button.nav-item { cursor: pointer; }

    .back-button {
      margin-bottom: 0.65rem;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .unavailable { color: #d3ac93; cursor: default; }

    @media (max-width: 560px) {
      main { min-height: 34rem; padding-block: 2rem; }
      .nav-level { gap: 0.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-item { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-label="Sam Kirwan homepage">
    <nav aria-label="Sections">
      <ul class="nav-level" data-level="home">
        <li><a class="nav-item" href="apps.html">Apps</a></li>
        <li><a class="nav-item" href="eeg.html">EEG</a></li>
        <li><button class="nav-item" type="button" data-open-level="math">Math</button></li>
        <li><a class="nav-item" href="neurophysiology.html">Neurophysiology</a></li>
        <li><button class="nav-item" type="button" data-open-level="physics">Physics</button></li>
        <li><button class="nav-item" type="button" data-open-level="random">Random</button></li>
      </ul>

      <ul class="nav-level" data-level="math" hidden>
        <li><a class="nav-item back-button" href="index.html" aria-label="Back to homepage">Back</a></li>
        <li><a class="nav-item" href="numbers.html">Numbers</a></li>
        <li><a class="nav-item" href="trigonometry.html">Trigonometry</a></li>
        <li><a class="nav-item" href="complex-numbers.html">Complex Numbers</a></li>
        <li><a class="nav-item" href="algebra.html">Algebra</a></li>
        <li><a class="nav-item" href="functions.html">Functions</a></li>
        <li><a class="nav-item" href="calculus.html">Calculus</a></li>
        <li><a class="nav-item" href="linear-algebra.html">Linear Algebra</a></li>
      </ul>

      <ul class="nav-level" data-level="physics" hidden>
        <li><button class="nav-item back-button" type="button" data-back aria-label="Back to sections">Back</button></li>
        <li><a class="nav-item" href="field-theories.html">Field Theories</a></li>
      </ul>

      <ul class="nav-level" data-level="random" hidden>
        <li><button class="nav-item back-button" type="button" data-back aria-label="Back to sections">Back</button></li>
        <li><a class="nav-item" href="active-inference.html">Active Inference</a></li>
        <li><a class="nav-item" href="calendars.html">Calendars</a></li>
      </ul>
    </nav>
  </main>
  <script>
    const nav = document.querySelector("nav");
    const levels = [...document.querySelectorAll("[data-level]")];
    const levelNames = { home: "Sections", math: "Math chapters", physics: "Physics chapters", random: "Random chapters" };

    function showLevel(level) {
      const nextLevel = levelNames[level] ? level : "home";
      levels.forEach((list) => { list.hidden = list.dataset.level !== nextLevel; });
      nav.setAttribute("aria-label", levelNames[nextLevel]);
    }

    document.querySelectorAll("[data-open-level]").forEach((button) => {
      button.addEventListener("click", () => {
        const level = button.dataset.openLevel;
        showLevel(level);
        history.pushState({ level }, "", `#${level}`);
      });
    });

    document.querySelectorAll("[data-back]").forEach((button) => {
      button.addEventListener("click", () => {
        if (location.hash) history.back();
        else showLevel("home");
      });
    });

    addEventListener("popstate", () => showLevel(location.hash.slice(1)));
    showLevel(location.hash.slice(1));
  </script>
</body>
</html>
