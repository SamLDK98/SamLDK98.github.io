<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive explanations by Sam Kirwan." />
  <title>Interactive Explanations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08090b;
      --text: #f4f5f8;
      --muted: rgba(235, 238, 246, 0.5);
    }

    html, body { min-height: 100%; }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(32rem, calc(100% - 2rem));
      padding: clamp(3rem, 10vh, 6rem) 0;
      text-align: center;
    }

    h1 {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(3rem, 7vw, 5.4rem);
      font-weight: 300;
      line-height: 0.96;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    nav { margin-top: clamp(2.4rem, 7vh, 4.5rem); }

    ul { list-style: none; }

    .nav-level > li + li { margin-top: 0.65rem; }

    .nav-item {
      display: inline-block;
      color: var(--muted);
      background: none;
      border: 0;
      font-size: clamp(1rem, 1.65vw, 1.25rem);
      font-family: inherit;
      font-weight: 300;
      line-height: 1.35;
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }

    a.nav-item:hover,
    a.nav-item:focus-visible,
    button.nav-item:hover,
    button.nav-item:focus-visible {
      color: var(--text);
      outline: none;
      transform: translateY(-1px);
    }

    button.nav-item { cursor: pointer; }

    .nav-level[hidden] { display: none; }

    .back-button {
      margin-bottom: 0.35rem;
      font-size: clamp(1.15rem, 1.8vw, 1.35rem);
    }

    .unavailable { cursor: default; }

    @media (max-height: 720px) and (min-width: 600px) {
      main { padding-block: 2rem 8rem; }
      nav { margin-top: 2rem; }
      .nav-level > li + li { margin-top: 0.4rem; }
    }

    @media (max-width: 560px) {
      main { width: min(25rem, calc(100% - 2rem)); }
      h1 { font-size: clamp(3.1rem, 15vw, 4.2rem); }
      nav { margin-top: 2.6rem; }
      .nav-level > li + li { margin-top: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-item { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Interactive Explanations</h1>
    <nav aria-label="Sections">
      <ul class="nav-level" data-level="home">
        <li><a class="nav-item" href="apps.html">Apps</a></li>
        <li><span class="nav-item unavailable" aria-disabled="true">EEG</span></li>
        <li><button class="nav-item" type="button" data-open-level="math">Math</button></li>
        <li><a class="nav-item" href="neurophysiology.html">Neurophysiology</a></li>
        <li><button class="nav-item" type="button" data-open-level="physics">Physics</button></li>
        <li><button class="nav-item" type="button" data-open-level="random">Random</button></li>
      </ul>

      <ul class="nav-level" data-level="math" hidden>
        <li><button class="nav-item back-button" type="button" data-back aria-label="Back to sections">←</button></li>
        <li><a class="nav-item" href="numbers.html">Numbers</a></li>
        <li><a class="nav-item" href="trigonometry.html">Trigonometry</a></li>
        <li><a class="nav-item" href="complex-numbers.html">Complex Numbers</a></li>
        <li><a class="nav-item" href="algebra.html">Algebra</a></li>
        <li><a class="nav-item" href="linear-algebra.html">Linear Algebra</a></li>
      </ul>

      <ul class="nav-level" data-level="physics" hidden>
        <li><button class="nav-item back-button" type="button" data-back aria-label="Back to sections">←</button></li>
        <li><a class="nav-item" href="field-theories.html">Field Theories</a></li>
      </ul>

      <ul class="nav-level" data-level="random" hidden>
        <li><button class="nav-item back-button" type="button" data-back aria-label="Back to sections">←</button></li>
        <li><a class="nav-item" href="active-inference.html">Active Inference</a></li>
        <li><a class="nav-item" href="calendars.html">Calendars</a></li>
      </ul>
    </nav>
  </main>
  <script>
    const nav = document.querySelector("nav");
    const levels = [...document.querySelectorAll("[data-level]")];
    const levelNames = { home: "Sections", math: "Math chapters", physics: "Physics chapters", random: "Random chapters" };

    function showLevel(level) {
      const nextLevel = levelNames[level] ? level : "home";
      levels.forEach((list) => { list.hidden = list.dataset.level !== nextLevel; });
      nav.setAttribute("aria-label", levelNames[nextLevel]);
    }

    document.querySelectorAll("[data-open-level]").forEach((button) => {
      button.addEventListener("click", () => {
        const level = button.dataset.openLevel;
        showLevel(level);
        history.pushState({ level }, "", `#${level}`);
      });
    });

    document.querySelectorAll("[data-back]").forEach((button) => {
      button.addEventListener("click", () => {
        if (location.hash) history.back();
        else showLevel("home");
      });
    });

    addEventListener("popstate", () => showLevel(location.hash.slice(1)));
    showLevel(location.hash.slice(1));
  </script>
</body>
</html>
