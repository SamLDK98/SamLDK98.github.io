<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cutting the curve at halfway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Spectral:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../eeg/widget-base.css" />
<style>
  .base { stroke: var(--dim); stroke-width: 1; }
  .ruler { stroke: var(--ink); stroke-opacity: 0.6; stroke-width: 1.2; stroke-dasharray: 2 3; }
  .cut { stroke: var(--ink); stroke-opacity: 0.55; stroke-dasharray: 5 4; stroke-width: 1.2; }
  path { fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .leg { stroke: var(--ink); }
  svg text.a { fill: var(--amp); } svg text.b { fill: var(--ink); fill-opacity: 0.8; }
  .ends { display: flex; justify-content: space-between; width: min(100%, 420px); margin: 0.2rem auto 0;
    font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: var(--ink); }
</style>
</head>
<body>
<div class="widget">
  <svg viewBox="0 0 440 230" role="img" aria-label="One hump of the flipped wave. Sliding draws a line from the peak to the centre line, marks its halfway point, and cuts the curve there: the part above halfway turns orange. The two steep pieces below slide together into an upside-down V, then every piece flattens into a horizontal line that keeps its width. The orange line from above halfway is two-thirds of the width; the line from below is one-third.">
    <line class="base" id="base" x1="60" x2="380" y1="200" y2="200" />
    <line class="ruler" id="ruler" x1="230" x2="230" y1="50" y2="50" />
    <line class="cut" id="cut" x1="60" x2="60" y1="125" y2="125" />
    <text id="cutlab" x="56" y="129" text-anchor="end">halfway</text>
    <path class="leg" id="legL" /><path class="leg" id="legR" />
    <path id="cap" />
    <g id="labels">
      <text class="a" id="labA" text-anchor="end">above</text>
      <text class="a" id="fracA">2/3</text>
      <text class="b" id="labB" text-anchor="end">below</text>
      <text class="b" id="fracB">1/3</text>
    </g>
  </svg>
  <input type="range" id="t" min="0" max="1" step="0.005" value="0" aria-label="Cut the curve at halfway and flatten the pieces" />
</div>
<script src="../eeg/widget-base.js"></script>
<script>
  // Stages along the slider:
  // 1 draw a line from the peak down to the centre line · 2 draw the halfway line
  // 3 the vertical line fades as the part above halfway turns orange · 4 the lower pieces join into an upside-down V
  // 5 the halfway line fades · 6 every piece flattens in place (keeping its width) as the centre line fades
  // 7 the labels appear. The top piece spans 2/3 of the width (time), the lower pieces 1/3.
  const X0 = 130, W = 200, BASE = 200, H = 150, HALF = BASE - H / 2, C = X0 + W / 2, LEGW = W / 6;
  const CAP_Y = 105, LEG_Y = 145;                       // where the flattened lines settle
  const X = u => X0 + W * u, Y = u => BASE - H * Math.sin(Math.PI * u);
  const ease = k => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
  const stage = (t, a, b) => ease(Math.min(1, Math.max(0, (t - a) / (b - a))));
  const INK = [244, 246, 255], AMP = [232, 163, 61];
  const mix = (p, q, k) => `rgb(${p.map((v, i) => Math.round(v + (q[i] - v) * k)).join(",")})`;
  const piece = (u0, u1, dx, k, barY) => {
    let d = "";
    for (let i = 0; i <= 60; i++) { const u = u0 + (u1 - u0) * i / 60, y = (1 - k) * Y(u) + k * barY;
      d += (i ? " L" : "M") + (X(u) + dx).toFixed(1) + "," + y.toFixed(1); }
    return d;
  };
  const $ = id => document.getElementById(id);
  function draw() {
    const t = $("t").valueAsNumber;
    const s1 = stage(t, 0, 0.14), s2 = stage(t, 0.14, 0.28), s3 = stage(t, 0.28, 0.42),
          s4 = stage(t, 0.42, 0.6), s5 = stage(t, 0.6, 0.68), s6 = stage(t, 0.68, 0.9), s7 = stage(t, 0.9, 1);
    // 1: the vertical line grows down from the peak
    $("ruler").setAttribute("y2", BASE - H + H * s1);
    // 2: the halfway line grows across; 3: the vertical line fades
    $("cut").setAttribute("x2", 60 + 320 * s2);
    $("ruler").style.opacity = s1 > 0 ? 1 - s3 : 0;
    $("cutlab").style.opacity = s2 * (1 - s5);
    $("cut").style.opacity = 1 - s5;
    // 3: the top piece turns orange
    $("cap").setAttribute("stroke", mix(INK, AMP, s3));
    // 4: the lower pieces slide together; 6: everything flattens in place
    const dxL = s4 * ((C - LEGW) - X0), dxR = s4 * (C - X(5 / 6));
    $("cap").setAttribute("d", piece(1 / 6, 5 / 6, 0, s6, CAP_Y));
    $("legL").setAttribute("d", piece(0, 1 / 6, dxL, s6, LEG_Y));
    $("legR").setAttribute("d", piece(5 / 6, 1, dxR, s6, LEG_Y));
    $("base").style.opacity = 1 - s6;
    // 7: labels
    $("labA").setAttribute("x", X(1 / 6) - 12); $("labA").setAttribute("y", CAP_Y + 4);
    $("fracA").setAttribute("x", X(5 / 6) + 12); $("fracA").setAttribute("y", CAP_Y + 4);
    $("labB").setAttribute("x", C - LEGW - 12); $("labB").setAttribute("y", LEG_Y + 4);
    $("fracB").setAttribute("x", C + LEGW + 12); $("fracB").setAttribute("y", LEG_Y + 4);
    $("labels").style.opacity = s7;
  }
  $("t").addEventListener("input", draw);
  draw();
</script>
</body>
</html>
