<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One number, six ways</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e11; --panel: #121216; --panel-2: #17171d;
    --line: rgba(140,165,225,0.16); --line-2: rgba(140,165,225,0.07);
    --txt: #f4f6ff; --txt-2: rgba(238,242,252,0.74); --txt-3: rgba(238,242,252,0.44);
    --ink: #e4dcc8;          /* what the marks are made of */
    --tally: #e8a33d;
    --egypt: #d9b26a;
    --rome: #c98b5e;
    --babylon: #64c8a0;
    --maya: #57b6d8;
    --arabic: #7aa7ff;
    --warn: #ff7a6b;
  }
  html, body { background: var(--bg); }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--txt); -webkit-font-smoothing: antialiased; }
  .bench { background: var(--bg); border: 1px solid var(--line); }

  .head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    padding: 11px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .head-title { font-family: "IBM Plex Mono", monospace; font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--txt-2); }
  .verdict { font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; letter-spacing: 0.08em; font-weight: 600; color: var(--arabic); font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sys { min-width: 0; padding: 11px 13px 12px; border-top: 1px solid var(--line); }
  .sys:nth-child(3n+2), .sys:nth-child(3n) { border-left: 1px solid var(--line); }
  .sys-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; }
  .sys-name { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }
  .sys-when { font-family: "IBM Plex Mono", monospace; font-size: 0.55rem; letter-spacing: 0.1em; color: var(--txt-3); }
  canvas.glyphs { display: block; width: 100%; height: 132px; margin-top: 8px; }
  .sys-foot {
    display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap;
    margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line-2);
    font-family: "IBM Plex Mono", monospace; font-size: 0.64rem; color: var(--txt-3);
  }
  .sys-foot b { color: var(--txt); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sys-note { font-family: "IBM Plex Sans", sans-serif; font-size: 0.72rem; color: var(--txt-3); line-height: 1.45; margin-top: 5px; }
  .sys-note.warn { color: var(--warn); }

  .compare { border-top: 1px solid var(--line); padding: 12px 14px 14px; }
  .cap {
    display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem; flex-wrap: wrap;
    font-family: "IBM Plex Mono", monospace; font-size: 0.58rem; letter-spacing: 0.17em;
    text-transform: uppercase; color: var(--txt-3); margin-bottom: 7px;
  }
  .cap .hint { letter-spacing: 0.08em; text-transform: none; }
  canvas#compare { height: 176px; }

  .bar { padding: 12px 16px 15px; border-top: 1px solid var(--line); display: grid; gap: 12px 20px; grid-template-columns: minmax(220px, 2fr) minmax(200px, 1fr); align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.75rem; color: var(--txt-2); gap: 0.5rem; }
  .field-label .val { font-family: "IBM Plex Mono", monospace; font-size: 0.73rem; font-weight: 600; color: var(--txt); font-variant-numeric: tabular-nums; }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: rgba(150,175,235,0.3); }
  input[type="range"]::-moz-range-track { height: 2px; background: rgba(150,175,235,0.3); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: var(--arabic); border: none; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--arabic); border: none; }
  input[type="range"]:focus-visible { outline: 2px solid var(--txt-3); outline-offset: 3px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font-family: "IBM Plex Sans", sans-serif; font-size: 0.73rem; font-weight: 500; color: var(--txt);
    background: var(--panel-2); border: 1px solid var(--line); padding: 6px 10px; cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { background: #1c1c24; border-color: rgba(150,180,255,0.4); }
  button:focus-visible { outline: 2px solid var(--txt-3); outline-offset: 2px; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sys:nth-child(3n+2), .sys:nth-child(3n) { border-left: 0; }
    .sys:nth-child(2n) { border-left: 1px solid var(--line); }
  }
  @media (max-width: 620px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .sys:nth-child(n) { border-left: 0; }
    .bar { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="bench">
  <div class="head">
    <span class="head-title">One number, six ways</span>
    <span class="verdict" id="verdict">1,999</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="compare">
    <div class="cap">
      <span>Marks needed to write it</span>
      <span class="hint">logarithmic — the tally bar would otherwise be a mile long</span>
    </div>
    <canvas id="compare" aria-label="A logarithmic comparison of how many marks each system needs to write the chosen number."></canvas>
  </div>

  <div class="bar">
    <div class="field">
      <label class="field-label" for="n"><span>The number</span><span class="val" id="n-val">1,999</span></label>
      <input type="range" id="n" min="1" max="3999" step="1" value="1999" />
    </div>
    <div class="field">
      <span class="field-label"><span>Try</span></span>
      <div class="btns">
        <button type="button" data-n="7">7</button>
        <button type="button" data-n="19">19</button>
        <button type="button" data-n="60">60</button>
        <button type="button" data-n="365">365</button>
        <button type="button" data-n="1000">1000</button>
        <button type="button" data-n="3999">3999</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================================================================
     1. The conversions. Each returns the marks to draw, so the count
        printed under a panel is counted from the glyphs themselves
        and cannot drift away from the drawing.
     ================================================================ */

  const digitsIn = (n, base) => {
    if (n === 0) return [0];
    const d = [];
    while (n > 0) { d.unshift(n % base); n = Math.floor(n / base); }
    return d;
  };

  const ROMAN = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
                 [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  function toRoman(n) {
    let out = "";
    for (const [v, s] of ROMAN) while (n >= v) { out += s; n -= v; }
    return out;
  }

  // Egyptian: a sign per power of ten, repeated as many times as needed.
  function toEgyptian(n) {
    const out = [];
    for (const [v, g] of [[1000,"lotus"],[100,"rope"],[10,"heel"],[1,"stroke"]]) {
      const k = Math.floor(n / v); n -= k * v;
      if (k) out.push({ glyph: g, count: k, power: v });
    }
    return out;
  }

  // Babylonian: base 60, and each sexagesimal digit is itself written
  // additively — corner wedges for tens, vertical wedges for ones.
  function toBabylonian(n) {
    return digitsIn(n, 60).map((d) => ({ tens: Math.floor(d / 10), ones: d % 10, value: d }));
  }

  // Maya: pure base 20 (the calendar round used 18 in the second place;
  // this is the arithmetic form). Bars of five, dots of one, shell for zero.
  function toMaya(n) {
    return digitsIn(n, 20).map((d) => ({ bars: Math.floor(d / 5), dots: d % 5, value: d }));
  }

  const SYSTEMS = [
    {
      key: "tally", name: "Tally", when: "from c. 40,000 BCE", colour: "--tally",
      symbols: "1 symbol", note: "The length of the record is the number. Beyond a few dozen it is unreadable and uncheckable.",
      marks: (n) => n
    },
    {
      key: "egypt", name: "Egyptian", when: "c. 3,000 BCE", colour: "--egypt",
      symbols: "1 symbol per power of ten", note: "Grouping fixes readability. But every new power of ten needs a brand-new sign invented for it.",
      marks: (n) => toEgyptian(n).reduce((a, g) => a + g.count, 0)
    },
    {
      key: "rome", name: "Roman", when: "c. 500 BCE", colour: "--rome",
      symbols: "7 symbols", note: "Subtractive pairs shorten it — IV, IX, XL — at the price of order mattering. It runs out at 3,999.",
      marks: (n) => toRoman(n).length
    },
    {
      key: "babylon", name: "Babylonian", when: "c. 2,000 BCE", colour: "--babylon",
      symbols: "2 symbols, base 60", note: "The first positional system: place carries the power of 60. With no zero, an empty place was only a gap.",
      warnAt: (n) => digitsIn(n, 60).length > 1 && digitsIn(n, 60).some((d) => d === 0),
      warn: "An empty place here. Written as a gap, this is genuinely ambiguous — the reader has to guess the size.",
      marks: (n) => toBabylonian(n).reduce((a, d) => a + d.tens + d.ones, 0)
    },
    {
      key: "maya", name: "Maya", when: "c. 100 BCE", colour: "--maya",
      symbols: "3 symbols, base 20", note: "Positional, and with a written zero — the shell — so an empty place is stated rather than left blank.",
      marks: (n) => toMaya(n).reduce((a, d) => a + (d.value === 0 ? 1 : d.bars + d.dots), 0)
    },
    {
      key: "arabic", name: "Hindu–Arabic", when: "c. 500 CE", colour: "--arabic",
      symbols: "10 symbols, base 10", note: "Ten signs, one of them zero, and position doing all the rest of the work. Any number at all, at a glance.",
      marks: (n) => String(n).length
    }
  ];

  /* ================================================================
     2. Drawing
     ================================================================ */

  const $ = (id) => document.getElementById(id);
  const css = getComputedStyle(document.documentElement);
  const C = {};
  for (const k of ["ink","tally","egypt","rome","babylon","maya","arabic","warn","line","line-2","txt","txt-2","txt-3","bg","panel-2"]) {
    C[k.replace("-2","2").replace("-3","3")] = css.getPropertyValue("--" + k).trim();
  }
  const commas = (n) => n.toLocaleString("en-GB");
  const canvases = {};

  function fit(id) {
    const cv = $(id); if (!cv) return null;
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvases[id] = { cv, ctx, w: r.width, h: r.height };
    return canvases[id];
  }
  function mono(ctx, px, weight) { ctx.font = (weight || 500) + " " + px + 'px "IBM Plex Mono", monospace'; }
  function sans(ctx, px, weight) { ctx.font = (weight || 500) + " " + px + 'px "IBM Plex Sans", sans-serif'; }

  const TALLY_CAP = 120;

  function drawTally(ctx, w, h, n) {
    const shown = Math.min(n, TALLY_CAP);
    const groups = Math.ceil(shown / 5);
    const perRow = Math.max(3, Math.floor((w - 10) / 26));
    const rows = Math.ceil(groups / perRow);
    const gw = Math.min(26, (w - 10) / perRow);
    const gh = Math.min(26, (h - 26) / Math.max(rows, 1));
    const markH = Math.max(9, gh * 0.72);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.lineCap = "round";
    let drawn = 0;
    for (let g = 0; g < groups; g += 1) {
      const gx = 5 + (g % perRow) * gw, gy = 8 + Math.floor(g / perRow) * gh;
      const inGroup = Math.min(5, shown - g * 5);
      for (let k = 0; k < Math.min(4, inGroup); k += 1) {
        const x = gx + 3 + k * (gw * 0.17);
        ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy + markH); ctx.stroke();
        drawn += 1;
      }
      if (inGroup === 5) {                       // the fifth mark strikes through
        ctx.beginPath();
        ctx.moveTo(gx + 1, gy + markH * 0.85);
        ctx.lineTo(gx + 3 + 3.4 * (gw * 0.17), gy + markH * 0.15);
        ctx.stroke();
        drawn += 1;
      }
    }
    if (n > shown) {
      ctx.fillStyle = C.warn; mono(ctx, 10, 600);
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText("… and " + commas(n - shown) + " more marks, off the panel", w / 2, h - 3);
    }
    return drawn;
  }

  // the four Egyptian signs, drawn at a given size
  function egyptGlyph(ctx, cx, cy, s, glyph) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.lineJoin = "round";
    ctx.beginPath();
    if (glyph === "stroke") { ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s); }
    else if (glyph === "heel") { ctx.moveTo(cx - s * 0.8, cy + s * 0.5); ctx.quadraticCurveTo(cx, cy - s * 1.05, cx + s * 0.8, cy + s * 0.5); }
    else if (glyph === "rope") {
      for (let a = 0; a < 6.2832 * 1.5; a += 0.16) {
        const rr = s * 0.22 + a * s * 0.08;
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.9;
        a ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
    } else {                                   // lotus: a stem, a cup, two petals
      ctx.moveTo(cx, cy + s); ctx.lineTo(cx, cy - s * 0.1);
      ctx.moveTo(cx - s * 0.5, cy - s * 0.35);
      ctx.quadraticCurveTo(cx, cy + s * 0.45, cx + s * 0.5, cy - s * 0.35);
      ctx.moveTo(cx - s * 0.75, cy - s * 0.95);
      ctx.quadraticCurveTo(cx - s * 0.5, cy + s * 0.1, cx, cy - s * 0.1);
      ctx.quadraticCurveTo(cx + s * 0.5, cy + s * 0.1, cx + s * 0.75, cy - s * 0.95);
      ctx.moveTo(cx, cy - s * 1.05); ctx.lineTo(cx, cy - s * 0.1);
    }
    ctx.stroke();
  }

  function drawEgyptian(ctx, w, h, n) {
    const groups = toEgyptian(n);
    if (!groups.length) return 0;
    const rowH = (h - 16) / groups.length;
    const s = Math.min(9, rowH * 0.3);
    let drawn = 0;
    groups.forEach((g, gi) => {
      const y = 10 + rowH * (gi + 0.5);
      const perRow = Math.max(1, Math.floor((w - 46) / (s * 2.5)));
      for (let k = 0; k < g.count; k += 1) {
        const cx = 42 + (k % perRow) * s * 2.5 + s;
        const cy = y + Math.floor(k / perRow) * s * 1.6 - (g.count > perRow ? s * 0.6 : 0);
        egyptGlyph(ctx, cx, cy, s, g.glyph);
        drawn += 1;
      }
      ctx.fillStyle = C.txt3; mono(ctx, 8.5, 500);
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("×" + commas(g.power), 5, y);
    });
    return drawn;
  }

  function drawRoman(ctx, w, h, n) {
    const s = toRoman(n);
    let px = Math.min(40, (w - 16) / Math.max(s.length, 1) * 1.55);
    ctx.fillStyle = C.ink;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = '400 ' + px + 'px "Spectral", Georgia, serif';
    while (ctx.measureText(s).width > w - 14 && px > 9) {
      px -= 1; ctx.font = '400 ' + px + 'px "Spectral", Georgia, serif';
    }
    ctx.fillText(s, w / 2, h * 0.45);
    ctx.fillStyle = C.txt3; mono(ctx, 9, 500);
    ctx.fillText(s.length + " letters", w / 2, h * 0.82);
    return s.length;
  }

  // Babylonian wedges: a vertical wedge for one, a corner wedge for ten.
  function wedgeOne(ctx, x, y, s) {
    ctx.fillStyle = C.ink;
    ctx.beginPath();
    ctx.moveTo(x, y + s);                    // the point, driven downward
    ctx.lineTo(x - s * 0.34, y - s * 0.75);
    ctx.lineTo(x + s * 0.34, y - s * 0.75);
    ctx.closePath(); ctx.fill();
  }
  function wedgeTen(ctx, x, y, s) {
    ctx.fillStyle = C.ink;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.9, y - s * 0.35);   // a corner opening to the left
    ctx.lineTo(x + s * 0.55, y - s * 0.8);
    ctx.lineTo(x + s * 0.2, y + s * 0.1);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - s * 0.9, y - s * 0.35);
    ctx.lineTo(x + s * 0.5, y + s * 0.75);
    ctx.lineTo(x + s * 0.1, y + s * 0.1);
    ctx.closePath(); ctx.fill();
  }

  function drawBabylonian(ctx, w, h, n) {
    const digits = toBabylonian(n);
    const cellW = (w - 10) / digits.length;
    const s = Math.max(4, Math.min(7, cellW * 0.075));
    let drawn = 0;
    digits.forEach((d, di) => {
      const x0 = 5 + cellW * di;
      const cx = x0 + cellW / 2;
      if (di > 0) {
        ctx.strokeStyle = C.line2; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x0, 6); ctx.lineTo(x0, h - 22); ctx.stroke();
      }
      ctx.fillStyle = C.txt3; mono(ctx, 8, 500);
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      const power = Math.pow(60, digits.length - 1 - di);
      ctx.fillText(power === 1 ? "units" : "×" + commas(power), cx, h - 6);

      if (d.value === 0) {                     // the gap the Babylonians left
        ctx.strokeStyle = C.warn; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.strokeRect(x0 + cellW * 0.18, h * 0.22, cellW * 0.64, h * 0.4);
        ctx.setLineDash([]);
        ctx.fillStyle = C.warn; mono(ctx, 11, 600);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("?", cx, h * 0.42);
        return;
      }
      // tens on the upper line, ones below, as the scribes packed them
      const tensPerRow = 3, onesPerRow = 3;
      for (let k = 0; k < d.tens; k += 1) {
        wedgeTen(ctx, x0 + cellW * 0.22 + (k % tensPerRow) * s * 2.4,
                 h * 0.26 + Math.floor(k / tensPerRow) * s * 2.2, s);
        drawn += 1;
      }
      for (let k = 0; k < d.ones; k += 1) {
        wedgeOne(ctx, x0 + cellW * 0.2 + (k % onesPerRow) * s * 1.7,
                 h * 0.62 + Math.floor(k / onesPerRow) * s * 2.1, s);
        drawn += 1;
      }
    });
    return drawn;
  }

  function drawMaya(ctx, w, h, n) {
    const digits = toMaya(n);
    const rowH = (h - 8) / digits.length;
    const bw = Math.min(46, w * 0.34);
    let drawn = 0;
    digits.forEach((d, di) => {
      const cy = 4 + rowH * (di + 0.5);
      const cx = w * 0.56;
      if (di > 0) {                            // the places are stacked, so say where each begins
        ctx.strokeStyle = C.line2; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(5, 4 + rowH * di); ctx.lineTo(w - 5, 4 + rowH * di); ctx.stroke();
      }
      ctx.fillStyle = C.txt3; mono(ctx, 8, 500);
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      const power = Math.pow(20, digits.length - 1 - di);
      ctx.fillText(power === 1 ? "units" : "×" + commas(power), 5, cy);

      if (d.value === 0) {                     // the shell: a written zero
        ctx.strokeStyle = C.maya; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.ellipse(cx, cy, bw * 0.34, rowH * 0.26, 0, 0, 6.2832); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - bw * 0.2, cy + rowH * 0.06);
        ctx.quadraticCurveTo(cx, cy - rowH * 0.14, cx + bw * 0.2, cy + rowH * 0.06);
        ctx.stroke();
        drawn += 1;
        return;
      }
      const unitH = Math.min(7, rowH * 0.2);
      let y = cy + rowH * 0.3;
      ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(2.5, unitH * 0.45);
      for (let k = 0; k < d.bars; k += 1) {     // bars of five, stacked
        ctx.beginPath(); ctx.moveTo(cx - bw / 2, y); ctx.lineTo(cx + bw / 2, y); ctx.stroke();
        y -= unitH * 1.5; drawn += 1;
      }
      ctx.fillStyle = C.ink;
      for (let k = 0; k < d.dots; k += 1) {     // dots of one, on top
        const dx = cx + (k - (d.dots - 1) / 2) * (bw * 0.22);
        ctx.beginPath(); ctx.arc(dx, y - unitH * 0.2, Math.max(2.5, unitH * 0.36), 0, 6.2832); ctx.fill();
        drawn += 1;
      }
    });
    return drawn;
  }

  function drawArabic(ctx, w, h, n) {
    const s = String(n);
    const cellW = Math.min(46, (w - 10) / s.length);
    const startX = w / 2 - (cellW * s.length) / 2;
    s.split("").forEach((ch, i) => {
      const cx = startX + cellW * (i + 0.5);
      ctx.fillStyle = C.ink;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = '400 ' + Math.min(40, cellW * 0.95) + 'px "IBM Plex Mono", monospace';
      ctx.fillText(ch, cx, h * 0.42);
      ctx.fillStyle = ch === "0" ? C.arabic : C.txt3;
      mono(ctx, 8, 500);
      const power = Math.pow(10, s.length - 1 - i);
      ctx.fillText(power === 1 ? "units" : "×" + commas(power), cx, h * 0.74);
      ctx.fillStyle = C.txt3;
      mono(ctx, 8.5, 500);
      ctx.fillText(commas(+ch * power), cx, h * 0.88);
    });
    return s.length;
  }

  const DRAW = {
    tally: drawTally, egypt: drawEgyptian, rome: drawRoman,
    babylon: drawBabylonian, maya: drawMaya, arabic: drawArabic
  };

  /* the comparison strip, read off the same mark counts */
  /* `counts` comes from the panels that have just drawn themselves, so the
     bar and the figure above it can never report different numbers. */
  function drawCompare(counts) {
    const c = canvases.compare; if (!c) return;
    const { ctx, w, h } = c;
    ctx.clearRect(0, 0, w, h);
    const rows = SYSTEMS.map((s) => ({ s, marks: counts[s.key] }));
    const max = Math.max(...rows.map((r) => r.marks));
    const labelW = Math.min(104, w * 0.28);
    const x0 = labelW + 6, x1 = w - 58;
    const rowH = (h - 10) / rows.length;
    const scale = (m) => Math.log10(m + 1) / Math.log10(max + 1);

    rows.forEach((r, i) => {
      const y = 5 + rowH * (i + 0.5);
      const col = C[r.s.key];
      ctx.fillStyle = C.txt2; mono(ctx, 9, 500);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillText(r.s.name.toUpperCase(), labelW, y);
      const bw = Math.max(2, (x1 - x0) * scale(r.marks));
      ctx.fillStyle = col + "66";
      ctx.fillRect(x0, y - rowH * 0.28, bw, rowH * 0.56);
      ctx.fillStyle = col;
      ctx.fillRect(x0, y - rowH * 0.28, Math.min(bw, 3), rowH * 0.56);
      ctx.textAlign = "left";
      mono(ctx, 9.5, 600);
      ctx.fillText(commas(r.marks), x0 + bw + 7, y);
    });
  }

  /* ================================================================
     3. Panels and state
     ================================================================ */

  let value = 1999;

  const grid = $("grid");
  SYSTEMS.forEach((s) => {
    const cell = document.createElement("div");
    cell.className = "sys";
    cell.innerHTML =
      '<div class="sys-head"><span class="sys-name" style="color:' + C[s.key] + '">' + s.name + '</span>' +
      '<span class="sys-when">' + s.when + '</span></div>' +
      '<canvas class="glyphs" id="cv-' + s.key + '" aria-label="' + s.name + ' numerals for the chosen number"></canvas>' +
      '<div class="sys-foot"><span>' + s.symbols + '</span><span><b id="m-' + s.key + '">0</b> marks</span></div>' +
      '<div class="sys-note" id="note-' + s.key + '">' + s.note + '</div>';
    grid.appendChild(cell);
  });

  function render() {
    const counts = {};
    SYSTEMS.forEach((s) => {
      const c = canvases["cv-" + s.key]; if (!c) return;
      c.ctx.clearRect(0, 0, c.w, c.h);
      const drawn = DRAW[s.key](c.ctx, c.w, c.h, value);
      // what the panel reports is what the panel drew
      const total = s.key === "tally" ? value : drawn;
      counts[s.key] = total;
      $("m-" + s.key).textContent = commas(total);
      const note = $("note-" + s.key);
      const warn = s.warnAt && s.warnAt(value);
      note.textContent = warn ? s.warn : s.note;
      note.classList.toggle("warn", !!warn);
    });
    drawCompare(counts);
    $("verdict").textContent = commas(value);
    $("n-val").textContent = commas(value);
    $("n").value = value;
    postHeight();
  }

  $("n").addEventListener("input", (e) => { value = +e.target.value; render(); });
  document.querySelectorAll("button[data-n]").forEach((b) => {
    b.addEventListener("click", () => { value = +b.dataset.n; render(); });
  });

  function postHeight() {
    const el = document.querySelector(".bench");
    const hh = Math.ceil(el.getBoundingClientRect().height);
    if (window.parent !== window && hh > 100) window.parent.postMessage({ type: "systems-height", height: hh }, "*");
  }

  const IDS = SYSTEMS.map((s) => "cv-" + s.key).concat(["compare"]);
  function fitAll() { IDS.forEach(fit); }

  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { fitAll(); render(); }, 140);
  });
  window.addEventListener("load", () => { fitAll(); render(); setTimeout(postHeight, 250); });

  if (window.ResizeObserver) {
    let pending = false;
    const ro = new ResizeObserver(() => {
      const stale = IDS.some((id) => {
        const c = canvases[id];
        return !c || Math.abs($(id).getBoundingClientRect().width - c.w) > 1;
      });
      if (!stale || pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; fitAll(); render(); });
    });
    IDS.forEach((id) => ro.observe($(id)));
  }

  fitAll();
  render();        // one frame synchronously: never blank, no animation loop
})();
</script>
</body>
</html>
