<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The place-value machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e11; --panel: #121216; --panel-2: #17171d;
    --line: rgba(140,165,225,0.16); --line-2: rgba(140,165,225,0.07);
    --txt: #f4f6ff; --txt-2: rgba(238,242,252,0.74); --txt-3: rgba(238,242,252,0.44);
    --digit: #7aa7ff;      /* the written digit */
    --count: #e4dcc8;      /* the counters it stands for */
    --carry: #e8a33d;      /* a column that has just rolled over */
    --zero: #64c8a0;       /* the placeholder doing its job */
  }
  html, body { background: var(--bg); }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--txt); -webkit-font-smoothing: antialiased; }
  .bench { background: var(--bg); border: 1px solid var(--line); }

  .head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    padding: 11px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .head-title { font-family: "IBM Plex Mono", monospace; font-size: 0.64rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--txt-2); }
  .verdict { font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; letter-spacing: 0.08em; font-weight: 600; color: var(--digit); font-variant-numeric: tabular-nums; }

  .cell { padding: 12px 14px 14px; }
  .cap {
    display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem; flex-wrap: wrap;
    font-family: "IBM Plex Mono", monospace; font-size: 0.58rem; letter-spacing: 0.17em;
    text-transform: uppercase; color: var(--txt-3); margin-bottom: 7px;
  }
  .cap .hint { letter-spacing: 0.08em; text-transform: none; }
  canvas { display: block; width: 100%; }
  #columns { height: 236px; }

  .readout { border-top: 1px solid var(--line); padding: 11px 16px 12px; }
  .eq {
    font-family: "IBM Plex Mono", monospace; font-size: 0.86rem; line-height: 1.9;
    color: var(--txt-2); overflow-x: auto; white-space: nowrap;
  }
  .eq b { color: var(--txt); font-weight: 600; }
  .eq .z { color: var(--zero); }
  .eq .res { color: var(--digit); font-weight: 600; }
  .msg {
    margin-top: 8px; padding: 8px 10px; border-left: 2px solid var(--carry);
    background: linear-gradient(90deg, rgba(232,163,61,0.09), transparent 80%);
    font-size: 0.82rem; line-height: 1.5; color: var(--txt-2); min-height: 2.4rem;
  }
  .msg.quiet { border-left-color: var(--line); background: none; color: var(--txt-3); }
  .msg b { color: var(--txt); font-weight: 500; }

  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px;
    font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; color: var(--txt-3); }
  .stats b { color: var(--txt); font-weight: 600; font-variant-numeric: tabular-nums; }

  .bar { padding: 12px 16px 15px; border-top: 1px solid var(--line); display: grid; gap: 12px 20px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.75rem; color: var(--txt-2); gap: 0.5rem; }
  .field-label .val { font-family: "IBM Plex Mono", monospace; font-size: 0.73rem; font-weight: 600; color: var(--txt); font-variant-numeric: tabular-nums; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font-family: "IBM Plex Sans", sans-serif; font-size: 0.74rem; font-weight: 500; color: var(--txt);
    background: var(--panel-2); border: 1px solid var(--line); padding: 6px 11px; cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  button:hover { background: #1c1c24; border-color: rgba(150,180,255,0.4); }
  button:focus-visible { outline: 2px solid var(--txt-3); outline-offset: 2px; }
  button.on { border-color: var(--digit); color: var(--digit); }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: rgba(150,175,235,0.3); }
  input[type="range"]::-moz-range-track { height: 2px; background: rgba(150,175,235,0.3); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: var(--digit); border: none; }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--digit); border: none; }

  @media (max-width: 720px) { #columns { height: 256px; } }
</style>
</head>
<body>
<div class="bench">
  <div class="head">
    <span class="head-title">The place-value machine</span>
    <span class="verdict" id="verdict">365 in base 10</span>
  </div>

  <div class="cell">
    <div class="cap">
      <span>One value, one column per power</span>
      <span class="hint" id="cap-hint">each column holds at most base − 1</span>
    </div>
    <canvas id="columns" aria-label="Columns for each power of the chosen base, with the digit in each and the counters it stands for."></canvas>
  </div>

  <div class="readout">
    <div class="eq" id="eq">—</div>
    <div class="msg quiet" id="msg">Add one at a time and watch what happens when a column fills.</div>
    <div class="stats">
      <span>Symbols this base needs <b id="s-symbols">10</b></span>
      <span>Columns used <b id="s-cols">3</b></span>
      <span>Largest value these columns can hold <b id="s-max">999</b></span>
    </div>
  </div>

  <div class="bar">
    <div class="field">
      <span class="field-label"><span>Base</span><span class="val" id="base-val">10</span></span>
      <div class="btns" id="bases"></div>
    </div>
    <div class="field">
      <label class="field-label" for="v"><span>Value</span><span class="val" id="v-val">365</span></label>
      <input type="range" id="v" min="0" max="4095" step="1" value="365" />
    </div>
    <div class="field">
      <span class="field-label"><span>Step</span></span>
      <div class="btns">
        <button type="button" id="b-minus">−1</button>
        <button type="button" id="b-plus">+1</button>
        <button type="button" id="b-fill">Fill the units column</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const BASES = [2, 5, 8, 10, 16, 20, 60];
  const DIGITS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const MAXV = 4095;

  let base = 10;
  let value = 365;
  let carried = [];          // which columns rolled over on the last step
  let message = null;

  const $ = (id) => document.getElementById(id);
  const css = getComputedStyle(document.documentElement);
  const C = {};
  for (const k of ["digit","count","carry","zero","line","line-2","txt","txt-2","txt-3","bg","panel-2"]) {
    C[k.replace("-2","2").replace("-3","3")] = css.getPropertyValue("--" + k).trim();
  }
  const commas = (n) => n.toLocaleString("en-GB");

  function digitsOf(n, b) {
    if (n === 0) return [0];
    const d = [];
    while (n > 0) { d.unshift(n % b); n = Math.floor(n / b); }
    return d;
  }
  // A digit above 9 has no single sign in our alphabet; base 60 scribes had
  // the same problem and solved it by writing each place additively.
  const glyph = (d) => (d < 36 ? DIGITS[d] : String(d));
  const SUP = "\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079";
  const sup = (n) => String(n).split("").map((c) => SUP[+c]).join("");

  const canvases = {};
  function fit(id) {
    const cv = $(id), r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvases[id] = { cv, ctx, w: r.width, h: r.height };
    return canvases[id];
  }
  function mono(ctx, px, weight) { ctx.font = (weight || 500) + " " + px + 'px "IBM Plex Mono", monospace'; }
  function sans(ctx, px, weight) { ctx.font = (weight || 500) + " " + px + 'px "IBM Plex Sans", sans-serif'; }

  function drawColumns() {
    const { ctx, w, h } = canvases.columns;
    ctx.clearRect(0, 0, w, h);
    const ds = digitsOf(value, base);
    const n = ds.length;
    const padX = 8;
    const colW = (w - padX * 2) / n;
    const topY = 16, botY = h - 44;

    // counters are only drawn while they can still be told apart; above that
    // the column shows its digit alone, which is exactly the problem a big
    // base creates for a scribe
    const showCounters = base <= 20 && colW > 34;

    ds.forEach((d, i) => {
      const power = n - 1 - i;
      const x0 = padX + colW * i;
      const cx = x0 + colW / 2;
      const isCarry = carried.indexOf(power) >= 0;
      const isZero = d === 0;

      ctx.strokeStyle = isCarry ? C.carry : C.line;
      ctx.lineWidth = isCarry ? 1.6 : 1;
      ctx.strokeRect(x0 + 3, topY, colW - 6, botY - topY);
      if (isCarry) {
        ctx.fillStyle = "rgba(232,163,61,0.09)";
        ctx.fillRect(x0 + 3, topY, colW - 6, botY - topY);
      }

      // the counters this column stands for
      if (showCounters) {
        const cap = base - 1;
        const perRow = Math.max(1, Math.min(5, Math.floor((colW - 18) / 11)));
        const rows = Math.ceil(cap / perRow) || 1;
        const blockTop = topY + 56;                       // just under the digit
        const cellH = Math.min(13, Math.max(8, (botY - 10 - blockTop) / Math.max(rows, 1)));
        const r = Math.max(2.2, Math.min(4.2, cellH * 0.32));
        for (let k = 0; k < cap; k += 1) {
          const rx = x0 + colW / 2 - ((perRow - 1) * 11) / 2 + (k % perRow) * 11;
          const ry = blockTop + Math.floor(k / perRow) * cellH;
          ctx.beginPath(); ctx.arc(rx, ry, r, 0, 6.2832);
          if (k < d) { ctx.fillStyle = C.count; ctx.fill(); }
          else { ctx.strokeStyle = "rgba(228,220,200,0.18)"; ctx.lineWidth = 1; ctx.stroke(); }
        }
      }

      // the digit that records how many counters are in the column
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = isZero ? C.zero : isCarry ? C.carry : C.digit;
      mono(ctx, Math.min(38, colW * 0.6), 600);
      ctx.fillText(glyph(d), cx, topY + 30);

      ctx.fillStyle = C.txt3;
      mono(ctx, Math.min(9.5, colW * 0.16), 500);
      ctx.textBaseline = "top";
      ctx.fillText(base + sup(power), cx, botY + 6);
      ctx.fillText("×" + commas(Math.pow(base, power)), cx, botY + 19);
    });

    // what the columns cannot do on their own
    ctx.fillStyle = C.txt3;
    sans(ctx, 10.5, 500);
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText(showCounters ? "filled dot = one counter actually in the column"
                              : "base " + base + " needs " + base + " distinct signs — too many to draw as counters",
                 padX + 3, h - 4);
  }

  function renderEquation() {
    const ds = digitsOf(value, base);
    const n = ds.length;
    const parts = ds.map((d, i) => {
      const power = n - 1 - i;
      const cls = d === 0 ? ' class="z"' : "";
      return '<span' + cls + '><b>' + glyph(d) + '</b>×' + base + sup(power) + "</span>";
    });
    const sum = ds.map((d, i) => d * Math.pow(base, n - 1 - i));
    $("eq").innerHTML =
      ds.map(glyph).join("") + '<sub style="color:var(--txt-3)">' + base + "</sub>" +
      " &nbsp;=&nbsp; " + parts.join(" + ") +
      " &nbsp;=&nbsp; " + sum.map(commas).join(" + ") +
      ' &nbsp;=&nbsp; <span class="res">' + commas(value) + "</span>";
  }

  function render() {
    drawColumns();
    renderEquation();
    const ds = digitsOf(value, base);
    $("verdict").textContent = commas(value) + " in base " + base;
    $("v").value = value;
    $("v-val").textContent = commas(value);
    $("base-val").textContent = base;
    $("s-symbols").textContent = base;
    $("s-cols").textContent = ds.length;
    $("s-max").textContent = commas(Math.pow(base, ds.length) - 1);
    $("cap-hint").textContent = "each column holds at most " + (base - 1);

    const msg = $("msg");
    if (message) { msg.innerHTML = message; msg.classList.remove("quiet"); }
    else {
      msg.classList.add("quiet");
      msg.innerHTML = ds.indexOf(0) >= 0
        ? "That <b>0</b> is not nothing — it is the sign that holds a column open. Without it the digits either side would slide together."
        : "Add one at a time and watch what happens when a column fills.";
    }

    document.querySelectorAll("button[data-base]").forEach((b) => {
      b.classList.toggle("on", +b.dataset.base === base);
    });
    postHeight();
  }

  /* Stepping. The carry is worked out by comparing the digit strings before
     and after, so the highlight always matches what actually changed. */
  function step(delta) {
    const before = digitsOf(value, base);
    const next = Math.max(0, Math.min(MAXV, value + delta));
    const after = digitsOf(next, base);
    carried = [];
    if (delta > 0) {
      const bn = before.length, an = after.length;
      for (let power = 0; power < an; power += 1) {
        const bd = power < bn ? before[bn - 1 - power] : 0;
        const ad = after[an - 1 - power];
        if (ad < bd) carried.push(power);            // this column rolled over
      }
    }
    value = next;
    if (carried.length) {
      const highest = Math.max.apply(null, carried);
      message = carried.length === 1
        ? "The units column was full at <b>" + (base - 1) + "</b>. It empties to <b>0</b> and one counter moves into the <b>" + base + "s</b> column."
        : "<b>" + carried.length + " columns</b> filled at once. Each empties to <b>0</b> and passes one counter left — the carry runs all the way to the <b>" +
          commas(Math.pow(base, highest + 1)) + "s</b>.";
    } else message = null;
    render();
  }

  const basesEl = $("bases");
  BASES.forEach((b) => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.dataset.base = b; btn.textContent = b;
    btn.addEventListener("click", () => {
      base = b; carried = []; message = null;       // the value is kept; only its spelling changes
      render();
    });
    basesEl.appendChild(btn);
  });

  $("b-plus").addEventListener("click", () => step(1));
  $("b-minus").addEventListener("click", () => step(-1));
  $("b-fill").addEventListener("click", () => {     // park it one short of a carry
    const units = value % base;
    step((base - 1) - units);
    carried = []; message = "The units column is now full at <b>" + (base - 1) + "</b>. One more and it has to roll over.";
    render();
  });
  $("v").addEventListener("input", (e) => {
    value = +e.target.value; carried = []; message = null; render();
  });

  function postHeight() {
    const el = document.querySelector(".bench");
    const hh = Math.ceil(el.getBoundingClientRect().height);
    if (window.parent !== window && hh > 100) window.parent.postMessage({ type: "placevalue-height", height: hh }, "*");
  }

  function fitAll() { fit("columns"); }

  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { fitAll(); render(); }, 140);
  });
  window.addEventListener("load", () => { fitAll(); render(); setTimeout(postHeight, 250); });

  if (window.ResizeObserver) {
    let pending = false;
    const ro = new ResizeObserver(() => {
      const c = canvases.columns;
      const stale = !c || Math.abs($("columns").getBoundingClientRect().width - c.w) > 1;
      if (!stale || pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; fitAll(); render(); });
    });
    ro.observe($("columns"));
  }

  fitAll();
  render();        // one frame synchronously: never blank, no animation loop
})();
</script>
</body>
</html>
