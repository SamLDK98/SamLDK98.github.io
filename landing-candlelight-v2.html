<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Explanations | Sam Kirwan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:   #0a0705;
      --text: rgba(255,248,240,0.94);
      --dim:  rgba(255,239,224,0.30);
      --glow: 255, 128, 42;
      /* light state, driven by JS (unitless numbers) */
      --lx: 800;
      --ly: 420;
      --r:  0;
      --ga: 0;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      cursor: default;
    }

    .scene, .shade, .glow, .ember-field {
      position: fixed; inset: 0;
      z-index: 0; pointer-events: none;
    }
    .scene svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* the desk, barely visible in the dark */
    .scene.dim {
      opacity: 0.55;
      filter: brightness(0.22) contrast(1.1) saturate(0.6);
    }

    /* the same desk, lit — revealed through a flickering circular mask */
    .scene.lit {
      filter: brightness(1.02) contrast(1.15) saturate(1.25) sepia(0.22);
      -webkit-mask-image: radial-gradient(
        circle calc(var(--r) * 1px) at calc(var(--lx) * 1px) calc(var(--ly) * 1px),
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,0.95) 24%,
        rgba(0,0,0,0.55) 55%,
        rgba(0,0,0,0.18) 78%,
        transparent 100%);
      mask-image: radial-gradient(
        circle calc(var(--r) * 1px) at calc(var(--lx) * 1px) calc(var(--ly) * 1px),
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,0.95) 24%,
        rgba(0,0,0,0.55) 55%,
        rgba(0,0,0,0.18) 78%,
        transparent 100%);
    }

    /* warm candle colour pooled over the lit area */
    .glow {
      mix-blend-mode: screen;
      opacity: var(--ga);
      background: radial-gradient(
        circle calc(var(--r) * 0.9px) at calc(var(--lx) * 1px) calc(var(--ly) * 1px),
        rgba(255, 186, 92, 0.34) 0%,
        rgba(var(--glow), 0.22) 28%,
        rgba(168, 58, 16, 0.10) 58%,
        transparent 100%);
    }

    /* darkness pressing in from the edges */
    .shade {
      background:
        radial-gradient(ellipse at 50% 46%, transparent 26%, rgba(0,0,0,0.72) 88%),
        linear-gradient(90deg, rgba(0,0,0,0.5), transparent 32%, transparent 66%, rgba(0,0,0,0.58)),
        rgba(0,0,0,0.28);
    }

    .ember-field { overflow: hidden; mix-blend-mode: screen; }
    .ember {
      position: absolute; left: 0; top: 0;
      width: var(--size, 2px); height: var(--size, 2px);
      border-radius: 50%;
      background: rgba(255, 178, 88, 0.6);
      box-shadow: 0 0 8px rgba(255, 130, 40, 0.4);
      opacity: 0;
      transform: translate3d(var(--x), var(--y), 0) scale(0.35);
      animation: emberDrift var(--life, 1.6s) ease-out forwards;
    }
    @keyframes emberDrift {
      0%   { opacity: 0; transform: translate3d(var(--x), var(--y), 0) scale(0.35); }
      14%  { opacity: var(--alpha, 0.5); }
      100% { opacity: 0;
             transform: translate3d(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy)), 0) scale(1); }
    }

    main {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(2rem, 8vw, 7rem);
      padding: clamp(1.5rem, 5vh, 3rem) clamp(2rem, 8vw, 7rem);
    }
    @media (max-width: 680px) {
      main { flex-direction: column; align-items: flex-start; justify-content: center; }
    }

    .title {
      font-weight: 500;
      font-size: clamp(2.6rem, 7vw, 5.4rem);
      line-height: 0.98;
      letter-spacing: -0.015em;
      color: rgba(255, 250, 244, 0.95);
      text-shadow:
        0 1px 0 rgba(0,0,0,0.55),
        0 0 22px rgba(var(--glow), 0.40),
        0 0 60px rgba(var(--glow), 0.26),
        0 0 120px rgba(var(--glow), 0.16);
    }
    .title small {
      display: block;
      margin-top: 0.9rem;
      font-family: "Caveat", cursive;
      font-weight: 400;
      font-size: clamp(1.2rem, 2.2vw, 1.7rem);
      letter-spacing: 0.02em;
      color: rgba(255, 214, 160, 0.55);
      text-shadow: 0 0 18px rgba(var(--glow), 0.3);
    }

    nav { display: flex; flex-direction: column; gap: clamp(0.45rem, 1.9vh, 1rem); }
    nav a {
      display: inline-block;
      align-self: flex-start;
      text-decoration: none;
      color: var(--dim);
      font-weight: 500;
      font-size: clamp(1.15rem, 2.5vw, 1.75rem);
      line-height: 1.1;
      transition: color 0.45s ease, text-shadow 0.45s ease, opacity 0.45s ease,
                  transform 0.45s cubic-bezier(0.2,0.7,0.2,1);
      will-change: transform;
    }
    nav a:hover, nav a:focus-visible {
      outline: none;
      color: #fff6ec;
      transform: translateX(4px);
      text-shadow:
        0 0 14px rgba(var(--glow), 0.6),
        0 0 38px rgba(var(--glow), 0.45),
        0 0 90px rgba(var(--glow), 0.3);
    }
    nav:hover a:not(:hover),
    nav:focus-within a:not(:focus-visible):not(:hover) { opacity: 0.3; }

    /* ——— etching styles (apply inside both scene clones) ——— */
    .e {
      stroke: #ecc794; fill: none;
      stroke-width: 2.4;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .e.thin  { stroke-width: 1.5; }
    .e.faint { opacity: 0.55; }
    .t {
      fill: #f0cf9e;
      font-family: "Caveat", "Segoe Print", cursive;
      font-weight: 600;
    }
    .t.faint { opacity: 0.6; }
    .stain { stroke: #c89e66; fill: none; opacity: 0.4; }

    @media (prefers-reduced-motion: reduce) {
      .ember { animation: none; display: none; }
      .glow { opacity: 0.5; }
      .scene.lit {
        -webkit-mask-image: radial-gradient(circle 62vmax at 50vw 46vh,
          black 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.4) 65%, transparent 100%);
        mask-image: radial-gradient(circle 62vmax at 50vw 46vh,
          black 0%, rgba(0,0,0,0.9) 30%, rgba(0,0,0,0.4) 65%, transparent 100%);
      }
    }
  </style>
</head>
<body>
  <!-- shared defs: wood gradients, grain noise, hand-wobble filter -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#3b2515"/>
        <stop offset="0.28" stop-color="#33200f"/>
        <stop offset="0.55" stop-color="#3e2712"/>
        <stop offset="0.8"  stop-color="#2d1b0c"/>
        <stop offset="1"    stop-color="#241407"/>
      </linearGradient>
      <radialGradient id="knotG" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"    stop-color="#1c0f05"/>
        <stop offset="0.35" stop-color="#33200f"/>
        <stop offset="0.55" stop-color="#22130a"/>
        <stop offset="0.8"  stop-color="#3a2513"/>
        <stop offset="1"    stop-color="#3a2513" stop-opacity="0"/>
      </radialGradient>
      <filter id="grainF" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.004 0.11" numOctaves="4" seed="3" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.6" intercept="0"/></feComponentTransfer>
      </filter>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="w"/>
        <feDisplacementMap in="SourceGraphic" in2="w" scale="4.5"/>
      </filter>
    </defs>
  </svg>

  <div class="scene dim"  id="sceneDim" aria-hidden="true"></div>
  <div class="scene lit"  id="sceneLit" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <div class="ember-field" id="emberField" aria-hidden="true"></div>

  <main>

      <a href="apps.html">Apps</a>

  <script>
    (function () {
      // build the two desk layers from the same template
      var tpl = document.getElementById('sceneTpl');
      document.getElementById('sceneDim').appendChild(tpl.content.cloneNode(true));
      document.getElementById('sceneLit').appendChild(tpl.content.cloneNode(true));

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var root = document.documentElement.style;
      var emberField = document.getElementById('emberField');
      var W = innerWidth, H = innerHeight;

      var px = W / 2, py = H * 0.45;      // pointer target
      var lx = px, ly = py;               // light position (lags like a carried candle)
      var lastMove = performance.now();
      var lastEmber = 0, lastX = px, lastY = py;
      var flare = 0, jitter = 0;
      var t0 = performance.now();
      var pointerSeen = false;

      addEventListener('resize', function () { W = innerWidth; H = innerHeight; }, { passive: true });

      addEventListener('pointermove', function (e) {
        px = e.clientX; py = e.clientY;
        pointerSeen = true;
        lastMove = performance.now();
      }, { passive: true });

      addEventListener('pointerdown', function () {
        flare = 1;                        // bring the candle closer for a beat
      }, { passive: true });

      function spawnEmbers(now, speed, vx, vy) {
        if (speed < 3 || now - lastEmber < 34) return;
        lastEmber = now;
        var count = Math.min(7, 2 + Math.floor(speed / 24));
        for (var i = 0; i < count; i++) {
          var s = document.createElement('span');
          s.className = 'ember';
          var angle = Math.atan2(vy, vx) + Math.PI + (Math.random() - 0.5) * 1.8;
          var startR = 16 + Math.random() * 68;
          var drift = 22 + Math.random() * 54 + Math.min(speed, 90) * 0.4;
          s.style.setProperty('--x', (px + Math.cos(angle) * startR + (Math.random() - 0.5) * 24) + 'px');
          s.style.setProperty('--y', (py + Math.sin(angle) * startR + (Math.random() - 0.5) * 24) + 'px');
          s.style.setProperty('--dx', (Math.cos(angle) * drift + (Math.random() - 0.5) * 26) + 'px');
          s.style.setProperty('--dy', (Math.sin(angle) * drift - 12 - Math.random() * 30) + 'px');
          s.style.setProperty('--size', (1.2 + Math.random() * 2.4) + 'px');
          s.style.setProperty('--alpha', (0.28 + Math.random() * 0.4).toFixed(2));
          s.style.setProperty('--life', (1.0 + Math.random() * 1.2).toFixed(2) + 's');
          emberField.appendChild(s);
          s.addEventListener('animationend', function () { this.remove(); }, { once: true });
        }
      }

      function frame(now) {
        var idle = !pointerSeen || (now - lastMove > 3500);
        var tx = px, ty = py;
        if (idle) {
          // the candle wanders the desk on its own
          tx = W / 2 + Math.sin(now * 0.00013) * W * 0.3;
          ty = H / 2 + Math.sin(now * 0.00009 + 1.7) * H * 0.24;
        }

        var ease = idle ? 0.02 : 0.13;
        var pvx = tx - lx, pvy = ty - ly;
        lx += pvx * ease;
        ly += pvy * ease;

        // candle flicker: layered slow sines + a decaying random walk
        jitter += (Math.random() - 0.5) * 0.05;
        jitter *= 0.93;
        var f = 1
          + 0.05 * Math.sin(now * 0.0021)
          + 0.035 * Math.sin(now * 0.0043 + 2.1)
          + 0.028 * Math.sin(now * 0.0009 + 5.0)
          + Math.max(-0.12, Math.min(0.12, jitter));

        // light-the-candle ramp on load
        var s = Math.min(1, (now - t0) / 1600);
        s = 1 - (1 - s) * (1 - s);

        flare *= 0.94;

        var base = Math.min(W, H) * 0.55;
        var r = base * f * s * (1 + flare * 0.32);
        var ga = Math.max(0, Math.min(0.95, s * (0.55 + (f - 1) * 2.4 + flare * 0.3)));

        // faint positional tremble
        var ox = Math.sin(now * 0.0057) * 2.4 + Math.sin(now * 0.0031 + 1) * 1.6;
        var oy = Math.cos(now * 0.0049) * 2.2 + Math.sin(now * 0.0023 + 3) * 1.4;

        root.setProperty('--lx', (lx + ox).toFixed(1));
        root.setProperty('--ly', (ly + oy).toFixed(1));
        root.setProperty('--r', r.toFixed(1));
        root.setProperty('--ga', ga.toFixed(3));

        if (!idle) {
          var speed = Math.hypot(px - lastX, py - lastY);
          spawnEmbers(now, speed, px - lastX, py - lastY);
          lastX = px; lastY = py;
        }

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
