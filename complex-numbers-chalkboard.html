<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complex Numbers | Chalkboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Gochi+Hand&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --chalk:        #eef0e6;
      --chalk-dim:    rgba(238, 240, 230, 0.62);
      --chalk-faint:  rgba(238, 240, 230, 0.30);
      --yellow:       #f1e29a;
      --blue:         #a9d6ec;
      --pink:         #f0b6c6;
      --green:        #c0e0ac;
      --orange:       #f0c089;
      --board-1:      #2c3b34;
      --board-2:      #1d2823;
      --wood-1:       #6f4c2a;
      --wood-2:       #43290f;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background: #15110c;
      color: var(--chalk);
      font-family: "Kalam", "Caveat", cursive;
      display: grid;
      place-items: center;
      padding: clamp(0.6rem, 2.5vw, 2.2rem);
    }

    /* ---- wooden frame ---- */
    .frame {
      width: min(100%, 1180px);
      padding: clamp(10px, 1.6vw, 20px);
      border-radius: 14px;
      background:
        repeating-linear-gradient(91deg, rgba(0,0,0,0.16) 0 3px, transparent 3px 9px),
        linear-gradient(150deg, var(--wood-1), var(--wood-2));
      box-shadow:
        0 2px 0 rgba(255,255,255,0.10) inset,
        0 -3px 8px rgba(0,0,0,0.4) inset,
        0 30px 60px rgba(0,0,0,0.55);
    }

    /* ---- the slate ---- */
    .board {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      min-height: min(80vh, 740px);
      padding: clamp(1.4rem, 3.6vw, 3rem);
      background:
        radial-gradient(120% 90% at 30% 18%, rgba(255,255,255,0.045), transparent 55%),
        radial-gradient(140% 120% at 82% 88%, rgba(255,255,255,0.04), transparent 50%),
        linear-gradient(160deg, var(--board-1), var(--board-2));
      box-shadow: 0 0 0 2px rgba(0,0,0,0.35) inset, 0 12px 30px rgba(0,0,0,0.45) inset;
    }
    /* chalk-dust / smudge texture */
    .board::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      mix-blend-mode: screen;
      background:
        radial-gradient(60% 40% at 20% 30%, rgba(238,240,230,0.05), transparent 60%),
        radial-gradient(50% 35% at 75% 25%, rgba(238,240,230,0.04), transparent 60%),
        radial-gradient(70% 45% at 60% 80%, rgba(238,240,230,0.04), transparent 60%);
    }
    /* faint eraser arcs */
    .board::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background:
        repeating-radial-gradient(circle at 18% 78%, transparent 0 22px, rgba(238,240,230,0.018) 22px 26px, transparent 26px 50px),
        repeating-radial-gradient(circle at 88% 30%, transparent 0 26px, rgba(238,240,230,0.015) 26px 31px, transparent 31px 58px);
    }

    .board-content {
      position: relative;
      z-index: 3;
      max-width: 560px;
    }

    .eyebrow {
      font-family: "Caveat", cursive;
      font-size: clamp(1.05rem, 2.6vw, 1.5rem);
      color: var(--blue);
      letter-spacing: 0.02em;
      transform: rotate(-1.2deg);
      margin-bottom: 0.1rem;
      text-shadow: 0 0 1px rgba(169,214,236,0.4);
    }

    h1.title {
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: clamp(3rem, 9vw, 6rem);
      line-height: 0.92;
      margin: 0 0 0.2rem;
      transform: rotate(-1.4deg);
      text-shadow: 0 0 1px rgba(238,240,230,0.35), 1px 1px 0 rgba(0,0,0,0.25);
    }

    .title-rule { width: clamp(180px, 40%, 340px); height: 26px; margin: 0.1rem 0 1.6rem; transform: rotate(-0.6deg); }
    .title-rule path { fill: none; stroke: var(--yellow); stroke-width: 3; stroke-linecap: round; opacity: 0.85; }

    .contents-label {
      font-family: "Caveat", cursive;
      font-size: clamp(1.3rem, 3vw, 1.9rem);
      color: var(--chalk-dim);
      margin-bottom: 0.7rem;
      transform: rotate(-0.7deg);
    }
    .contents-label .dash { color: var(--pink); }

    ol.chapters {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: clamp(0.5rem, 1.6vw, 0.95rem);
    }

    .chapters li:nth-child(odd)  .chapter { transform: rotate(-0.7deg); }
    .chapters li:nth-child(even) .chapter { transform: rotate(0.6deg); }

    .chapter {
      display: inline-flex;
      align-items: baseline;
      gap: 0.7rem;
      text-decoration: none;
      color: var(--chalk);
      font-family: "Caveat", cursive;
      font-size: clamp(1.7rem, 4.4vw, 2.5rem);
      line-height: 1.05;
      padding: 0.05em 0.15em;
      position: relative;
      transition: color 0.18s ease, transform 0.18s ease, text-shadow 0.18s ease;
      text-shadow: 0 0 1px rgba(238,240,230,0.25);
    }
    .chapter .num {
      font-family: "Gochi Hand", cursive;
      font-size: 0.62em;
      color: var(--yellow);
      opacity: 0.9;
      min-width: 1.7em;
    }
    .chapter.supp .num { color: var(--blue); }

    /* hand-drawn underline that draws in on hover/focus */
    .chapter .underline {
      position: absolute;
      left: 0.1em;
      right: 0.1em;
      bottom: -0.18em;
      height: 12px;
      opacity: 0;
      transform: scaleX(0.2);
      transform-origin: left center;
      transition: opacity 0.2s ease, transform 0.28s ease;
    }
    .chapter .underline path { fill: none; stroke: var(--yellow); stroke-width: 3; stroke-linecap: round; }
    .chapter.supp .underline path { stroke: var(--blue); }

    .chapter:hover,
    .chapter:focus-visible {
      color: #fff;
      outline: none;
      transform: rotate(0deg) translateX(3px) scale(1.02);
      text-shadow: 0 0 6px rgba(238,240,230,0.45);
    }
    .chapter:hover .underline,
    .chapter:focus-visible .underline { opacity: 0.95; transform: scaleX(1); }

    .supp-divider {
      margin: 0.55rem 0 0.1rem;
      font-family: "Caveat", cursive;
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      color: var(--chalk-faint);
      transform: rotate(-0.5deg);
    }

    .footnote {
      margin-top: 1.8rem;
      font-family: "Caveat", cursive;
      font-size: clamp(1rem, 2.3vw, 1.3rem);
      color: var(--chalk-faint);
      transform: rotate(-0.6deg);
    }

    /* ---- chalk doodles ---- */
    .doodle {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      opacity: 0.8;
    }
    .doodle .ln { fill: none; stroke: var(--chalk); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }
    .doodle .ln-dim { fill: none; stroke: var(--chalk); stroke-width: 1.3; stroke-dasharray: 4 5; opacity: 0.4; }
    .doodle .ln-y { stroke: var(--yellow); opacity: 0.82; }
    .doodle .ln-b { stroke: var(--blue); opacity: 0.82; }
    .doodle .ln-p { stroke: var(--pink); opacity: 0.82; }
    .doodle .dot { fill: var(--yellow); }
    .doodle text { fill: var(--chalk-dim); font-family: "Caveat", cursive; }
    .doodle .accent { fill: var(--yellow); }

    .d-plane  { top: 4%;  right: 2%;  width: clamp(200px, 24vw, 290px); }
    .d-euler  { bottom: 5%; right: 3%; width: clamp(190px, 22vw, 270px); }
    .d-spiral { bottom: 6%; left: 50%; width: clamp(150px, 17vw, 210px); }
    .d-cycle  { top: 40%; right: 30%; width: clamp(150px, 16vw, 200px); opacity: 0.7; }

    .scribble {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      font-family: "Caveat", cursive;
      color: var(--chalk-faint);
      font-size: clamp(1.1rem, 2.4vw, 1.6rem);
      transform: rotate(-4deg);
    }
    .scribble.s1 { top: 30%; right: 6%; color: var(--pink); opacity: 0.6; }
    .scribble.s2 { bottom: 30%; right: 40%; transform: rotate(3deg); opacity: 0.5; }

    @media (max-width: 880px) {
      .doodle, .scribble { display: none; }
      .d-plane { display: block; position: static; width: 100%; max-width: 320px; margin: 1.6rem 0 0; opacity: 0.7; }
      .board-content { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <main class="board">

      <!-- ===== scattered chalk doodles ===== -->
      <svg class="doodle d-plane" viewBox="0 0 240 200" aria-hidden="true">
        <line class="ln" x1="20" y1="120" x2="220" y2="120" />
        <line class="ln" x1="110" y1="190" x2="110" y2="20" />
        <text x="205" y="112" font-size="15">Re</text>
        <text x="118" y="30" font-size="15">Im</text>
        <line class="ln-y" x1="110" y1="120" x2="178" y2="62" />
        <line class="ln-dim" x1="178" y1="62" x2="178" y2="120" />
        <line class="ln-dim" x1="178" y1="62" x2="110" y2="62" />
        <circle class="dot" cx="178" cy="62" r="4" />
        <path class="ln-b" d="M132 120 A22 22 0 0 0 127 104" />
        <text x="136" y="113" font-size="13" fill="#a9d6ec">θ</text>
        <text x="150" y="92" font-size="14" class="accent">r</text>
        <text x="150" y="50" font-size="17">z = a + bi</text>
        <text x="183" y="135" font-size="13">a</text>
        <text x="186" y="92" font-size="13">b</text>
      </svg>

      <svg class="doodle d-euler" viewBox="0 0 260 170" aria-hidden="true">
        <circle class="ln-b" cx="80" cy="90" r="58" />
        <line class="ln" x1="14" y1="90" x2="146" y2="90" />
        <line class="ln" x1="80" y1="150" x2="80" y2="30" />
        <line class="ln-y" x1="80" y1="90" x2="121" y2="49" />
        <circle class="dot" cx="121" cy="49" r="4" />
        <path class="ln-p" d="M104 90 A24 24 0 0 0 99 73" />
        <text x="150" y="60" font-size="17">e^(iθ)</text>
        <text x="150" y="86" font-size="14" class="ln-b" fill="#a9d6ec">= cosθ</text>
        <text x="150" y="106" font-size="14">+ i sinθ</text>
        <text x="22" y="150" font-size="15" fill="#f1e29a">e^(iπ) + 1 = 0</text>
      </svg>

      <svg class="doodle d-spiral" viewBox="0 0 200 180" aria-hidden="true">
        <line class="ln-dim" x1="10" y1="120" x2="190" y2="120" />
        <line class="ln-dim" x1="100" y1="175" x2="100" y2="40" />
        <path class="ln-y" d="M168 78 C150 40 96 36 78 70 C62 100 84 134 116 130 C140 127 150 104 138 88 C129 76 110 80 108 94" />
        <circle class="dot" cx="168" cy="78" r="4" />
        <circle class="dot" cx="78" cy="70" r="3.2" opacity="0.8" />
        <circle class="dot" cx="116" cy="130" r="2.8" opacity="0.65" />
        <text x="172" y="74" font-size="15">z</text>
        <text x="60" y="66" font-size="14">z²</text>
        <text x="120" y="146" font-size="13">z³</text>
      </svg>

      <svg class="doodle d-cycle" viewBox="0 0 200 140" aria-hidden="true">
        <text x="6"  y="78" font-size="18">1</text>
        <text x="92" y="22" font-size="18" class="accent">i</text>
        <text x="178" y="78" font-size="18">-1</text>
        <text x="92" y="132" font-size="18" class="accent">-i</text>
        <path class="ln-b" d="M30 66 A70 60 0 0 1 86 20" />
        <path class="ln-b" d="M110 18 A70 60 0 0 1 170 64" />
        <path class="ln-b" d="M170 80 A70 60 0 0 1 112 128" />
        <path class="ln-b" d="M84 128 A70 60 0 0 1 28 82" />
        <text x="64" y="108" font-size="13" fill="#a9d6ec">×i</text>
      </svg>

      <div class="scribble s1">√(-1) = i</div>
      <div class="scribble s2">|z| = √(a² + b²)</div>

      <!-- ===== the lesson written on the board ===== -->
      <div class="board-content">
        <div class="eyebrow">a short course in</div>
        <h1 class="title">Complex&nbsp;Numbers</h1>
        <svg class="title-rule" viewBox="0 0 340 26" aria-hidden="true">
          <path d="M4 16 C70 6, 130 22, 190 12 S300 6, 336 14" />
        </svg>

        <div class="contents-label">Contents <span class="dash">—</span></div>

        <ol class="chapters">
          <li>
            <a class="chapter" href="complex-numbers-chapter-1.html">
              <span class="num">1.</span><span>The Imaginary Unit</span>
              <svg class="underline" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7 C50 2, 110 11, 160 5 S196 4, 198 7"/></svg>
            </a>
          </li>
          <li>
            <a class="chapter" href="complex-numbers-chapter-2.html">
              <span class="num">2.</span><span>The Complex Plane</span>
              <svg class="underline" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C40 10, 120 2, 170 8 S196 9, 198 6"/></svg>
            </a>
          </li>
          <li>
            <a class="chapter" href="complex-numbers-chapter-3.html">
              <span class="num">3.</span><span>The Cartesian Plane</span>
              <svg class="underline" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7 C60 3, 110 10, 160 5 S196 6, 198 7"/></svg>
            </a>
          </li>
        </ol>

        <div class="supp-divider">~ supplements ~</div>

        <ol class="chapters" start="4">
          <li>
            <a class="chapter supp" href="complex-numbers-imaginary-unit.html">
              <span class="num">·</span><span>Misc</span>
              <svg class="underline" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C50 9, 120 3, 170 8 S196 7, 198 6"/></svg>
            </a>
          </li>
        </ol>

        <div class="footnote">… multiplication = stretch &amp; turn. pick a chapter ↑</div>
      </div>
    </main>
  </div>
</body>
</html>
